<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/basic}">
<head>
    <script th:src="@{https://cdn.jsdelivr.net/npm/sweetalert2@11}"></script>
    <!-- ======================== CSS 스타일 정의 ======================== -->
        <style>
            /* 전체 컨테이너 스타일 */
            .attendance-container {
              padding: 20px;
              background-color: #f8f9fc;
              min-height: calc(100vh - 200px);
            }

            /* 수강과정 정보 카드 (이미지와 동일한 디자인) */
            .course-info-card {
              background: white;
              border-radius: 12px;
              padding: 25px;
              margin-bottom: 25px;
              box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
              border-left: 4px solid #4e73df;
            }


            /* 과정명 스타일 (이미지와 동일) */
            .course-name {
              font-size: 1.3rem;
              font-weight: bold;
              color: #4e73df;
              margin-bottom: 15px;
            }

            /* 출석률 표시 영역 */
            .attendance-rate-display {
              display: flex;
              align-items: center;
              gap: 15px;
            }

            .rate-label {
              font-size: 1rem;
              color: #5a5c69;
              font-weight: 500;
            }

            .rate-value {
              font-size: 1.8rem;
              font-weight: bold;
              color: #4e73df;
            }

            /* 입퇴실 버튼 영역 (3개 버튼) */
            .attendance-buttons {
              display: flex;
              justify-content: center; /* 버튼들을 중앙 정렬 */
              gap: 15px; /* 버튼 간 간격 */
              align-items: center;
              margin: 20px 0;
              transition: opacity 0.3s ease, visibility 0.3s ease;
              opacity: 1;
              visibility: visible;
            }

            .attendance-buttons.hidden {
              opacity: 0;
              visibility: hidden;
              pointer-events: none; /* 클릭 방지 */
            }

            .btn-attendance {
              flex: 0 0 auto; /* 버튼이 자동으로 늘어나지 않게 */
              min-width: 120px; /* 최소 너비 설정 */
              max-width: 150px;
              padding: 12px 20px;
              border: none;
              border-radius: 8px;
              font-size: 1rem;
              font-weight: 600;
              cursor: pointer;
              transition: all 0.3s ease;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
            }

            /* 입실 버튼 (파란색) */
            .btn-checkin {
              background: #4e73df;
              color: white;
            }

            .btn-checkin:hover:not(:disabled) {
              background: #375cd3;
              transform: translateY(-2px);
              box-shadow: 0 6px 20px rgba(78, 115, 223, 0.4);
            }

            /* 퇴실 버튼 (초록색) */
            .btn-checkout {
              background: #1cc88a;
              color: white;
            }

            .btn-checkout:hover:not(:disabled) {
              background: #17a673;
              transform: translateY(-2px);
              box-shadow: 0 6px 20px rgba(28, 200, 138, 0.4);
            }

            /* 휴가신청 버튼 (노란색) */
            .btn-vacation {
              background: #f6c23e;
              color: white;
            }

            .btn-vacation:hover:not(:disabled) {
              background: #f4b619;
              transform: translateY(-2px);
              box-shadow: 0 6px 20px rgba(246, 194, 62, 0.4);
            }

            /* 비활성화된 버튼 스타일 */
            .btn-attendance:disabled {
              opacity: 0.6;
              cursor: not-allowed;
              transform: none !important;
              box-shadow: none !important;
            }

            /* 캘린더 컨테이너 (이미지와 동일한 디자인) */
            .calendar-container {
              background: white;
              border-radius: 12px;
              padding: 25px;
              box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            }

            /* 캘린더 헤더 (이전/다음 버튼과 월 표시) */
            .calendar-header {
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 20px;
              padding-bottom: 15px;
              border-bottom: 2px solid #e3e6f0;
            }

            .calendar-title {
              font-size: 1.5rem;
              font-weight: 600;
              color: #5a5c69;
              margin: 0;
            }

            .calendar-nav-btn {
              background: #4e73df;
              color: white;
              border: none;
              padding: 10px 16px;
              border-radius: 8px;
              cursor: pointer;
              font-size: 0.9rem;
              font-weight: 500;
              transition: all 0.3s ease;
            }

            .calendar-nav-btn:hover {
              background: #375cd3;
              transform: translateY(-1px);
            }

            /* 캘린더 그리드 (7열 달력 형태) */
            .calendar-grid {
              display: grid;
              grid-template-columns: repeat(7, 1fr);
              gap: 1px;
              border: 1px solid #e3e6f0;
              border-radius: 8px;
              overflow: hidden;
              background: #e3e6f0;
            }

            /* 캘린더 개별 날짜 셀 */
            .calendar-day {
              min-height: 100px;
              padding: 8px;
              background: white;
              position: relative;
              font-size: 0.85rem;
              cursor: pointer;
              transition: background-color 0.2s ease;
            }

            .calendar-day:hover {
              background: #f8f9fc;
            }

            /* 요일 헤더 (일~토) */
            .calendar-day.header {
              background: #f8f9fc;
              color: #5a5c69;
              font-weight: 600;
              text-align: center;
              min-height: 40px;
              display: flex;
              align-items: center;
              justify-content: center;
              cursor: default;
            }

            /* 오늘 날짜 표시 (이미지의 23일처럼 파란 테두리) */
            .calendar-day.today {
              background: #eef2ff;
              border: 2px solid #4e73df;
            }

            /* 주말 날짜 스타일 */
            .calendar-day.weekend {
              background: #f8f9fa;
              color: #858796;
            }

            /* 날짜 숫자 스타일 */
            .day-number {
              font-weight: 600;
              margin-bottom: 0; /* 기존 6px에서 0으로 변경 */
              color: #5a5c69;
              font-size: 0.9rem;
            }

            /* 출결 상태 표시 (이미지의 "수업중" 같은 상태) */
            .attendance-status {
              font-size: 0.7rem;
              padding: 3px 6px;
              border-radius: 4px;
              text-align: center;
              margin-bottom: 0; /* 기존 2px에서 0으로 변경 */
              display: block;
              font-weight: 500;
              line-height: 1.2;
              cursor: pointer;
            }

            /* 상태별 색상 정의 */
            .status-attendance { background: #d1eddf; color: #1cc88a; }
            .status-late { background: #fef0cd; color: #f6c23e; }
            .status-leave_early { background: #fadbd8; color: #ef4444; }
            .status-vacation { background: #e2e3ff; color: #8b5cf6; }
            .status-absence { background: #fadbd8; color: #ef4444; }
            .status-in_study { background: #cfe2ff; color: #4e73df; } /* 이미지의 "수업중" */
            .status-vacation_pending {
              background: #fff3cd;
              color: #856404;
              border: 1px dashed #ffc107; /* 점선 테두리로 미승인 상태 구분 */
            }


            /* 시간 표시 (이미지의 "입실 09:17" 같은 정보) */
            .time-display {
              font-size: 1.0rem;
              color: #858796;
              line-height: 1.1;
              margin-top: 2px;
            }

            /* 수업 없는 날 알림 */
            .no-class-alert {
              background: #f8f9fc;
              border: 1px solid #e3e6f0;
              border-left: 4px solid #858796;
              border-radius: 8px;
              padding: 20px;
              text-align: center;
              color: #5a5c69;
              margin: 20px 0;
            }

            /* 로딩 스피너 */
            .loading-spinner {
              display: none;
              text-align: center;
              padding: 30px;
            }

            /* 모달 스타일 개선 */
            .modal {
              z-index: 1050;
            }

            .modal-backdrop {
              z-index: 1040;
            }

            .modal-header {
              background: #4e73df;
              color: white;
              border-bottom: none;
              border-radius: 0.3rem 0.3rem 0 0;
            }

            .modal-title {
              color: white;
            }

            .modal-header .close {
              color: white;
              opacity: 1;
              text-shadow: none;
            }

            .modal-header .close:hover {
              color: #f8f9fa;
            }

            /* 상황별 모달 헤더 색상 */
            .modal-header.bg-warning {
              background: #f6c23e !important;
            }

            .modal-header.bg-danger {
              background: #e74a3b !important;
            }

            .modal-header.bg-success {
              background: #1cc88a !important;
            }

            /* 반응형 디자인 */
            @media (max-width: 768px) {
              .attendance-buttons {
                flex-direction: column;
                gap: 12px;
                margin: 15px 0;
              }

              .btn-attendance {
                min-width: auto;
                max-width: 100%;
                width: 100%;
              }

              .attendance-rate-display {
                flex-direction: column;
                text-align: center;
                gap: 5px;
              }

              /* 날짜 헤더 스타일 추가 */
              .day-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 6px;
              }

              .calendar-day {
                min-height: 80px;
                font-size: 0.75rem;
              }
            }

            @media (max-width: 480px) {
              .attendance-buttons {
                gap: 10px;
              }

              .btn-attendance {
                padding: 10px 16px;
                font-size: 0.9rem;
              }
            }

            /* ✅ 추가: 출결 및 진도 현황 스타일 */
            .attendance-progress-section {
              margin-top: 20px;
              padding: 20px;
              background: #f8f9fc;
              border-radius: 8px;
              border: 1px solid #e3e6f0;
            }

            .section-header {
              display: flex;
              align-items: center;
              gap: 10px;
              margin-bottom: 20px;
            }

            .section-title {
              font-size: 1.1rem;
              font-weight: 600;
              color: #5a5c69;
              margin: 0;
            }

            .section-date {
              font-size: 0.9rem;
              color: #858796;
              font-weight: normal;
            }

            /* 출결 통계 (5개 원형) */
            .attendance-stats {
              display: flex;
              justify-content: space-around;
              margin-bottom: 25px;
              padding: 0 10px;
              flex-wrap: wrap; /* 작은 화면에서 줄바꿈 허용 */
            }

            .stat-item {
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 8px;
              flex: 1; /* 동일한 크기로 배치 */
              min-width: 80px; /* 최소 너비 설정 */
            }

            .stat-circle {
              width: 65px;
              height: 65px;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              position: relative;
              box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            }

            /* 원형별 색상 */
            .attendance-circle {
              background: #6c7b8a; /* 이미지와 동일한 블루그레이 색상 */
              color: white;
            }

            .late-circle {
              background: #6c7b8a;
              color: white;
            }

            .early-circle {
              background: #6c7b8a;
              color: white;
            }

            .absence-circle {
              background: #6c7b8a;
              color: white;
            }

            .vacation-circle {
              background: #6c7b8a;
              color: white;
            }

            .stat-number {
              font-size: 1.6rem;;
              font-weight: bold;
            }

            .stat-label {
              font-size: 0.85rem;
              color: #5a5c69;
              font-weight: 500;
            }

            /* 과정 진행률 */
            .course-progress {
              margin-top: 15px;
            }

            .progress-text {
              display: flex;
              align-items: center;
              gap: 10px;
              margin-bottom: 10px;
            }

            .progress-label {
              font-size: 1rem;
              color: #5a5c69;
              font-weight: 500;
            }

            .progress-percentage {
              font-size: 1.1rem;
              font-weight: bold;
              color: #4e73df;
            }

            .progress-detail {
              font-size: 0.9rem;
              color: #858796;
            }

            /* 프로그레스 바 */
            .progress-bar-container {
              width: 100%;
              height: 30px;
              background: #e3e6f0;
              border-radius: 15px;
              overflow: hidden;
              position: relative;
            }

            .progress-bar-fill {
              height: 100%;
              background: linear-gradient(90deg, #4e73df 0%, #36b9cc 100%);
              border-radius: 15px;
              transition: width 0.3s ease;
              position: relative;
              display: flex;
              align-items: center;
              justify-content: flex-end;
              padding-right: 10px;
            }

            .progress-bar-text {
              font-size: 0.9rem;
              font-weight: 600;
              color: white;
              text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            }

            /* 반응형 */
            @media (max-width: 768px) {
              .attendance-stats {
                flex-wrap: wrap;
                gap: 15px;
                justify-content: center;
              }

              .stat-item {
                flex: 0 0 calc(50% - 10px); /* 2줄로 배치 (3+2) */
                max-width: 150px;
              }

              .stat-circle {
                width: 60px;
                height: 60px;
              }

              .stat-number {
                font-size: 1.4rem;
              }
            }

            @media (max-width: 480px) {
              .stat-item {
                flex: 0 0 calc(33.33% - 10px); /* 작은 화면에서는 3개씩 2줄 */
                min-width: 70px;
              }

              .stat-circle {
                width: 55px;
                height: 55px;
              }
            }

            /* 에러 메시지 스타일 */
            .error-message {
              margin-top: 5px;
              font-size: 0.875rem;
            }

            .error-message .text-danger {
              font-weight: 500;
            }

            /* 필수 입력 표시 */
            .text-danger {
              color: #e74a3b !important;
            }

            /* 날짜 입력 필드 비활성화 시 스타일 */
            input[type="date"]:disabled {
              background-color: #f8f9fa;
              cursor: not-allowed;
            }


        </style>
</head>

<body>

    <div layout:fragment="content" class="container-fluid">


        <!-- ======================== 메인 컨텐츠 영역 ======================== -->
        <div class="attendance-container">

            <!-- 페이지 제목 -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">출결 조회</h1>
            </div>

            <!-- 수강과정 정보 카드 -->
<div class="course-info-card">

    <!-- 과정명 표시 -->
    <div class="course-name" id="currentCourseName">
        <span th:if="${currentCourse}" th:text="${currentCourse.name}">과정명</span>
        <span th:unless="${currentCourse}">수강 중인 과정이 없습니다</span>
    </div>

    <!-- 나의 출결 및 진도 현황 (어제 기준) -->
<div class="attendance-progress-section">
    <!-- 섹션 제목 (어제 날짜 표시) -->
    <div class="section-header">
        <h6 class="section-title">나의 출결 및 진도 현황</h6>
        <span class="section-date" th:text="'(' + ${#temporals.format(#temporals.createNow().minusDays(1), 'yyyy.MM.dd')} + '기준)'">
            (2025.06.23기준)
        </span>
    </div>

    <!-- 출결 상태별 통계 (5개 원형 - 어제까지) -->
    <div class="attendance-stats">
        <div class="stat-item">
            <div class="stat-circle attendance-circle">
                <span class="stat-number" th:text="${attendanceStats?.attendanceCount ?: 0}">109
                </span>
            </div>
            <span class="stat-label">출석</span>
        </div>
        <div class="stat-item">
            <div class="stat-circle late-circle">
                <span class="stat-number" th:text="${attendanceStats?.lateCount ?: 0}">2</span>
            </div>
            <span class="stat-label">지각</span>
        </div>
        <div class="stat-item">
            <div class="stat-circle early-circle">
                <span class="stat-number" th:text="${attendanceStats?.earlyCount ?: 0}">3</span>
            </div>
            <span class="stat-label">조퇴</span>
        </div>
        <div class="stat-item">
            <div class="stat-circle absence-circle">
                <span class="stat-number" th:text="${attendanceStats?.absenceCount ?: 0}">0</span>
            </div>
            <span class="stat-label">결석</span>
        </div>
        <div class="stat-item">
            <div class="stat-circle vacation-circle">
                <span class="stat-number" th:text="${attendanceStats?.vacationCount ?: 0}">5</span>
            </div>
            <span class="stat-label">휴가</span>
        </div>
    </div>

    <!-- 과정 진행률 (실제 진행일수 기준) -->
    <div class="course-progress">
    <div class="progress-text">
        <span class="progress-label">과정진행률</span>
        <!-- 진행률: courseProgress가 null이 아닐 때만 값 출력, 아니면 0.0% -->
        <span class="progress-percentage">
            <span th:if="${courseProgress != null}" th:text="${courseProgress.progressRate + '%'}"></span>
            <span th:unless="${courseProgress != null}">0.0%</span>
        </span>
        <span class="progress-detail">
            <span th:if="${courseProgress != null}" th:text="'(' + ${courseProgress.progressedDays} + '/' + ${courseProgress.totalDays} + '일)'"></span>
            <span th:unless="${courseProgress != null}">(0/0일)</span>
        </span>
    </div>

        <!-- 프로그레스 바 -->
    <div class="progress-bar-container">
        <div class="progress-bar-fill"
             th:style="${courseProgress != null} ? 'width: ' + ${courseProgress.progressRate} + '%;' : 'width: 0%;'">
            <span class="progress-bar-text">
                <span th:if="${courseProgress != null}" th:text="${courseProgress.progressRate + '%'}"></span>
                <span th:unless="${courseProgress != null}">0.0%</span>
            </span>
        </div>
    </div>
</div>

</div>

</div>

            <!-- 입실/퇴실 버튼: 수업일에만 표시 -->
<div class="attendance-buttons">

    <th:block th:if="${isClassDay}">
        <button id="checkInBtn" class="btn-attendance btn-checkin" onclick="handleCheckIn()">
            <i class="fas fa-sign-in-alt"></i> 입실
        </button>
        <button id="checkOutBtn" class="btn-attendance btn-checkout" onclick="handleCheckOut()">
            <i class="fas fa-sign-out-alt"></i> 퇴실
        </button>
    </th:block>

    <th:block th:if="${currentCourse != null and currentCourse.endDate != null and #temporals.createNow().toLocalDate().isBefore(currentCourse.endDate.plusDays(1))}">
        <button id="vacationBtn" class="btn-attendance btn-vacation" data-toggle="modal" data-target="#vacationModal">
            <i class="fas fa-calendar-alt"></i> 휴가신청
        </button>
    </th:block>

</div>





            <!-- 수업 없는 날 알림 -->
            <div th:unless="${isClassDay}" class="no-class-alert">
                <i class="fas fa-info-circle mr-2"></i>
                <strong>오늘은 수업이 없는 날입니다.</strong>
            </div>

            <!-- 출결 캘린더  -->
            <div class="calendar-container">
                <div class="calendar-header">
                    <button class="calendar-nav-btn" onclick="changeMonth(-1)">
                        <i class="fas fa-chevron-left mr-1"></i>이전
                    </button>
                    <h4 class="calendar-title" id="currentMonth">2025년 6월</h4>
                    <button class="calendar-nav-btn" onclick="changeMonth(1)">
                        다음<i class="fas fa-chevron-right ml-1"></i>
                    </button>
                </div>

                <!-- 로딩 스피너 -->
                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <p class="mt-2">출결 정보를 불러오는 중...</p>
                </div>

                <!-- 캘린더 그리드 (JavaScript로 동적 생성) -->
                <div class="calendar-grid" id="calendarGrid" th:if="${currentCourse != null}">
                    <!-- JavaScript에서 요일 헤더와 날짜들을 동적으로 생성 -->
                </div>
            </div>

        </div>

        <!-- ======================== 모달들 ======================== -->

        <!-- 입실 완료 모달 -->
        <div class="modal fade" id="checkInModal" tabindex="-1" role="dialog" aria-labelledby="checkInModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header bg-success">
                        <h5 class="modal-title" id="checkInModalLabel">

    <!-- ======================== JavaScript 영역 (모든 JS는 script fragment 안에 위치) ======================== -->
    <script layout:fragment="script" th:inline="javascript">


        // ======================== Thymeleaf 변수를 JavaScript로 변환 ========================
        const learnerEnrollmentId = /*[[${learnerEnrollmentId}]]*/ null;
        const today = /*[[${today}]]*/ null;
        const isClassDay = /*[[${isClassDay}]]*/ false;
        const todayParticipation = /*[[${todayParticipation}]]*/ null;
        const attendanceRate = /*[[${attendanceRate}]]*/ 0;
        const currentCourse = /*[[${currentCourse}]]*/ null;
        const loginUser = /*[[${loginUser}]]*/ null;

        // ======================== 전역 변수 선언 ========================
        let currentDate = new Date(); // 캘린더 현재 표시 월
        let participationData = {}; // 월별 출결 데이터 저장
        let selectedVacationId = null; // 삭제할 휴가 ID
        let availableVacationDates = [];

        // ======================== 페이지 로드 시 초기화 ========================
        document.addEventListener('DOMContentLoaded', function() {
            // ✅ 전역 변수 초기화
            window.selectedCourseId = currentCourse?.id || null;
            window.selectedLearnerEnrollmentId = learnerEnrollmentId || null;

            // console.log('=== 출결 조회 페이지 초기화 시작 ===');
            // console.log('초기 전역 변수 설정:', {
            //     selectedCourseId: window.selectedCourseId,
            //     selectedLearnerEnrollmentId: window.selectedLearnerEnrollmentId,
            //     currentCourse: currentCourse,
            //     learnerEnrollmentId: learnerEnrollmentId
            // });
            //
            // console.log('기본 데이터:', { learnerEnrollmentId, today, isClassDay, currentCourse, todayParticipation });
            // console.log('현재 출석률:', attendanceRate + '%');

            // 1. basic.html의 courseSelector 설정 (상단 과정 선택 드롭다운)
            setupCourseSelector();
            // 2. 입퇴실 버튼 상태 업데이트 (노션 로직 적용)
            updateButtonStates();

            // 초기 로드 시 현재 과정이므로 버튼들 표시
            showActionButtons();

            // 3. 캘린더 초기화 및 렌더링
            initializeCalendar();
            renderCalendar();

            const vacationReason = document.getElementById('vacationReason');
            if (vacationReason) {
                vacationReason.addEventListener('input', function() {
                    if (this.value.trim()) {
                        document.getElementById('reasonError').style.display = 'none';
                    }
                });
            }

            // console.log('=== 출결 조회 페이지 초기화 완료 ===');
        });

        // ======================== basic.html의 courseSelector 설정 ========================
        /**
         * basic.html 레이아웃의 상단 과정 선택 드롭다운에 현재/과거 과정 목록 설정
         * 실제 API(/participation/courses/{userId})를 호출하여 데이터 로드
         */
        function setupCourseSelector() {
            // console.log('=== courseSelector 설정 시작 ===');

            // 로그인 사용자 정보 확인
            if (!loginUser || !loginUser.id) {
                console.warn('로그인 사용자 정보가 없습니다.');
                return;
            }

            // basic.html의 courseSelector 요소 찾기
            const courseSelector = document.getElementById('courseSelector');
            if (!courseSelector) {
                console.warn('courseSelector 요소를 찾을 수 없습니다.');
                return;
            }

            if (courseSelector) {
                courseSelector.addEventListener('change', handleCourseChange);
            }



            // 과정 목록 API 호출
            fetch(`/participation/courses/${loginUser.id}`)
            .then(response => {
                // console.log('과정 목록 API 응답 상태:', response.status);
                return response.json();
            })
            .then(data => {
                // console.log('과정 목록 API 응답 데이터:', data);

                if (data.success) {
                    // 기존 옵션 제거
                    courseSelector.innerHTML = '';

                    // 현재 진행 중인 과정 추가
                    if (data.currentCourse) {
                        const currentOption = document.createElement('option');
                        currentOption.value = data.currentCourse.id;
                        currentOption.textContent = `${data.currentCourse.name}`;
                        currentOption.selected = true;
                        courseSelector.appendChild(currentOption);

                        // console.log('현재 과정 추가:', data.currentCourse.name);
                    }

                    // 과거 완료된 과정들 추가
                    if (data.previousCourses && data.previousCourses.length > 0) {
                        data.previousCourses.forEach(course => {
                            const option = document.createElement('option');
                            option.value = course.id;
                            option.textContent = `${course.name}`;
                            courseSelector.appendChild(option);
                        });

                        // console.log('과거 과정 추가:', data.previousCourses.length + '개');
                    }

                    // console.log('courseSelector 설정 완료');
                } else {
                    console.error('과정 목록 조회 실패:', data.message);
                    // 실패 시 현재 과정만 표시 (fallback)
                    addFallbackCourse(courseSelector);
                }
            })
            .catch(error => {
                console.error('과정 목록 조회 오류:', error);
                // 오류 시 현재 과정만 표시 (fallback)
                addFallbackCourse(courseSelector);
            });
        }

        /**
         * API 호출 실패 시 현재 과정만 표시하는 fallback 함수
         */
        function addFallbackCourse(courseSelector) {
            if (currentCourse) {
                courseSelector.innerHTML = '';
                const fallbackOption = document.createElement('option');
                fallbackOption.value = currentCourse.id;
                fallbackOption.textContent = `[진행중] ${currentCourse.name}`;
                fallbackOption.selected = true;
                courseSelector.appendChild(fallbackOption);
                // console.log('fallback 과정 설정:', currentCourse.name);
            }
        }

        // ======================== 시간 계산 유틸리티 함수 ========================
        /**
         * 시간에 분 추가하는 함수 (lesson_end_time + 10분 계산용)
         * @param {string} timeString - "HH:MM" 형식의 시간
         * @param {number} minutes - 추가할 분 수
         * @returns {string} - "HH:MM" 형식의 결과 시간
         */
        function addMinutesToTime(timeString, minutes) {
            const [hours, mins] = timeString.split(':').map(Number);
            const totalMinutes = hours * 60 + mins + minutes;
            const newHours = Math.floor(totalMinutes / 60);
            const newMins = totalMinutes % 60;
            return `${String(newHours).padStart(2, '0')}:${String(newMins).padStart(2, '0')}`;
        }

        // ======================== 버튼 상태 관리 ========================
        /**
         * 입실/퇴실 버튼의 활성화/비활성화 상태를 노션 로직에 따라 업데이트
         * - 지각자는 lesson_end_time 전까지 퇴실 불가
         * - lesson_end_time + 10분 후에는 모든 사람 퇴실 불가
         * - 휴가 신청자는 입퇴실 불가
         */
        function updateButtonStates() {
            // console.log('=== 버튼 상태 업데이트 시작 ===');

            const checkInBtn = document.getElementById('checkInBtn');
            const checkOutBtn = document.getElementById('checkOutBtn');

            // 기본 조건 확인
            if (!isClassDay || !learnerEnrollmentId || !checkInBtn || !checkOutBtn) {
                // console.log('기본 조건 미충족:', {
                //     isClassDay,
                //     learnerEnrollmentId,
                //     checkInBtn: !!checkInBtn,
                //     checkOutBtn: !!checkOutBtn
                // });
                return;
            }

            // 과정 정보 없으면 모든 버튼 비활성화
            if (!currentCourse) {
                // console.log('과정 정보 없음 - 모든 버튼 비활성화');
                checkInBtn.disabled = true;
                checkOutBtn.disabled = true;
                return;
            }

            // console.log('현재 과정 정보:', currentCourse);
            // console.log('오늘 출결 정보:', todayParticipation);

            // 현재 시간 정보
            const now = new Date();
            const currentTime = now.toTimeString().substring(0, 5); // HH:MM 형식
            const lessonStartTime = currentCourse.lessonStartTime;
            const lessonEndTime = currentCourse.lessonEndTime;

            // console.log('시간 정보:', { currentTime, lessonStartTime, lessonEndTime });

            // 오늘 출결 기록이 있는 경우
            if (todayParticipation) {
                const hasCheckedIn = todayParticipation.checkIn;
                const hasCheckedOut = todayParticipation.checkOut;
                const dbStatus = todayParticipation.status;
                const displayStatus = todayParticipation.displayStatus;

                const isVacation = dbStatus === 'VACATION' || dbStatus === 'VACATION_PENDING';
                const isLate = dbStatus === 'LATE';

                // console.log('출결 상태 상세:', {
                //     hasCheckedIn: !!hasCheckedIn,
                //     hasCheckedOut: !!hasCheckedOut,
                //     dbStatus,
                //     displayStatus,
                //     isVacation,
                //     isLate
                // });

                // 입실 버튼: 이미 입실했거나 휴가면 비활성화
                checkInBtn.disabled = hasCheckedIn || isVacation;
                // console.log('입실 버튼 상태:', checkInBtn.disabled ? '비활성화' : '활성화');

                // 퇴실 버튼 로직
                if (!hasCheckedIn) {
                    checkOutBtn.disabled = true;
                    // console.log('퇴실 버튼 비활성화 - 입실하지 않음');
                } else if (hasCheckedOut) {
                    checkOutBtn.disabled = true;
                    // console.log('퇴실 버튼 비활성화 - 이미 퇴실함');
                } else if (isVacation) {
                    checkOutBtn.disabled = true;
                    // console.log('퇴실 버튼 비활성화 - 휴가');
                } else {
                    // 핵심 로직: 지각자는 lesson_end_time 전까지 퇴실 불가
                    if (isLate && lessonEndTime && currentTime < lessonEndTime.substring(0, 5)) {
                        checkOutBtn.disabled = true;
                        // console.log('퇴실 버튼 비활성화 - 지각자 수업시간 중 (lesson_end_time 전)');
                        // console.log(`현재시간 ${currentTime} < 수업종료시간 ${lessonEndTime.substring(0, 5)}`);
                    } else {
                        // lesson_end_time + 10분 후에는 모든 사람 퇴실 불가
                        if (lessonEndTime) {
                            const endTimePlus10 = addMinutesToTime(lessonEndTime, 10);
                            if (currentTime > endTimePlus10) {
                                checkOutBtn.disabled = true;
                                // console.log('퇴실 버튼 비활성화 - 시간 초과 (lesson_end_time + 10분 후)');
                                // console.log(`현재시간 ${currentTime} > 제한시간 ${endTimePlus10}`);
                            } else {
                                checkOutBtn.disabled = false;
                                // console.log('퇴실 버튼 활성화 - 퇴실 가능');
                                // console.log(`지각여부: ${isLate}, 현재시간: ${currentTime}, 수업종료: ${lessonEndTime.substring(0, 5)}, 제한시간: ${endTimePlus10}`);
                            }
                        } else {
                            checkOutBtn.disabled = false;
                            // console.log('퇴실 버튼 활성화 - 시간 정보 없음');
                        }
                    }
                }
            } else {
                // 오늘 출결 기록이 없는 경우
                // console.log('오늘 출결 정보 없음 - 기본 상태 설정');
                checkInBtn.disabled = false;  // 입실 가능
                checkOutBtn.disabled = true;  // 퇴실 불가
            }

            // console.log('=== 최종 버튼 상태 ===');
            // console.log('입실 버튼:', checkInBtn.disabled ? '비활성화' : '활성화');
            // console.log('퇴실 버튼:', checkOutBtn.disabled ? '비활성화' : '활성화');
        }

        // ======================== 캘린더 관련 함수들 ========================
        /**
         * 캘린더 초기화 (현재 월 표시)
         */
        function initializeCalendar() {
            const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월',
                                '7월', '8월', '9월', '10월', '11월', '12월'];

            const currentMonthElement = document.getElementById('currentMonth');
            if (currentMonthElement) {
                currentMonthElement.textContent =
                    `${currentDate.getFullYear()}년 ${monthNames[currentDate.getMonth()]}`;
            }
        }

        /**
         * 월 변경 함수 (이전/다음 버튼 클릭 시)
         * @param {number} direction - -1(이전달) 또는 1(다음달)
         */
        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            initializeCalendar();
            renderCalendar();
        }

        /**
         * 완성된 캘린더 렌더링 (선택된 과정의 출결 데이터 표시)
         */
        function renderCalendar() {
            const calendarGrid = document.getElementById('calendarGrid');
            const loadingSpinner = document.getElementById('loadingSpinner');

            // ✅ 핵심: 선택된 과정의 learnerEnrollmentId 사용 (과거 과정 지원)
            const currentLearnerEnrollmentId = window.selectedLearnerEnrollmentId || learnerEnrollmentId;

            if (!calendarGrid || !currentLearnerEnrollmentId) {
                console.warn('캘린더 렌더링 조건 미충족:', {
                    calendarGrid: !!calendarGrid,
                    learnerEnrollmentId: currentLearnerEnrollmentId
                });
                return;
            }

            // console.log('캘린더 렌더링 시작:', {
            //     currentLearnerEnrollmentId,
            //     currentDate: currentDate.toDateString()
            // });

            // 로딩 스피너 표시
            if (loadingSpinner) {
                loadingSpinner.style.display = 'block';
            }
            calendarGrid.innerHTML = '';

            // 요일 헤더 생성 (일~토)
            const dayHeaders = ['일', '월', '화', '수', '목', '금', '토'];
            dayHeaders.forEach(day => {
                const headerDiv = document.createElement('div');
                headerDiv.className = 'calendar-day header';
                headerDiv.textContent = day;
                calendarGrid.appendChild(headerDiv);
            });

            // 월별 출결 데이터 API 호출
            const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-01`;
            const timestamp = new Date().getTime(); // 캐시 방지

            // console.log('월별 출결 데이터 요청:', {
            //     learnerEnrollmentId: currentLearnerEnrollmentId,
            //     dateStr,
            //     apiUrl: `/participation/monthly/${currentLearnerEnrollmentId}/${dateStr}`
            // });

            fetch(`/participation/monthly/${currentLearnerEnrollmentId}/${dateStr}?t=${timestamp}`)
            .then(response => {
                // console.log('API 응답 상태:', response.status);
                return response.json();
            })
            .then(data => {
                // console.log('월별 출결 데이터 조회 결과:', data);

                if (data.success) {
                    // ✅ 핵심: 최신 데이터로 participationData 업데이트
                    participationData = {};
                    data.participations.forEach(p => {
                        participationData[p.participationDate] = p;
                    });

                    // console.log('업데이트된 participationData:', participationData);
                    // console.log('출결 데이터 개수:', data.participations.length);
                } else {
                    console.warn('월별 출결 데이터 조회 실패:', data.message);
                    participationData = {}; // 실패 시 빈 객체로 초기화
                }

                // 달력 날짜 생성
                generateCurrentMonthDaysOnly();
            })
            .catch(error => {
                console.error('월별 데이터 조회 오류:', error);
                participationData = {}; // 오류 시 빈 객체로 초기화
                generateCurrentMonthDaysOnly();
            })
            .finally(() => {
                // 로딩 스피너 숨김
                if (loadingSpinner) {
                    loadingSpinner.style.display = 'none';
                }
                // console.log('캘린더 렌더링 완료');
            });
        }

        /**
         * 과정 변경 처리
         */
        function handleCourseChange(event) {
            const selectedCourseId = parseInt(event.target.value);

            // console.log('과정 변경:', selectedCourseId);

            if (!selectedCourseId) return;

            // ✅ 현재 과정 재선택한 경우
            if (selectedCourseId == currentCourse?.id) {
                window.selectedLearnerEnrollmentId = learnerEnrollmentId; // 기본값으로 복원
                updateStatsForSelectedCourse(); // 기존 함수 재활용
                renderCalendar(); // 기존 함수 재활용
                // 현재 과정이므로 버튼들 표시
                showActionButtons();
                // 현재 과정명으로 복원
                updateCourseNameDisplay(currentCourse.name);
                return;
            }

            // ✅ 다른 과정 선택한 경우
            fetch(`/participation/learner-enrollment/${loginUser.id}/${selectedCourseId}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.selectedLearnerEnrollmentId = data.learnerEnrollmentId;
                    updateStatsForSelectedCourse(); // 기존 함수 재활용
                    renderCalendar(); // 기존 함수 재활용

                    // 과거 과정이므로 버튼들 숨김
                    hideActionButtons();

                    // 선택된 과정의 정보 조회하여 과정명 업데이트
                    updateSelectedCourseInfo(selectedCourseId);
                } else {
                    alert('해당 과정의 수강 정보를 찾을 수 없습니다.');
                }
            })
            .catch(error => {
                console.error('과정 정보 조회 오류:', error);
                alert('과정 정보 조회 중 오류가 발생했습니다.');
            });
        }

        /**
         * 현재 월의 날짜만 생성 (이전/다음달 날짜는 표시하지 않음)
         */
        function generateCurrentMonthDaysOnly() {
            const calendarGrid = document.getElementById('calendarGrid');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // 현재 월의 첫째 날과 마지막 날
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            // 첫 주의 빈 칸 채우기 (일요일부터 시작)
            const firstDayOfWeek = firstDay.getDay();
            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day';
                emptyDiv.style.backgroundColor = '#f8f9fc';
                calendarGrid.appendChild(emptyDiv);
            }

            // 현재 월의 날짜들만 생성
            for (let date = 1; date <= lastDay.getDate(); date++) {
                const currentDay = new Date(year, month, date);
                const dayDiv = createCurrentMonthDayCell(currentDay, date);
                calendarGrid.appendChild(dayDiv);
            }

            // 마지막 주의 빈 칸 채우기 (6주 완성)
            const totalCells = calendarGrid.children.length - 7; // 헤더 제외
            const remainingCells = 42 - 7 - totalCells; // 6주 * 7일 - 헤더 - 현재 셀
            for (let i = 0; i < remainingCells; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day';
                emptyDiv.style.backgroundColor = '#f8f9fc';
                calendarGrid.appendChild(emptyDiv);
            }
        }

        /**
         * 현재 월의 개별 날짜 셀 생성 (출결 정보 포함)
         * @param {Date} date - 날짜 객체
         * @param {number} dayNumber - 날짜 숫자
         * @returns {HTMLElement} - 생성된 날짜 셀 요소
         */
        function createCurrentMonthDayCell(date, dayNumber) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day';

            const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(dayNumber).padStart(2, '0')}`;
            const isToday = dateStr === today;
            const isWeekend = date.getDay() === 0 || date.getDay() === 6;

            if (isToday) dayDiv.classList.add('today');
            if (isWeekend) dayDiv.classList.add('weekend');

            //  날짜와 상태를 같은 줄에 표시하는 헤더 div 생성
            const dayHeaderDiv = document.createElement('div');
            dayHeaderDiv.className = 'day-header';
            dayHeaderDiv.style.display = 'flex';
            dayHeaderDiv.style.justifyContent = 'space-between';
            dayHeaderDiv.style.alignItems = 'center';
            dayHeaderDiv.style.marginBottom = '6px';

            // 날짜 번호
            const dayNumberDiv = document.createElement('div');
            dayNumberDiv.className = 'day-number';
            dayNumberDiv.textContent = dayNumber;
            dayNumberDiv.style.margin = '0'; // 기존 margin 제거
            dayHeaderDiv.appendChild(dayNumberDiv);

            // 출결 정보가 있는 경우 상태를 날짜 옆에 표시
            if (participationData[dateStr]) {
                const participation = participationData[dateStr];

                if (participation.isStatusVisible) {
                    const statusDiv = document.createElement('div');
                    statusDiv.className = `attendance-status status-${participation.displayStatus.toLowerCase()}`;
                    statusDiv.textContent = participation.displayStatusText;
                    statusDiv.style.marginBottom = '0'; // 기존 margin 제거

                    // 휴가(미승인) 및 휴가(승인완료) 모두 클릭 가능
                    if (participation.displayStatus === 'VACATION_PENDING') {
                        // 휴가(미승인) 클릭 시 삭제 모달
                        statusDiv.addEventListener('click', function(e) {
                            e.stopPropagation();
                            selectedVacationId = participation.id;
                            openVacationDeleteModal();
                        });
                        statusDiv.style.cursor = 'pointer';
                        statusDiv.title = '클릭하여 휴가 삭제';
                    } else if (participation.displayStatus === 'VACATION') {
                        // 휴가(승인완료) 클릭 시 삭제 모달
                        statusDiv.addEventListener('click', function(e) {
                            e.stopPropagation();
                            selectedVacationId = participation.id;
                            openVacationDeleteModal();
                        });
                        statusDiv.style.cursor = 'pointer';
                        statusDiv.title = '클릭하여 휴가 삭제';
                    }

                    dayHeaderDiv.appendChild(statusDiv);
                }
            }

            //  헤더(날짜+상태)를 dayDiv에 추가
            dayDiv.appendChild(dayHeaderDiv);

            //  입실/퇴실 시간을 각각 별도 줄로 표시
            if (participationData[dateStr]) {
                const participation = participationData[dateStr];

                if (participation.checkIn || participation.checkOut) {
                    // 입실 시간 표시
                    if (participation.checkIn) {
                        const checkInDiv = document.createElement('div');
                        checkInDiv.className = 'time-display';
                        const checkInTime = new Date(participation.checkIn);
                        checkInDiv.textContent = `입실: ${checkInTime.getHours().toString().padStart(2, '0')}:${checkInTime.getMinutes().toString().padStart(2, '0')}`;
                        dayDiv.appendChild(checkInDiv);
                    }

                    // 퇴실 시간 표시
                    if (participation.checkOut) {
                        const checkOutDiv = document.createElement('div');
                        checkOutDiv.className = 'time-display';
                        const checkOutTime = new Date(participation.checkOut);
                        checkOutDiv.textContent = `퇴실: ${checkOutTime.getHours().toString().padStart(2, '0')}:${checkOutTime.getMinutes().toString().padStart(2, '0')}`;
                        dayDiv.appendChild(checkOutDiv);
                    }
                }
            }

            return dayDiv;
        }


        // ======================== 입실 처리 함수 ========================
        /**
         * 입실 처리 함수 (입실 성공 시 모달 표시)
         */
        function handleCheckIn() {
            // console.log('=== 입실 처리 시작 ===');


            // 필수 데이터 검증
            if (!learnerEnrollmentId || !today) {
                alert('입실 처리를 위한 정보가 부족합니다.');
                return;
            }

            const requestData = {
                learnerEnrollmentId: learnerEnrollmentId,
                participationDate: today
            };

            // 입실 API 호출
            fetch('/participation/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            })
            .then(response => response.json())
            .then(data => {
                // console.log('입실 처리 결과:', data);

                if (data.success) {
                    // 성공 시 입실 완료 모달 표시
                    if (typeof $ !== 'undefined') {
                        $('#checkInModal').modal('show');

                        // 2초 후 페이지 새로고침
                        setTimeout(() => location.reload(), 2000);
                    } else {
                        // jQuery가 없는 경우 기본 alert 사용
                        alert('입실이 정상 처리되었습니다.');
                        location.reload();
                    }
                } else {
                    alert('출결기록이 생성되지 않았습니다.' + data.message);
                }
            })
            .catch(error => {
                console.error('입실 처리 오류:', error);
                alert('입실 처리 중 오류가 발생했습니다.');
            });
        }

        // ======================== 퇴실 처리 함수들 ========================
        /**
         * 퇴실 처리 함수 (상황별 모달 메시지 표시)
         */
        function handleCheckOut() {
            // console.log('=== 퇴실 처리 시작 ===');


            // 버튼 상태 재확인
            const checkOutBtn = document.getElementById('checkOutBtn');
            if (checkOutBtn && checkOutBtn.disabled) {
                // console.log('퇴실 버튼이 비활성화 상태입니다.');

                // 지각자인 경우 구체적인 메시지
                if (todayParticipation && todayParticipation.status === 'LATE') {
                    alert('지각자는 수업 종료 시간까지 퇴실할 수 없습니다.');
                } else {
                    alert('현재 퇴실할 수 없는 상태입니다.');
                }
                return;
            }

            // 필수 데이터 검증
            if (!learnerEnrollmentId || !today || !currentCourse) {
                alert('퇴실 처리를 위한 정보가 부족합니다.');
                return;
            }

            // console.log('퇴실 상태 예측 API 호출');

            // 현재 시간을 올바른 형식으로 변환 (타임존 문제 해결)
            const now = new Date();
            const timeString = now.getFullYear() + '-' +
                               String(now.getMonth() + 1).padStart(2, '0') + '-' +
                               String(now.getDate()).padStart(2, '0') + 'T' +
                               String(now.getHours()).padStart(2, '0') + ':' +
                               String(now.getMinutes()).padStart(2, '0') + ':' +
                               String(now.getSeconds()).padStart(2, '0');

            // console.log('예측에 사용할 시간:', timeString);

            // 퇴실 상태 예측 API 호출
            fetch('/participation/predict-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                                         learnerEnrollmentId: learnerEnrollmentId,
                                         participationDate: today,
                                         predictedCheckOut: timeString
                                     })
            })
            .then(response => response.json())
            .then(data => {
                // console.log('퇴실 상태 예측 결과:', data);

                if (data.success) {
                    let message = '퇴실하시겠습니까?';
                    let headerClass = '';

                    // 노션 로직에 따른 상황별 메시지 설정
                    switch (data.predictedStatus) {
                        case 'ABSENCE':
                            message = '지금 퇴실하시면 결석처리됩니다. 진행하시겠습니까?';
                            headerClass = 'bg-danger';
                            break;
                        case 'LEAVE_EARLY':
                            message = '지금 퇴실하시면 조퇴처리됩니다. 진행하시겠습니까?';
                            headerClass = 'bg-warning';
                            break;
                        case 'NOT_ALLOWED':
                            alert('지각자는 수업 종료 시간 전까지 퇴실할 수 없습니다.');
                            return;
                        default:
                            message = '퇴실하시겠습니까?';
                            headerClass = '';
                    }

                    // 모달 메시지와 스타일 설정
                    const messageElement = document.getElementById('checkOutModalMessage');
                    const headerElement = document.getElementById('checkOutModalHeader');

                    if (messageElement) {
                        messageElement.textContent = message;
                    }

                    if (headerElement) {
                        // 기존 클래스 제거 후 새 클래스 추가
                        headerElement.className = 'modal-header';
                        if (headerClass) {
                            headerElement.classList.add(headerClass);
                        }
                    }

                    // Bootstrap 모달 표시
                    if (typeof $ !== 'undefined') {
                        $('#checkOutModal').modal('show');
                    } else {
                        // jQuery가 없는 경우 기본 confirm 사용
                        if (confirm(message)) {
                            confirmCheckOut();
                        }
                    }
                } else {
                    alert('퇴실 상태 예측에 실패했습니다: ' + data.message);
                }
            })
            .catch(error => {
                console.error('퇴실 상태 예측 오류:', error);
                alert('퇴실 처리 중 오류가 발생했습니다.');
            });
        }

            document.getElementById('reasonError').style.display = 'none';

        /**
         * 휴가 신청 가능 날짜 조회 및 설정
         */
        function loadAvailableVacationDates() {
            const currentLearnerEnrollmentId = window.selectedLearnerEnrollmentId || learnerEnrollmentId;

            if (!currentLearnerEnrollmentId) {
                console.warn('learnerEnrollmentId가 없습니다.');
                return;
            }

            fetch(`/participation/available-vacation-dates/${currentLearnerEnrollmentId}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    availableVacationDates = data.availableDates;
                    // console.log('휴가 신청 가능 날짜:', availableVacationDates);
                    setupDateRestrictions();
                } else {
                    console.error('휴가 신청 가능 날짜 조회 실패:', data.message);
                    alert('휴가 신청 가능 날짜를 조회할 수 없습니다.');
                }
            })
            .catch(error => {
                console.error('휴가 신청 가능 날짜 조회 오류:', error);
                alert('휴가 신청 가능 날짜 조회 중 오류가 발생했습니다.');
            });
        }

        /**
         * 날짜 입력 제한 설정
         */
        function setupDateRestrictions() {
            const dateInput = document.getElementById('vacationDate');

            if (availableVacationDates.length === 0) {
                // 신청 가능한 날짜가 없으면 비활성화
                dateInput.disabled = true;
                alert('현재 휴가 신청 가능한 날짜가 없습니다.');
                return;
            }

            dateInput.disabled = false;

            // 최소/최대 날짜 설정
            const minDate = availableVacationDates[0];
            const maxDate = availableVacationDates[availableVacationDates.length - 1];

            dateInput.min = minDate;
            dateInput.max = maxDate;

            // ✅ 날짜 선택 이벤트 리스너 추가 (유효성 검사)
            dateInput.addEventListener('change', function() {
                validateVacationDate();
            });

            // ✅ 입력 이벤트 리스너 추가 (직접 입력 방지)
            dateInput.addEventListener('input', function() {
                validateVacationDate();
            });
        }

        /**
         * 날짜 유효성 검사
         */
        function validateVacationDate() {
            const dateInput = document.getElementById('vacationDate');
            const selectedDate = dateInput.value;

            // 날짜가 선택되었으면 에러 메시지 숨김
            if (selectedDate) {
                document.getElementById('dateError').style.display = 'none';

                // 선택된 날짜가 가능한 날짜 목록에 있는지 확인
                if (!availableVacationDates.includes(selectedDate)) {
                    document.getElementById('dateError').innerHTML =
                        '<span class="text-danger">* 선택할 수 없는 날짜입니다. (주말/공휴일/휴강일 제외)</span>';
                    document.getElementById('dateError').style.display = 'block';
                    dateInput.value = ''; // 잘못된 날짜 초기화
                }
            }
        }

        /**
         * 휴가 삭제 모달 열기
         */
        function openVacationDeleteModal() {
            if (typeof $ !== 'undefined') {
                $('#vacationDeleteModal').modal('show');
            } else {
                // jQuery가 없는 경우 기본 confirm 사용
                if (confirm('휴가를 삭제하시겠습니까?\n강사와 대면 상의 후 삭제해 주세요.')) {
                    confirmVacationDelete();
                }
            }
        }

        /**
         * 휴가 신청 처리
         */
        function submitVacation() {
            // console.log('휴가 신청 제출 시작');

            const vacationDate = document.getElementById('vacationDate').value;
            const vacationReason = document.getElementById('vacationReason').value.trim();

            // ✅ 유효성검사
            let hasError = false;

            // 날짜 검사
            if (!vacationDate) {
                document.getElementById('dateError').innerHTML =
                    '<span class="text-danger">* 일자는 필수입력사항입니다.</span>';
                document.getElementById('dateError').style.display = 'block';
                hasError = true;
            } else {
                document.getElementById('dateError').style.display = 'none';
            }

            // 사유 검사
            if (!vacationReason) {
                document.getElementById('reasonError').innerHTML =
                    '<span class="text-danger">* 사유는 필수입력사항입니다.</span>';
                document.getElementById('reasonError').style.display = 'block';
                hasError = true;
            } else {
                document.getElementById('reasonError').style.display = 'none';
            }

            // 에러가 있으면 제출 중단
            if (hasError) {
                // console.log('유효성검사 실패 - 제출 중단');
                return;
            }

            // 선택된 날짜가 유효한지 재확인
            if (!availableVacationDates.includes(vacationDate)) {
                document.getElementById('dateError').innerHTML =
                    '<span class="text-danger">* 선택할 수 없는 날짜입니다.</span>';
                document.getElementById('dateError').style.display = 'block';
                return;
            }

            const currentLearnerEnrollmentId = window.selectedLearnerEnrollmentId || learnerEnrollmentId;

            const requestData = {
                learnerEnrollmentId: currentLearnerEnrollmentId,
                vacationDate: vacationDate,
                explanation: vacationReason
            };

            // console.log('휴가 신청 요청 데이터:', requestData);

            fetch('/vacation/apply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    Swal.fire({
                                  title: '휴가 신청이 완료되었습니다.\n캘린더에서 "휴가(미승인)" 상태로 확인하실 수 있습니다.',
                                  icon: "success",
                              }).then((result) => {
                        if (result.isConfirmed) {
                            $('#vacationModal').modal('hide');
                            location.reload();
                        }
                    })

                } else {
                    alert('휴가 신청에 실패했습니다: ' + data.message);
                }
            })
            .catch(error => {
                console.error('휴가 신청 오류:', error);
                alert('휴가 신청 중 오류가 발생했습니다.');
            });
        }

        /**
         * 휴가 삭제 확인 처리
         */
        function confirmVacationDelete() {
            if (!selectedVacationId) {
                alert('삭제할 휴가 정보가 없습니다.');
                return;
            }

            // 휴가 삭제 API 호출
            fetch(`/vacation/${selectedVacationId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('휴가가 삭제되었습니다.');

                    // 모달 닫기
                    if (typeof $ !== 'undefined') {
                        $('#vacationDeleteModal').modal('hide');
                    }

                    selectedVacationId = null;
                    location.reload();
                } else {
                    alert('휴가 삭제에 실패했습니다: ' + data.message);
                }
            })
            .catch(error => {
                console.error('휴가 삭제 오류:', error);
                alert('휴가 삭제 중 오류가 발생했습니다.');
            });
        }

        /*<![CDATA[*/
        var hasCurrentCourse = /*[[${currentCourse != null}]]*/ false;
        if (!hasCurrentCourse) {
            var selector = document.getElementById('courseSelector');
            if (selector) {
                selector.style.display = 'none';
            }
        }
        /*]]>*/

    </script>
</body>
</html>
