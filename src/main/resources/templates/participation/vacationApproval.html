<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/basic}">

<head>
<script th:src="@{https://cdn.jsdelivr.net/npm/sweetalert2@11}"></script>
    <style>

        /* 휴가 신청 테이블 스타일 */
        .vacation-table {
          border: 1px solid #dee2e6;
        }

        .vacation-table td {
          vertical-align: middle;
        }

        .vacation-table thead {
          background-color: #f8f9fa;
        }


        /* 상태 배지 스타일 */
        .status-badge {
          color: #fff !important;
          font-weight: bold;
          border-radius: 12px;
          padding: 2px 12px;
          font-size: 0.95em;
          display: inline-block;
        }

        /* 버튼 그룹 스타일 */
        .action-buttons {
          display: flex;
          flex-direction: row;
          gap: 10px;
          justify-content: flex-start;
          align-items: center;
          flex-wrap: nowrap;           /* 버튼이 절대 줄바꿈되지 않게 */
        }

        .action-buttons .btn {
          margin-right: 0;             /* gap으로만 간격 조정 */
          white-space: nowrap;         /* 텍스트 줄바꿈 방지 */
          min-width: 0;                /* 버튼이 flex 컨테이너에서 줄어들 수 있게 */
          flex-shrink: 1;              /* 필요시 버튼이 줄어들 수 있게 */
          box-sizing: border-box;
          padding-left: 12px;
          padding-right: 12px;
        }

        .action-buttons .btn:last-child {
          margin-right: 0;
        }

        #refreshBtn {
          padding-left: 5px;
        }

        /* 검색 기능 스타일 */
        .search-container {
          display: flex;
          align-items: center;
          gap: 8px;
          padding-right: 15px;
        }

        .search-input {
          width: 200px;
          padding: 6px 12px;
          border: 1px solid #ced4da;
          border-radius: 4px;
          font-size: 14px;
        }

        .search-input:focus {
          outline: none;
          border-color: #80bdff;
          box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .search-btn {
          padding: 6px 12px;
          background: #007bff;
          color: white;
          border: 1px solid #007bff;
          border-radius: 4px;
          cursor: pointer;
          font-size: 14px;
        }

        .search-btn:hover {
          background: #0056b3;
          border-color: #0056b3;
        }

        .clear-search-btn {
          padding: 6px 12px;
          background: #6c757d;
          color: white;
          border: 1px solid #6c757d;
          border-radius: 4px;
          cursor: pointer;
          font-size: 14px;
        }

        .clear-search-btn:hover {
          background: #545b62;
          border-color: #545b62;
        }

        /* 검색 결과 표시 스타일 */
        .search-result-info {
          background: #e3f2fd;
          border: 1px solid #bbdefb;
          border-radius: 4px;
          padding: 8px 12px;
          margin-bottom: 15px;
          font-size: 14px;
          color: #1565c0;
        }

        /* 승인 완료 메시지 스타일 */
        .approved-message {
          color: #198754;
          font-weight: 600;
        }

        /* 빈 상태 스타일 */
        .empty-state {
          text-align: center;
          padding: 3rem 1rem;
          color: #6c757d;
        }

        .empty-state i {
          font-size: 3rem;
          margin-bottom: 1rem;
          opacity: 0.5;
        }

        /* 로딩 스타일 */
        .loading-overlay {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(255, 255, 255, 0.8);
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 1000;
        }

        /* 알림 메시지 애니메이션 */
        .alert-slide-down {
          animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
          from {
            opacity: 0;
            transform: translateY(-20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }


        /* 사유 텍스트 말줄임 */

        .reason-text {
          min-width: 180px;
          max-width: 600px;
          white-space: normal;        /* pre-line 대신 normal 사용 */
          word-break: break-all;      /* 긴 단어도 줄바꿈 */
          line-height: 1.4;          /* 줄 간격 조정 */
          display: block;             /* inline-block 대신 block */
          vertical-align: middle;
          padding: 4px 0;            /* 상하 여백 추가 */

        }

        @media (max-width: 700px) {
          .vacation-table th, .vacation-table td { padding: 6px 4px; }
          .reason-text { max-width: 100vw; }
        }

        /* 승인 대기 행 강조 스타일 */
        .vacation-row[data-status="VACATION_PENDING"] {
          background-color: #fff3cd !important; /* 연한 노란색 배경 */
          border-left: 4px solid #ffc107; /* 왼쪽 노란색 테두리 */
        }

        .vacation-row[data-status="VACATION_PENDING"]:hover {
          background-color: #ffeaa7 !important; /* 호버시 조금 더 진한 노란색 */
        }


    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <!-- 페이지 헤더 -->
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="card-title mb-0">
                            <i class="fas fa-calendar-check me-2"></i>
                            휴가 신청 조회 및 승인
                        </h4>
                    </div>

                    <div class="card-body">
                        <!-- 에러 메시지 표시 영역 -->
                        <div id="messageContainer">
                            <div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <span th:text="${errorMessage}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        </div>

                        <!-- 담당 과정이 없는 경우 -->
                        <div th:if="${instructorCourses.currentCourse == null and #lists.isEmpty(instructorCourses.previousCourses)}"
                             class="empty-state">
                            <i class="fas fa-exclamation-circle text-warning"></i>
                            <h5 class="text-muted">담당하는 과정이 없습니다.</h5>
                            <p class="text-muted">과정이 배정되면 여기에서 휴가 승인을 처리할 수 있습니다.</p>
                        </div>

                        <!-- 휴가 신청 목록 섹션 -->
                        <div th:if="${instructorCourses.currentCourse != null or not #lists.isEmpty(instructorCourses.previousCourses)}"
                             class="vacation-list-section">

                            <!-- 동적 제목, 검색, 새로고침 -->
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="mb-0" id="vacationListTitle">
                                    <i id="vacationListIcon" class="me-2"></i>
                                    <span id="vacationListText">휴가 신청 목록</span>
                                    <span id="vacationListCount" class="badge ms-2"></span>
                                </h5>

                                <!-- 검색 및 새로고침 버튼 -->
                                <div class="d-flex align-items-center gap-3">
                                    <!-- 이름 검색 컨테이너 -->
                                    <div class="search-container">
                                        <input type="text" id="searchInput" class="search-input"
                                               placeholder="이름 검색..." maxlength="10">
                                        <button type="button" id="searchBtn" class="search-btn">
                                            <i class="fas fa-search"></i>
                                        </button>
                                        <button type="button" id="clearSearchBtn" class="clear-search-btn" style="display: none;">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>

                                    <!-- 새로고침 버튼 -->
                                    <button type="button" id="refreshBtn" class="btn btn-outline-secondary btn-sm">
                                        <i class="fas fa-sync-alt me-1"></i>
                                        새로고침
                                    </button>
                                </div>
                            </div>

                            <!-- 검색 결과 정보 표시 -->
                            <div id="searchResultInfo" class="search-result-info" style="display: none;">
                                <i class="fas fa-search me-2"></i>
                                <span id="searchResultText"></span>
                            </div>

                            <!-- 휴가 신청이 없는 경우 -->
                            <div id="emptyState" class="empty-state" style="display: none;">
                                <i id="emptyStateIcon" class="fas fa-inbox"></i>
                                <h5 id="emptyStateTitle" class="text-muted"></h5>
                                <p id="emptyStateMessage" class="text-muted"></p>
                            </div>

                            <!-- 로딩 상태 -->
                            <div id="loadingState" class="empty-state" style="display: none;">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <h5 class="text-muted mt-3">데이터를 불러오는 중...</h5>
                            </div>

                            <!-- 휴가 신청 테이블 -->
                            <div id="vacationTableContainer" style="display: none;">
                                <div class="table-responsive">
                                    <table class="table vacation-table table-hover">
                                        <thead>
                                            <tr>
                                                <th style="width: 10%">No.</th>
                                                <th style="width: 15%">이름</th>
                                                <th style="width: 35%">사유</th>
                                                <th style="width: 15%">날짜</th>
                                                <th style="width: 10%">상태</th>
                                                <th style="width: 15%">승인처리</th>
                                            </tr>
                                        </thead>
                                        <tbody id="vacationTableBody">
                                            <!-- JavaScript에서 동적으로 행 추가 -->
                                        </tbody>
                                    </table>
                                </div>

                                <!-- 페이징 네비게이션 -->
                                <nav id="paginationNav" aria-label="휴가 신청 페이지네이션" style="display: none;">
                                    <ul id="paginationList" class="pagination justify-content-center">
                                        <!-- JavaScript에서 동적으로 페이지 버튼 추가 -->
                                    </ul>
                                </nav>

                                <!-- 페이징 정보 -->
                                <div id="paginationInfo" class="d-flex justify-content-between align-items-center mt-3">
                                    <div class="text-muted">
                                        <span id="paginationText"></span>
                                    </div>
                                    <div class="text-muted small">
                                        마지막 업데이트: <span id="lastUpdateTime"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
    <!-- JavaScript 코드 -->
   <th:block layout:fragment="script" th:inline="javascript">
       <script>
    $(document).ready(function() {

        // ========== 전역 변수 ==========
        // 서버에서 전달받은 데이터 (Thymeleaf로 주입)
        const instructorData = {
            currentCourse: /*[[${instructorCourses.currentCourse}]]*/ null,
            previousCourses: /*[[${instructorCourses.previousCourses}]]*/ [],
            selectedCourseId: /*[[${selectedCourseId}]]*/ null,
            isCurrentCourse: /*[[${isCurrentCourse}]]*/ false
        };

        // 페이징 관련 변수
        let currentPage = /*[[${currentPage}]]*/ 0;
        let currentCourseId = instructorData.selectedCourseId;
        let isCurrentCourseSelected = instructorData.isCurrentCourse;
        let totalPages = 0;
        let totalElements = 0;
        let currentSearchName = ''; // 현재 검색어

        // ========== 초기화 ==========
        console.log('휴가 승인 페이지 초기화 시작', instructorData);

        // 과정 선택기 설정
        setupCourseSelector();

        // 초기 데이터 로드
        if (currentCourseId) {
            loadVacationData(currentCourseId, currentPage);
        }

        // ========== 과정 선택기 설정 (participationView 방식 활용) ==========
        /**
         * 과정 선택기를 설정합니다.
         * 현재 과정이 기본 선택되고, 과거 과정들이 드롭다운에 추가됩니다.
         */
        function setupCourseSelector() {
            const $selector = $('#courseSelector');
            $selector.empty();

            // 현재 과정 추가 (최우선)
            if (instructorData.currentCourse) {
                const currentOption = $('<option>', {
                    value: instructorData.currentCourse.id,
                    text: `[진행중]: ${instructorData.currentCourse.name}`,
                    'data-type': 'current',
                    'data-start-date': instructorData.currentCourse.startDate,
                    'data-end-date': instructorData.currentCourse.endDate
                });

                // 기본 선택 (currentCourseId가 없으면 현재 과정을 선택)
                if (!currentCourseId || instructorData.currentCourse.id === currentCourseId) {
                    currentOption.prop('selected', true);
                    currentCourseId = instructorData.currentCourse.id;
                    isCurrentCourseSelected = true;
                }

                $selector.append(currentOption);
            }

            // 과거 과정들 추가
            if (instructorData.previousCourses && instructorData.previousCourses.length > 0) {
                instructorData.previousCourses.forEach(course => {
                    const previousOption = $('<option>', {
                        value: course.id,
                        text: `[종료]: ${course.name} (${course.startDate} ~ ${course.endDate})`,
                        'data-type': 'previous',
                        'data-start-date': course.startDate,
                        'data-end-date': course.endDate
                    });

                    // 선택된 과정이면 selected 속성 추가
                    if (course.id === currentCourseId) {
                        previousOption.prop('selected', true);
                        isCurrentCourseSelected = false;
                    }

                    $selector.append(previousOption);
                });
            }

            // 과정 정보 업데이트
            updateCourseInfo();

            console.log('과정 선택기 설정 완료', {
                currentCourseId: currentCourseId,
                isCurrentCourse: isCurrentCourseSelected
            });
        }

        // ========== 과정 선택 변경 이벤트 ==========
        /**
         * 과정 선택이 변경될 때 호출되는 이벤트 핸들러
         */
        $('#courseSelector').change(function() {
            const selectedCourseId = parseInt($(this).val());
            const selectedOption = $(this).find('option:selected');
            const selectedType = selectedOption.data('type');

            console.log('과정 선택 변경:', {
                selectedCourseId: selectedCourseId,
                selectedType: selectedType,
                previousCourseId: currentCourseId
            });

            // 선택이 실제로 변경된 경우에만 처리
            if (selectedCourseId && selectedCourseId !== currentCourseId) {
                currentCourseId = selectedCourseId;
                isCurrentCourseSelected = (selectedType === 'current');
                currentPage = 0; // 페이지 초기화

                // UI 업데이트
                updateCourseInfo();

                // 검색어 초기화
                clearSearch();

                // 새로운 과정의 휴가 데이터 로드
                loadVacationData(currentCourseId, currentPage);
            }
        });

        // ========== 과정 정보 업데이트 ==========
        /**
         * 선택된 과정에 따라 배지와 세부 정보를 업데이트합니다.
         */
        function updateCourseInfo() {
            const $badge = $('#courseStatusBadge');
            const $details = $('#courseDetails');
            const selectedOption = $('#courseSelector option:selected');

            if (isCurrentCourseSelected) {
                $badge.removeClass('bg-secondary').addClass('bg-success').text('현재 진행 중');
                if (instructorData.currentCourse) {
                    $details.html(`
                        <i class="fas fa-calendar me-1"></i>
                        ${instructorData.currentCourse.startDate} ~ ${instructorData.currentCourse.endDate}
                    `);
                }
            } else {
                $badge.removeClass('bg-success').addClass('bg-secondary').text('과정 완료');
                const startDate = selectedOption.data('start-date');
                const endDate = selectedOption.data('end-date');
                if (startDate && endDate) {
                    $details.html(`
                        <i class="fas fa-calendar me-1"></i>
                        ${startDate} ~ ${endDate}
                    `);
                }
            }

            console.log('과정 정보 업데이트 완료:', {
                isCurrentCourse: isCurrentCourseSelected,
                courseId: currentCourseId
            });
        }

        // ========== 검색 기능 ==========

        /**
         * 검색 버튼 클릭 이벤트
         */
        $('#searchBtn').click(function() {
            performSearch();
        });

        /**
         * 검색 입력창에서 엔터키 이벤트
         */
        $('#searchInput').keypress(function(e) {
            if (e.which === 13) { // Enter key
                performSearch();
            }
        });

        /**
         * 검색 실행 함수
         */
        function performSearch() {
            const searchName = $('#searchInput').val().trim();

            if (searchName === '') {
                showErrorMessage('검색할 이름을 입력해주세요.');
                return;
            }

            if (searchName.length > 10) {
                showErrorMessage('검색어는 10글자 이하로 입력해주세요.');
                return;
            }

            console.log('검색 실행:', searchName);

            currentSearchName = searchName;
            currentPage = 0; // 검색 시 첫 페이지로

            // 검색 결과 표시
            showSearchResultInfo(searchName);
            $('#clearSearchBtn').show();

            loadVacationData(currentCourseId, currentPage, searchName);
        }

        /**
         * 검색 초기화 버튼 클릭 이벤트
         */
        $('#clearSearchBtn').click(function() {
            clearSearch();
            loadVacationData(currentCourseId, currentPage);
        });

        /**
         * 검색 초기화 함수
         */
        function clearSearch() {
            $('#searchInput').val('');
            currentSearchName = '';
            currentPage = 0;
            $('#clearSearchBtn').hide();
            $('#searchResultInfo').hide();
            console.log('검색 초기화 완료');
        }

        /**
         * 검색 결과 정보 표시
         */
        function showSearchResultInfo(searchName) {
            $('#searchResultText').text(`"${searchName}" 검색 결과`);
            $('#searchResultInfo').show();
        }

        // ========== 휴가 데이터 로드 ==========
        /**
         * 휴가 데이터 로드 함수 (검색 기능 추가)
         * @param {number} courseId - 과정 ID
         * @param {number} page - 페이지 번호
         * @param {string} searchName - 검색할 이름 (선택적)
         */
        function loadVacationData(courseId, page, searchName = '') {
            if (!courseId) return;

            console.log('휴가 데이터 로드 시작:', {
                courseId: courseId,
                page: page,
                searchName: searchName,
                type: isCurrentCourseSelected ? 'all' : 'approved'
            });

            showLoadingState();

            // API URL 결정 (검색 여부에 따라)
            const apiUrl = searchName ? `/vacation/api/vacations/${courseId}/search` : `/vacation/api/vacations/${courseId}`;

            const requestData = {
                page: page,
                size: 10,
                type: isCurrentCourseSelected ? 'all' : 'approved'
            };

            // 검색어가 있으면 추가
            if (searchName) {
                requestData.searchName = searchName;
            }

            $.ajax({
                       url: apiUrl,
                       type: 'GET',
                       data: requestData,
                       success: function(response) {
                           console.log('휴가 데이터 응답:', {
                               totalElements: response.data?.totalElements,
                               contentLength: response.data?.content?.length,
                               data: response.data
                           });

                           if (response.success) {
                               updateVacationList(response.data);
                               updatePagination(response.data);
                               updateLastUpdateTime();
                           } else {
                               showErrorMessage(response.message || '휴가 데이터 로드에 실패했습니다.');
                               showEmptyState('데이터 로드 실패', '잠시 후 다시 시도해주세요.');
                           }
                       },
                       error: function() {
                           showErrorMessage('휴가 데이터 로드 중 오류가 발생했습니다.');
                           showEmptyState('연결 오류', '네트워크 연결을 확인해주세요.');
                       }
                   });
        }

        // ========== 로딩 상태 표시 ==========
        /**
         * 데이터 로딩 중임을 사용자에게 표시합니다.
         */
        function showLoadingState() {
            $('#vacationTableContainer').hide();
            $('#emptyState').hide();
            $('#loadingState').show();
        }

        // ========== 휴가 목록 업데이트 ==========
        /**
         * 서버에서 받은 휴가 데이터로 테이블을 업데이트합니다.
         * @param {Object} data - 페이징된 휴가 데이터
         */
        function updateVacationList(data) {
            const vacations = data.content || [];
            const $tbody = $('#vacationTableBody');

            // 1. 승인대기 상태만 카운트
            const pendingCount = vacations.filter(v => v.status === 'VACATION_PENDING').length;

            // 2. 제목/카운트 업데이트
            updateVacationListHeader(pendingCount, data);

            // 데이터가 없는 경우
            if (vacations.length === 0) {
                showEmptyState();
                return;
            }

            // 로딩/빈 상태 숨기고 테이블 표시
            $('#loadingState').hide();
            $('#emptyState').hide();
            $('#vacationTableContainer').show();

            const actualTotal = Math.max(
                data.totalElements || 0,
                vacations.length + (currentPage * 10)
            );
            // 테이블 내용 업데이트
            $tbody.empty();
            vacations.forEach((vacation, index) => {
                const rowNumber = actualTotal - (currentPage * 10) - index;
                const safeRowNumber = Math.max(1, rowNumber);
                const row = createVacationRow(vacation, safeRowNumber);
                $tbody.append(row);
            });

            console.log('휴가 목록 업데이트 완료:', {
                총개수: data.totalElements,
                현재페이지: data.pageable?.pageNumber || currentPage,
                표시개수: vacations.length
            });
        }

        // ========== 휴가 목록 헤더 업데이트 ==========
        /**
         * 휴가 목록의 제목과 통계 정보를 업데이트합니다.
         * @param {Object} data - 휴가 데이터
         */
        function updateVacationListHeader(data) {
            const $icon = $('#vacationListIcon');
            const $text = $('#vacationListText');
            const $count = $('#vacationListCount');

            totalElements = data.totalElements || 0;

            // 현재 과정에서 승인 대기만 카운트 (정렬 순서 반영)
            if (isCurrentCourseSelected) {
                // 승인 대기 중인 항목만 카운트 (항상 맨 위에 표시됨)
                const pendingCount = data.content ? data.content.filter(v => v.status === 'VACATION_PENDING').length : 0;
                $icon.removeClass().addClass('fas fa-clock text-warning me-2');
                $text.text('처리 대기 중인 휴가 신청');
                $count.removeClass().addClass('badge bg-warning ms-2').text(pendingCount);

                // 승인 대기 우선 정렬 안내 메시지
                if (pendingCount > 0) {
                    console.log('승인 대기 중인 휴가가 우선 표시됩니다:', pendingCount + '건');
                }
            } else {
                $icon.removeClass().addClass('fas fa-check-circle text-success me-2');
                $text.text('승인된 휴가 기록');
                $count.removeClass().addClass('badge bg-success ms-2').text(totalElements);
            }
        }

        // ========== 빈 상태 표시 ==========
        /**
         * 데이터가 없을 때 빈 상태를 표시합니다.
         * @param {string} title - 제목 (옵션)
         * @param {string} message - 메시지 (옵션)
         */
        function showEmptyState(title, message) {
            $('#loadingState').hide();
            $('#vacationTableContainer').hide();
            $('#emptyState').show();

            const $icon = $('#emptyStateIcon');
            const $title = $('#emptyStateTitle');
            const $message = $('#emptyStateMessage');

            if (title && message) {
                $icon.removeClass().addClass('fas fa-exclamation-triangle text-warning');
                $title.text(title);
                $message.text(message);
            } else {
                // 검색 결과가 없는 경우
                if (currentSearchName) {
                    $icon.removeClass().addClass('fas fa-search text-muted');
                    $title.text(`"${currentSearchName}" 검색 결과가 없습니다.`);
                    $message.text('다른 이름으로 검색해보세요.');
                } else {
                    // 일반적인 빈 상태
                    if (isCurrentCourseSelected) {
                        $icon.removeClass().addClass('fas fa-inbox text-muted');
                        $title.text('현재 처리할 휴가 신청이 없습니다.');
                        $message.text('휴가 신청이 들어오면 여기에 표시됩니다.');
                    } else {
                        $icon.removeClass().addClass('fas fa-archive text-muted');
                        $title.text('과거에 승인된 휴가 기록이 없습니다.');
                        $message.text('승인된 휴가가 있었다면 여기에 표시됩니다.');
                    }
                }
            }
        }

        // ========== 휴가 행 생성 ==========
        /**
         * 개별 휴가 신청 데이터로 테이블 행을 생성합니다.
         * @param {Object} vacation - 휴가 신청 데이터
         * @param {number} rowNumber - 행 번호
         * @returns {jQuery} 생성된 테이블 행
         */
        function createVacationRow(vacation, rowNumber) {
            const statusBadge = vacation.status === 'VACATION_PENDING'
                                ? '<span class="badge bg-warning status-badge">승인대기</span>'
                                : '<span class="badge bg-success status-badge">승인완료</span>';

            const actionCell = vacation.status === 'VACATION_PENDING'
                               ? `<div class="action-buttons">
             <button type="button" class="btn btn-primary btn-sm approve-btn"
                     data-participation-id="${vacation.participationId}">
               <i class="fas fa-check me-1"></i> 승인
             </button>
             <button type="button" class="btn btn-danger btn-sm reject-btn"
                     data-participation-id="${vacation.participationId}">
               <i class="fas fa-times me-1"></i> 거부
             </button>
           </div>`
                               : `<div class="approved-message">
             <i class="fas fa-check-circle me-1"></i>승인되었습니다
           </div>`;

            const reasonText = vacation.reason || '사유 없음';
            const vacationDate = formatDate(vacation.vacationDate);


            const $row = $(`
        <tr id="vacation-row-${vacation.participationId}"
            class="vacation-row"
            data-status="${vacation.status}">
            <td class="text-center">${rowNumber}</td>
            <td>
                <span class="fw-semibold">${vacation.learnerName}</span>
                <br>
                <small class="text-muted">${vacation.learnerEmail || ''}</small>
            </td>
            <td>
                <div class="reason-text">${reasonText}</div>
            </td>
            <td>
                <span class="fw-medium">${vacationDate}</span>
            </td>
            <td>${statusBadge}</td>
            <td>${actionCell}</td>
        </tr>
         `);

      return $row;
  }


        // ========== 페이징 업데이트 ==========
        /**
         * 페이징 네비게이션을 업데이트합니다.
         * @param {Object} data - 페이징된 데이터
         */
        function updatePagination(data) {
            const $nav = $('#paginationNav');
            const $list = $('#paginationList');
            const $info = $('#paginationInfo');
            const $text = $('#paginationText');

            totalPages = data.totalPages || 0;
            totalElements = data.totalElements || 0;

            // 1. 리스트가 1개도 없으면 페이징 정보, 버튼 모두 숨김
            if (totalElements === 0) {
                $nav.hide();
                $info.hide();
                return;
            }

            // 2. 10개 이하일 때는 페이징 버튼만 숨기고 정보는 항상 표시
            if (totalElements <= 10) {
                $nav.hide();
            } else {
                $nav.show();
                $list.empty();

                // 10개 단위 그룹 계산
                const pagesPerGroup = 10;
                const currentGroup = Math.floor(currentPage / pagesPerGroup);
                const groupStart = currentGroup * pagesPerGroup;
                const groupEnd = Math.min(groupStart + pagesPerGroup, totalPages);

                // 이전 그룹 버튼
                if (currentGroup > 0) {
                    $list.append(`
                <li class="page-item">
                    <a class="page-link" href="#" data-page="${groupStart - 1}" data-group-nav="prev">
                        <i class="fas fa-angle-double-left"></i> 이전
                    </a>
                </li>
            `);
                }

                // 그룹 내 페이지 번호 버튼
                for (let i = groupStart; i < groupEnd; i++) {
                    const active = i === currentPage;
                    $list.append(`
                <li class="page-item ${active ? 'active' : ''}">
                    <a class="page-link" href="#" data-page="${i}">
                        ${i + 1}
                    </a>
                </li>
            `);
                }

                // 다음 그룹 버튼
                if (groupEnd < totalPages) {
                    $list.append(`
                <li class="page-item">
                    <a class="page-link" href="#" data-page="${groupEnd}" data-group-nav="next">
                        다음 <i class="fas fa-angle-double-right"></i>
                    </a>
                </li>
            `);
                }
            }

            // 3. 페이징 정보는 항상 표시 (단, 0건일 때만 숨김)
            $info.show();

            // ✅ 검색어가 있을 때는 검색어도 같이 표시
            let infoText = `총 ${totalElements}건`;
            if (typeof currentSearchName !== 'undefined' && currentSearchName && currentSearchName.length > 0) {
                infoText += ` (검색: "${currentSearchName}")`;
            }
            infoText += ` (페이지 ${currentPage + 1} / ${totalPages})`;
            $text.text(infoText);
        }



        // 페이지 버튼 클릭 이벤트 (이전/다음 그룹 이동 포함)
        $(document).on('click', '.page-link', function(e) {
            e.preventDefault();
            const $this = $(this);
            const $parent = $this.parent();

            if ($parent.hasClass('disabled') || $parent.hasClass('active')) return;

            // 그룹 이동 버튼이면 해당 그룹의 첫/마지막 페이지로 이동
            if ($this.data('group-nav') === 'prev' || $this.data('group-nav') === 'next') {
                currentPage = parseInt($this.data('page'));
            } else {
                // 일반 페이지 버튼
                const page = parseInt($this.data('page'));
                if (!isNaN(page) && page >= 0 && page < totalPages) {
                    currentPage = page;
                }
            }

            // 현재 검색어로 데이터 로드
            loadVacationData(currentCourseId, currentPage, currentSearchName);
        });

        // ========== 새로고침 버튼 이벤트 ==========
        /**
         * 새로고침 버튼을 클릭하면 현재 페이지를 다시 로드합니다.
         */
        $('#refreshBtn').click(function() {
            console.log('수동 새로고침 요청');
            if (currentCourseId) {
                loadVacationData(currentCourseId, currentPage);
                showSuccessMessage('데이터를 새로고침했습니다.');
            }
        });



        // ========== 승인 버튼 클릭 이벤트 ==========
        /**
         * 휴가 승인 버튼을 클릭하면 승인 처리를 수행합니다.
         */
        $(document).on('click', '.approve-btn', function() {
            const participationId = $(this).data('participation-id');
            const $row = $('#vacation-row-' + participationId);
            const learnerName = $row.find('td:nth-child(2)').text().trim().split('\n')[0];

            console.log('휴가 승인 요청:', {
                participationId: participationId,
                learnerName: learnerName
            });


            Swal.fire({
                          title: "승인하시겠습니까?",
                          text: `${learnerName}님의 휴가를 승인하시겠습니까?`,
                          icon: "warning",
                          showCancelButton: true,
                          confirmButtonColor: "#3085d6",
                          cancelButtonColor: "#d33",
                          confirmButtonText: "승인",
                          cancelButtonText: "취소"
                      }).then((result) => {
                if (result.isConfirmed) {
                    // 버튼 비활성화 (중복 클릭 방지)
                    $(this).prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-1"></span>처리중...');

                    // AJAX 승인 요청
                    $.ajax({
                               url: `/vacation/approve/${participationId}`,
                               type: 'POST',
                               success: function(response) {
                                   console.log('휴가 승인 응답:', response);

                                   if (response.success) {
                                     //  showSuccessMessage(`${learnerName}님의 휴가 승인이 완료되었습니다.`);

                                       Swal.fire({
                                                     title: "승인되었습니다.",
                                                     text: "휴가승인되었습니다, 목록에서 확인해주세요.",
                                                     icon: "success"
                                                 });
                                       // 행 업데이트 (즉시 UI 반영)
                                       updateVacationRow($row, 'VACATION', '승인되었습니다');

                                       // 1초 후 데이터 새로고침 (최신 상태 반영)
                                       setTimeout(() => {
                                           loadVacationData(currentCourseId, currentPage);
                                       }, 1000);

                                   } else {
                                       showErrorMessage(response.message || '휴가 승인 처리에 실패했습니다.');
                                       // 버튼 원상복구
                                       $row.find('.approve-btn').prop('disabled', false).html('<i class="fas fa-check me-1"></i>승인');
                                   }
                               },
                               error: function(xhr, status, error) {
                                   console.error('휴가 승인 오류:', {
                                       status: status,
                                       error: error,
                                       responseText: xhr.responseText
                                   });

                                   showErrorMessage('휴가 승인 처리 중 오류가 발생했습니다.');
                                   // 버튼 원상복구
                                   $row.find('.approve-btn').prop('disabled', false).html('<i class="fas fa-check me-1"></i>승인');
                               }
                           });

                }
            });
            // 확인 대화상자
            // if (!confirm(`${learnerName}님의 휴가를 승인하시겠습니까?`)) {
            //     return;
            // }


        });

        // ========== 거부 버튼 클릭 이벤트 ==========
        /**
         * 휴가 거부 버튼을 클릭하면 거부 처리를 수행합니다.
         */
        $(document).on('click', '.reject-btn', function() {
            const participationId = $(this).data('participation-id');
            const $row = $('#vacation-row-' + participationId);
            const learnerName = $row.find('td:nth-child(2)').text().trim().split('\n')[0];

            console.log('휴가 거부 요청:', {
                participationId: participationId,
                learnerName: learnerName
            });

            Swal.fire({
                          title: "휴가를 거부하시겠습니까?",
                          text: `${learnerName}님의 휴가를 거부하시겠습니까?\n\n거부된 휴가는 목록에서 완전히 삭제되며 복구할 수 없습니다.`,
                          icon: "warning",
                          showCancelButton: true,
                          confirmButtonColor: "#3085d6",
                          cancelButtonColor: "#d33",
                          confirmButtonText: "삭제",
                          cancelButtonText: "취소"
                      }).then((result) => {
                if (result.isConfirmed) {
                    // 버튼 비활성화
                    $(this).prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-1"></span>처리중...');

                    // AJAX 거부 요청
                    $.ajax({
                               url: `/vacation/reject/${participationId}`,
                               type: 'POST',
                               success: function(response) {
                                   console.log('휴가 거부 응답:', response);

                                   if (response.success) {
                                       // showSuccessMessage(`${learnerName}님의 휴가 거부가 완료되었습니다.`);
                                       Swal.fire({
                                                     title: "승인거부되었습니다.",
                                                     text: "거부하신 휴가는 리스트에서 삭제됩니다.",
                                                     icon: "info"
                                                 });
                                       // 행 제거 효과
                                       $row.addClass('table-danger').fadeOut(800, function() {
                                           // 페이드아웃 완료 후 데이터 새로고침
                                           loadVacationData(currentCourseId, currentPage);
                                       });

                                   } else {
                                       showErrorMessage(response.message || '휴가 거부 처리에 실패했습니다.');
                                       // 버튼 원상복구
                                       $row.find('.reject-btn').prop('disabled', false).html('<i class="fas fa-times me-1"></i>거부');
                                   }
                               },
                               error: function(xhr, status, error) {
                                   console.error('휴가 거부 오류:', {
                                       status: status,
                                       error: error,
                                       responseText: xhr.responseText
                                   });

                                   showErrorMessage('휴가 거부 처리 중 오류가 발생했습니다.');
                                   // 버튼 원상복구
                                   $row.find('.reject-btn').prop('disabled', false).html('<i class="fas fa-times me-1"></i>거부');
                               }
                           });


                }
            });
            // // 확인 대화상자 (강한 경고)
            // if (!confirm(`${learnerName}님의 휴가를 거부하시겠습니까?\n\n거부된 휴가는 목록에서 완전히 삭제되며 복구할 수 없습니다.`)) {
            //     return;
            // }


        });

        // ========== 행 업데이트 함수 ==========
        /**
         * 승인 처리 후 해당 행의 상태를 즉시 업데이트합니다.
         * @param {jQuery} $row - 업데이트할 행
         * @param {string} status - 새로운 상태
         * @param {string} message - 표시할 메시지
         */
        function updateVacationRow($row, status, message) {
            // 상태 배지 업데이트
            const $statusCell = $row.find('td:nth-child(5)');
            if (status === 'VACATION') {
                $statusCell.html('<span class="badge bg-success status-badge">승인완료</span>');
            }

            // 액션 버튼을 승인 메시지로 교체
            const $actionCell = $row.find('td:nth-child(6)');
            $actionCell.html(`승인되었습니다`);

            // 행에 성공 효과 추가
            $row.addClass('table-success');

            console.log('행 업데이트 완료:', {
                status: status,
                message: message
            });
        }

        // ========== 유틸리티 함수들 ==========

        /**
         * 성공 메시지를 표시합니다.
         * @param {string} message - 표시할 메시지
         */
        function showSuccessMessage(message) {
            const alertHtml = `
                <div class="alert alert-success alert-dismissible fade show alert-slide-down" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    ${message}
                </div>
            `;

            $('#messageContainer').prepend(alertHtml);

            // 3초 후 자동 제거
            setTimeout(function() {
                $('.alert-success').not('[data-permanent]').fadeOut(500, function() {
                    $(this).remove();
                });
            }, 3000);

            console.log('성공 메시지 표시:', message);
        }

        /**
         * 에러 메시지를 표시합니다.
         * @param {string} message - 표시할 메시지
         */
        function showErrorMessage(message) {
            const alertHtml = `
                <div class="alert alert-danger alert-dismissible fade show alert-slide-down" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;

            $('#messageContainer').prepend(alertHtml);

            // 5초 후 자동 제거
            setTimeout(function() {
                $('.alert-danger').not('[data-permanent]').fadeOut(500, function() {
                    $(this).remove();
                });
            }, 5000);

            console.log('에러 메시지 표시:', message);
        }

        /**
         * 날짜를 사용자 친화적인 형식으로 포맷팅합니다.
         * @param {string} dateString - 날짜 문자열
         * @returns {string} 포맷팅된 날짜
         */
        function formatDate(dateString) {
            if (!dateString) return '';

            try {
                const date = new Date(dateString);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');

                // 요일 추가
                const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
                const weekday = weekdays[date.getDay()];

                return `${year}-${month}-${day} (${weekday})`;
            } catch (error) {
                console.warn('날짜 포맷팅 오류:', dateString);
                return dateString;
            }
        }

        /**
         * 마지막 업데이트 시간을 표시합니다.
         */
        function updateLastUpdateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            $('#lastUpdateTime').text(timeString);
        }


        console.log('휴가 승인 페이지 초기화 완료');
    });
        </script>
    </th:block>
</body>
</html>
