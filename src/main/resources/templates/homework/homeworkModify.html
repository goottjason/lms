<!DOCTYPE html>
<html
    lang="ko"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{layout/basic.html}">
<head>
  <style>
    #courseSelector {
      pointer-events: none;
      background-color: #eee;
      color: rgb(131, 131, 131);
    }
  </style>
</head>
<body>
<div layout:fragment="content">
  <!-- content header 시작 -->
  <div class="row align-items-center">
    <h1 class="h3 col-3 mx-3 mb-3 text-gray-800">과제 수정</h1>
  </div>
  <!-- content header 끝 -->

  <!-- content body 시작 -->
  <form class="mb-4" method="POST" action="/homework/homeworkModify" id="formSubmit"
        enctype="multipart/form-data">
    <div class="card shadow mb-4">
      <div class="card-header py-3">
        <div class="row align-items-center">
          <div class="col">
            <h6 class="m-0 font-weight-bold text-primary">과제 수정</h6>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="row mb-2">
          <div class="col-md-12">
            <div class="form-group">
              <label for="title">제목</label>
              <span id="titleError" style="color: red"></span>
              <input type="text" id="title" class="form-control" name="title"
                     th:value="${homeworkDTO.getTitle()}">
            </div>
          </div>
        </div>

        <div class="row mb-2">
          <div class="col-md-6">
            <div class="form-group">
              <label for="startDate">제출기간 시작</label>
              <span id="startDateError" style="color: red"></span>
              <input type="datetime-local" id="startDate" class="form-control" name="startDate"
                     th:value="${homeworkDTO.getStartDate()}">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="endDate">제출기한 종료</label>
              <span id="endDateError" style="color: red"></span>
              <input type="datetime-local" id="endDate" class="form-control" name="endDate"
                     th:value="${homeworkDTO.getEndDate()}">
            </div>
          </div>
        </div>

        <div class="row mb-2">
          <div class="col-md-12">
            <div class="form-group">
              <label for="content">내용</label>
              <span id="contentError" style="color: red"></span>
              <textarea
                  id="content"
                  class="form-control"
                  style="min-height: 280px; white-space: pre-wrap;"
                  wrap="hard"
                  name="content"
                  th:text="${homeworkDTO.getContent()}"></textarea>
            </div>
          </div>
        </div>
        <div class="row mb-4">
          <div class="col-md-12">
            <div class="mb-2">첨부파일</div>
            <div class="custom-file">
              <input type="file" class="custom-file-input" id="files" multiple>
              <label class="custom-file-label" for="files">파일을 선택하세요.</label>
            </div>

            <!--기존에 저장했던 파일 불러오기(x버튼 누르면 해당 파일 db에서 삭제할 리스트에 추가)-->
            <!--조회된 파일 리스트가 있을 경우-->
            <div class="card-footer">
              <p class="mt-2">기존 파일</p>
              <!--      <div class="row">-->
              <div class="d-flex flex-column">

                <th:block th:if="${beforeFileList != null}">
                  <div th:each="fileDTO : ${beforeFileList}">
                    <div class="card mb-2 w-100" style="height:80px; max-width: 600px; width: 100%; margin-left: 12px; margin-right: 12px;"
                         th:unless="${fileDTO.getIsImage()}">
                      <div class="card-body d-flex align-items-center justify-content-between p-2">
                      <span class="text-truncate" style="max-width: 85%; font-size: 0.9rem;"
                            th:text="|📄 ${fileDTO.getOriginalName()}"></span>
                        <span style="cursor:pointer;"
                              th:class="softDeleteFile"
                              th:data-file="${fileDTO.getId()}">❌</span>
                      </div>
                    </div>
                    <div class="card mb-2 w-100" style="height:80px; max-width: 600px; width: 100%; margin-left: 12px; margin-right: 12px;"
                         th:if="${fileDTO.getIsImage()}">
                      <div class="card-body d-flex align-items-center justify-content-between p-2">
                        <img th:src="${fileDTO.getPath()}"
                             class="img-fluid rounded-start" style="width: 200px; height: 70px; object-fit: contain;">
                        <span style="cursor:pointer;"
                              th:class="softDeleteFile"
                              th:data-file="${fileDTO.getId()}">❌</span>
                      </div>
                    </div>
                  </div>
                </th:block>

              </div>
            </div>

            <!--preview 단-->
            <div class="card-footer">
              <p class="mt-2">추가할 파일</p>
              <div class="row">

                <div id="preview"></div>

              </div>
            </div>

          </div>
        </div>
      </div>
    </div>


    <!-- 버튼 -->
    <div class="col-12 d-flex justify-content-end mt-3">
      <button id="submit" class="btn btn-primary btn-icon-split mr-2">
          <span class="icon text-white-50">
              <i class="fas fa-upload"></i>
          </span>
        <span class="text px-5">저장</span>
      </button>
      <button id="reset" class="btn btn-secondary btn-icon-split">
          <span class="icon text-white-50">
              <i class="fas fa-times"></i>
          </span>
        <span class="text px-5">취소</span>
      </button>
    </div>
  </form>
  <!-- content body 끝 -->
</div>
<th:block layout:fragment="script" th:inline="javascript">
  <script>

    //homeworkId
    let homeworkId = /*[[${homeworkId}]]*/ null;

    // 빈 에러맵 형성
    let errorMap = new Map();

    // 세션에 저장된 페이지를 담을 변수
    let savePage = "";

    //과정명
    let courseName = /*[[${courseName ?: ''}]]*/ null;

    //----과정명 출력-----------
    function showCourseSelector() {
      $("#courseSelector").empty();
      $("#courseSelector").append($("<option>", {
            value: courseName,
            text: courseName
          })
      );
      $("#courseSelector").val(courseName);
    }

    //---------파일 삭제 -------------------------
    // 삭제할 파일 리스트
    let deleteFileList = [];
    let fileList = [];
    const MAX_FILE_SIZE = 1024 * 1024 * 8;

    // 파일 삭제 function
    function softDeleteFile(x) {
      // alert($(this).data("file"));
      $(x).closest(".card.mb-2.w-100").remove();
      deleteFileList.push($(x).data("file")); // id 배열에 넣기
      // console.log("deleteFileList", deleteFileList);
      // console.log("아이디 타입 확인", typeof ($(x).data("file"))); //number
    }

    //---------파일 새로 넣기---------------

    //파일 넣는 function
    function pushFileList() {
      let files = document.getElementById("files").files;

      for (let file of files) {
        if (file) {
          let ext = file.name.split(".").pop().toLowerCase();
          //파일일 경우
          if (file.size > MAX_FILE_SIZE) {
            // alert("파일 사이즈가 초과하였습니다.");
            Swal.fire({
              title: '파일 사이즈를 초과하였습니다.',
              icon: 'error',
              confirmButtonText: '예'
            })
          }else if(ext.trim() === "exe"){
            Swal.fire({
              title: '실행 파일은 업로드할 수 없습니다.',
              icon: 'error',
              confirmButtonText: '예'
            })
          } else {
            fileList.push(file);
            // console.log("file push", file);
          }
        }
      }
    }

    //프리뷰
    function previewFile(fileList) {
      $("#preview").empty();

      if (fileList != null) {
        fileList.forEach(function (file, index) {
          if (file.type.indexOf("image/") === -1) {
            // console.log("이미지 아님");
            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (e) {
              // 읽기 동작이 완료되었을 때!
              let output = "";
              output += `<div class="card mb-2 w-100" style="height:80px; max-width: 600px; width: 100%; margin-left: 12px; margin-right: 12px;">
    <div class="card-body d-flex align-items-center justify-content-between p-2">
          <span class="text-truncate" style="max-width: 85%; font-size: 0.9rem;">📄 ${file.name}</span>
          <span style="position: absolute; top: 1px; right: 2px" onclick="removeFile(${index});">❌</span>
        </div>
  </div>`;

              $("#preview").append(output);
            }

          } else {
            // console.log("이미지 맞음");
            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (e) {
              // 읽기 동작이 완료되었을 때!
              //e: 이미지 경로? data:image/....
              //console.log("e.target.result", e.target.result); //엄청 길게 나옴
              let output = "";
              output +=`<div class="card mb-2 w-100" style="height:80px; max-width: 600px; width: 100%; margin-left: 12px; margin-right: 12px;">
      <div class="card-body d-flex align-items-center justify-content-between p-2">
              <img src="${e.target.result}" class="img-fluid rounded-start" style="width: 200px; height: 70px; object-fit: contain;" />
          <span style="position: absolute; top: 1px; right: 2px" onclick="removeFile(${index});">❌</span>
      </div>
    </div>`;

              $("#preview").append(output);
            }
          }
        })
      }
      // console.log("fileList", fileList);
    }

    //프리뷰에서 파일 x 누르면 파일리스트에서 삭제
    function removeFile(index) {
      fileList.splice(index, 1);
      previewFile(fileList);
      // console.log("fileList", fileList);
    }

    //-------$function----------------------

    //$function 모음
    $(function () {

      //과정명 출력
      showCourseSelector();

      // let prevUrl = localStorage.getItem("sessionSaveUrl");
      // console.log("prevUrl", prevUrl);

      // db에서 삭제할 파일id 배열에 담기
      $(".softDeleteFile").click(function () {
        softDeleteFile(this);
      })

      // 새로운 파일 리스트에 넣기
      $("#files").change(function () {
        //파일 사이즈
        pushFileList();
        previewFile(fileList);
        $(this).val("");
      })

      //취소 버튼 클릭 시 상세로 이동
      $("#reset").on("click", function (e) {
        e.preventDefault();
        let params = new URLSearchParams(window.location.search);
        let homeworkId = params.get("homeworkId");
        location.href = "/homework/homeworkDetail?homeworkId=" + homeworkId;
      });

      //-------------------폼 전송---------------------

      // 폼 전송
      $("#submit").on("click", function (e) {
        e.preventDefault();
        let form = document.getElementById("formSubmit");
        let formData = new FormData(form);



        formData.append("homeworkId", homeworkId);

        //updateAt
        let updatedAt = new Date().toISOString();
        formData.append("updatedAt", updatedAt);

        fileList.forEach(function (file) {
          formData.append("files", file);
        })

        deleteFileList.forEach(function (file) {
          formData.append("deleteFiles", file); // id
        })

        for (let [key, value] of formData.entries()) {
          // console.log("formData entry:", key, value);
        }

        axios.post("/homework/homeworkModify",
            formData
        ).then(function (response) {
          // console.log(response)
         location.href = "/homework/homeworkDetail?homeworkId=" + homeworkId;
        }).catch(function (error) {
          // console.log("API 요청 실패", error);
          errorMap = error.response.data.data;
          if(errorMap) {
            // console.log("errorMap", errorMap);

            if (errorMap.title) {
              $("#titleError").html(errorMap.title);
            } else {
              $("#titleError").html("");
            }

            if (errorMap.startDate) {
              $("#startDateError").html(errorMap.startDate);
            } else {
              $("#startDateError").html("");
            }

            if (errorMap.endDate) {
              $("#endDateError").html(errorMap.endDate);
            } else {
              $("#endDateError").html("");
            }

            if (errorMap.content) {
              $("#contentError").html(errorMap.content);
            } else {
              $("#contentError").html("");
            }
          }


        })
      })




    });


  </script>
</th:block>
</body>
</html>
