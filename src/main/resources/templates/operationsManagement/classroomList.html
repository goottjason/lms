<!DOCTYPE html>
<html lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/basic.html}">
<head>

</head>
<body>
<div layout:fragment="content">
  <input type="hidden" th:value="${session.loginUser.id}" id="login-user-id">
  <input type="hidden" th:value="${session.loginUser.type}" id="login-user-type">
  <!-- content header 시작 -->
  <div class="row align-items-center">
    <h1 class="h3 col-3 mx-3 mb-3 text-gray-800">강의실 관리</h1>
  </div>
  <!-- content header 끝 -->

  <!-- content body 시작 -->
  <!-- 강의실 등록 -->
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <div class="row align-items-center">
        <div class="col">
          <h6 class="m-0 font-weight-bold text-primary">강의실 등록</h6>
        </div>
      </div>
    </div>
    <div class="card-body">

      <div class="row mb-2">
        <div class="col-md-4">
          <div class="form-group">
            <label for="classroom-input">강의실명</label>
            <input type="text" id="classroom-input" class="form-control">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label for="primary-select">관리자(정)</label>
            <select id="primary-select" class="form-control">
            </select>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label for="secondary-select">관리자(부)</label>
            <select id="secondary-select" class="form-control">
            </select>
          </div>
        </div>
      </div>

      <!-- 버튼 -->
      <div class="col-12 d-flex justify-content-end">
        <button id="add-button" class="btn btn-primary btn-icon-split mr-2">
          <span class="icon text-white-50">
              <i class="fas fa-upload"></i>
          </span>
          <span class="text px-5">저장</span>
        </button>
      </div>

    </div>
  </div>

  <!-- 강의실 현황 -->
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <div class="row align-items-center">
        <div class="col">
          <h6 class="m-0 font-weight-bold text-primary">강의실 현황</h6>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table">
          <thead>
          <tr class="text-center">
            <th scope="col" class="align-middle" width="15%">강의실명</th>
            <th scope="col" class="align-middle" width="34%">배정현황</th>
            <th scope="col" class="align-middle" width="10%">상태</th>
            <th scope="col" class="align-middle" width="13%">관리자(정)</th>
            <th scope="col" class="align-middle" width="13%">관리자(부)</th>
            <th scope="col" class="align-middle" width="15%">관리</th>
          </tr>
          </thead>
          <tbody id="table-body">
          </tbody>
        </table>
      </div>

      <!-- 페이지 -->
      <nav aria-label="Page navigation example" class="col mt-4">
        <ul class="pagination justify-content-center" id="classroom-pagination">

        </ul>
      </nav>
    </div>
  </div>












  <!-- content body 끝 -->
</div>
<th:block layout:fragment="script">
  <!-- 외부 JS 파일 연결 -->
  <script th:src="@{/js/operationsManagement/classroomList.js}" type="text/javascript"></script>
</th:block>
</body>
</html>
