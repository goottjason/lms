<!DOCTYPE html>
<html lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/basic.html}">
<head>

</head>
<body>
<div layout:fragment="content">

  <input type="hidden" th:value="${session.loginUser.id}" id="login-user-id">
  <input type="hidden" th:value="${session.loginUser.type}" id="login-user-type">
  <!-- content header 시작 -->
  <div class="row align-items-center">
    <h1 class="h3 col-3 mx-3 mb-3 text-gray-800">교직원 조회</h1>
  </div>
  <!-- content header 끝 -->

  <!-- content body 시작 -->
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <div class="row align-items-center">
        <div class="col-2 ml-auto">
          <h6 class="m-0 font-weight-bold text-primary">교직원 조회</h6>
        </div>
        <div class="col-3 ml-auto d-flex justify-content-end">
            <input type="radio" id="only-active" name="staff-filter" value="false" checked="checked">
            <label for="only-active" style="margin-bottom: 0">&nbsp;&nbsp;재직자만&nbsp;&nbsp;&nbsp;&nbsp;</label>

            <input type="radio" id="only-leaver" name="staff-filter" value="true">
            <label for="only-leaver" style="margin-bottom: 0">&nbsp;&nbsp;퇴사자만&nbsp;&nbsp;&nbsp;&nbsp;</label>

            <input type="radio" id="all" name="staff-filter" value="">
            <label for="all" style="margin-bottom: 0">&nbsp;&nbsp;전체</label>
        </div>
        <div class="col-2 ml-auto">
          <!--분류별-->
          <select id="type-select" class="form-control">
            <option value="">전체</option>
            <option value="ADMINISTRATOR">관리자</option>
            <option value="INSTRUCTOR">강사</option>
          </select>
        </div>
        <div class="col-2 ml-auto">
          <!--직급별-->
          <select id="position-select" class="form-control">
            <option value="">전체</option>
            <option value="GENERAL_MANAGER">총괄관리자</option>
            <option value="COURSE_HEAD">학과장</option>
            <option value="FULLTIME_INSTRUCTOR">전임강사</option>
          </select>
        </div>
        <div class="col-3 input-group">
          <div class="input-group">
            <input type="text" class="form-control" id="search-input" placeholder="이름으로 검색하세요.">
            <div class="input-group-append">
              <button class="btn btn-primary" type="button" id="search-button">
                <i class="fas fa-search fa-sm"></i>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="card-body">
      <div class="mb-2 row">
        <p class="col">
          <span id="categorize-content"></span>
        </p>
        <p class="justify-content-end mx-5">
          <span id="number-of-staff"></span>
        </p>
      </div>
      <!-- 카드 리스트 -->
      <div class="row row-cols-1 row-cols-md-4" id="card-list">

      </div>

      <!-- 페이지 -->
      <nav aria-label="Page navigation example" class="col mt-4" id="staff-pagination">
        <ul class="pagination justify-content-center">
          <li class="page-item">
            <span class="page-link">이전</span>
          </li>
          <li class="page-item active">
            <span class="page-link">1</span>
          </li>
          <li class="page-item">
            <span class="page-link">2</span>
          </li>
          <li class="page-item">
            <span class="page-link">3</span>
          </li>
          <li class="page-item">
            <span class="page-link page-move">다음</span>
          </li>
        </ul>
      </nav>
    </div>
  </div>
  <!-- content body 끝 -->
</div>
<th:block layout:fragment="script">
  <!-- 외부 JS 파일 연결 -->
  <script th:src="@{/js/operationsManagement/staffList.js}" type="text/javascript"></script>
</th:block>
</body>
</html>
