<!DOCTYPE html>
<html
    lang="ko"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{layout/basic.html}">
<head>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .pinned-post {
      background-color: #fffbe6; /* 약간 누런색 배경 */
      font-weight: bold; /* 글씨를 약간 굵게 */
    }

  </style>
</head>
<body>
<div layout:fragment="content">
  <input type="hidden" th:value="${session.loginUser.id}" id="login-user-id">
  <input type="hidden" th:value="${session.loginUser.type}" id="login-user-type">
  <!-- content header 시작 -->
  <div class="row align-items-center">
    <h1 class="h3 col-4 mx-3 mb-3 text-gray-800">수업공지 조회</h1>
    <!-- 과정 검색 필터 (관리자만 나오도록 개발해주세요.) -->
    <div class="col d-flex justify-content-end" th:if="${loginUserType == 'ADMINISTRATOR'}">
      <form class="row col-12 mb-3">
        <div class="col-3">
          <select id="is-in-progress" name="isInProgress" class="form-control">
            <option value="">전체</option>
            <option value="true" th:selected="${responseDTO?.pagingRequestDTO?.isInProgress == true}">진행 중</option>
            <option value="false" th:selected="${responseDTO?.pagingRequestDTO?.isInProgress == false}">종료</option>
          </select>
        </div>
        <div class="col">
          <select id="course-select" class="form-control">
            <option value="">전체</option>
          </select>
        </div>
      </form>
    </div>
  </div>
  <!-- content header 끝 -->

  <!-- content body 시작 -->
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <div class="row align-items-center">
        <div class="col">
          <h6 class="m-0 font-weight-bold text-primary">공지 및 수업자료 리스트 조회</h6>
        </div>
        <div class="col-auto">
          <form action="/courseBoardMaterials/materialsRegister" method="get" id="registerForm">
            <input type="hidden" name="courseId" id="courseIdForRegister">
            <button type="submit" id="materialsRegisterBtn" class="btn btn-info btn-icon-split">
              <span class="icon text-white-50"><i class="fas fa-plus"></i></span>
              <span class="text">수업공지 등록</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="card-body">
      <!-- 검색 / 정렬 영역 -->
      <form class="row mb-3" action="/courseBoardMaterials/materialsList" method="get" id="materialsSearchForm">
        <input type="hidden" name="courseId" id="searchCourseId" th:value="${responseDTO?.pagingRequestDTO?.courseId}">
        <input type="hidden" name="isInProgress" id="searchInProgress" th:value="${responseDTO?.pagingRequestDTO?.isInProgress}">
        <div class="input-group col-6">
          <div class="col-3">
            <select id="" name="type" class="form-control">
              <option value="t" th:selected="${responseDTO?.pagingRequestDTO?.type == 't' or (responseDTO?.pagingRequestDTO?.type != null and #strings.contains(responseDTO.pagingRequestDTO.type, 't'))}">제목</option>
              <option value="c" th:selected="${responseDTO?.pagingRequestDTO?.type == 'c' or (responseDTO?.pagingRequestDTO?.type != null and #strings.contains(responseDTO.pagingRequestDTO.type, 'c'))}">내용</option>
              <option value="w" th:selected="${responseDTO?.pagingRequestDTO?.type == 'w' or (responseDTO?.pagingRequestDTO?.type != null and #strings.contains(responseDTO.pagingRequestDTO.type, 'w'))}">작성자</option>
            </select>
          </div>
          <div class="col-9 input-group">
            <input type="text" class="form-control" placeholder="검색어를 입력하세요." name="keyword"
                   th:value="${responseDTO?.pagingRequestDTO?.keyword}">
            <div class="input-group-append">
              <button class="btn btn-primary" type="submit" id="searchBtn">
                <i class="fas fa-search fa-sm"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="col-6 d-flex justify-content-end">
          <select id="hasAttachment" name="hasAttachment" class="form-control col-3 mr-3">
            <option value="">파일 여부</option>
            <option value="true" th:selected="${responseDTO?.pagingRequestDTO?.hasAttachment == true}">파일 있음</option>
            <option value="false" th:selected="${responseDTO?.pagingRequestDTO?.hasAttachment == false}">파일 없음</option>
          </select>
            <select id="orderBy" name="orderBy" class="form-control col-3 mr-3">
              <option value="createdAt" th:selected="${responseDTO?.pagingRequestDTO?.orderBy == 'createdAt'}">작성일</option>
              <option value="readCount" th:selected="${responseDTO?.pagingRequestDTO?.orderBy == 'readCount'}">조회수</option>
              <option value="title" th:selected="${responseDTO?.pagingRequestDTO?.orderBy == 'title'}">제목</option>
            </select>
          <select id="orderDirection" name="orderDirection" class="form-control col-3">
            <option value="desc" th:selected="${responseDTO?.pagingRequestDTO?.orderDirection == 'desc'}">내림차순</option>
            <option value="asc" th:selected="${responseDTO?.pagingRequestDTO?.orderDirection == 'asc'}">오름차순</option>
          </select>
        </div>
        <input type="hidden" name="pagingSize" th:value="${responseDTO?.pagingRequestDTO?.pagingSize}">
      </form>

      <!-- 테이블 리스트 -->
      <div class="table-responsive">
        <table class="table">
          <thead>
          <tr class="text-center">
            <th scope="col" class="align-middle">No</th>
            <th scope="col" class="align-middle">제목</th>
            <th scope="col" class="align-middle">과정명</th>
            <th scope="col" class="align-middle">작성자</th>
            <th scope="col" class="align-middle">작성일</th>
            <th scope="col" class="align-middle">조회수</th>
          </tr>
          </thead>
          <tbody>

          <tr th:each="dto : ${responseDTO.pinnedList}" class="pinned-post">
            <td class="text-center align-middle"><i class="fas fa-thumbtack text-primary"></i></td>
            <td class="title align-middle">
              <a th:href="|/courseBoardMaterials/materialsDetail?id=${dto.id}${responseDTO.pagingRequestDTO.generateLinkExceptPageNo()}&pageNo=${responseDTO.pageNo}|"
                 th:text="${#strings.abbreviate(dto.title, 30)}" onclick="setFlag();">고정글 제목</a>
              <span th:if="${dto.isAttached}" class="ml-2">
                <i class="fas fa-cog text-secondary"></i>
              </span>
            </td>
            <td th:text="${dto.courseName}" class="title align-middle text-truncate" style="max-width: 200px;">과정명</td>
            <td th:text="${dto.writerName}" class="text-center align-middle">작성자</td>
            <td th:text="${#temporals.format(dto.createdAt, 'yyyy-MM-dd')}" class="text-center align-middle">작성일</td>
            <td th:text="${dto.readCount}" class="text-center align-middle">조회수</td>
          </tr>


          <tr th:each="dto: ${responseDTO.dtoList}">
            <td th:text="${dto.id}" class="text-center align-middle">0</td>
            <td class="title align-middle">
              <th:block th:if="${dto.deletedAt == null}">
                <a th:href="|/courseBoardMaterials/materialsDetail?id=${dto.id}${responseDTO.pagingRequestDTO.generateLinkExceptPageNo()}&pageNo=${responseDTO.pageNo}|"
                   th:text="${#strings.abbreviate(dto.title, 30)}" onclick="setFlag();">제목</a>
                <span th:if="${dto.isAttached}" class="ml-2">
                    <i class="fas fa-cog text-secondary"></i>
                </span>
              </th:block>
              <th:block th:if="${dto.deletedAt != null}">
                <span class="text-muted" readonly="readonly">삭제된 글입니다.</span>
              </th:block>
            </td>
            <td th:text="${dto.courseName}" class="title align-middle text-truncate" style="max-width: 200px;">과정명</td>
            <td th:text="${dto.writerName}" class="text-center align-middle">작성자</td>
            <td th:text="${#temporals.format(dto.createdAt, 'yyyy-MM-dd')}" class="text-center align-middle">작성일</td>
            <td th:text="${dto.readCount}" class="text-center align-middle">조회수</td>
          </tr>

          <tr th:if="${#lists.isEmpty(responseDTO.dtoList)} and (${responseDTO.pagingRequestDTO.keyword != null and !#strings.isEmpty(responseDTO.pagingRequestDTO.keyword)} or ${#lists.isEmpty(responseDTO.pinnedList)})">
            <td colspan="6" class="text-center">검색 결과가 없습니다.</td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- 페이지 네이션 -->
      <nav aria-label="Page navigation example" class="col mt-4" th:if="${responseDTO.total > 0}">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${!responseDTO.prev} ? 'disabled'">
            <a class="page-link"
               th:href="@{/courseBoardMaterials/materialsList(pageNo=${responseDTO.start - 1},
                                                             type=${responseDTO.pagingRequestDTO.type},
                                                             keyword=${responseDTO.pagingRequestDTO.keyword},
                                                             courseId=${responseDTO.pagingRequestDTO.courseId},
                                                             isInProgress=${responseDTO.pagingRequestDTO.isInProgress},
                                                             hasAttachment=${responseDTO.pagingRequestDTO.hasAttachment},
                                                             orderBy=${responseDTO.pagingRequestDTO.orderBy},
                                                             orderDirection=${responseDTO.pagingRequestDTO.orderDirection},
                                                             pagingSize=${responseDTO.pagingRequestDTO.pagingSize})}"
               aria-label="Previous">
              <span aria-hidden="true">이전</span>
            </a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(responseDTO.start, responseDTO.end)}"
              th:classappend="${i == responseDTO.pageNo} ? 'active'">
            <a class="page-link"
               th:href="@{/courseBoardMaterials/materialsList(pageNo=${i},
                                                             type=${responseDTO.pagingRequestDTO.type},
                                                             keyword=${responseDTO.pagingRequestDTO.keyword},
                                                             courseId=${responseDTO.pagingRequestDTO.courseId},
                                                             isInProgress=${responseDTO.pagingRequestDTO.isInProgress},
                                                             hasAttachment=${responseDTO.pagingRequestDTO.hasAttachment},
                                                             orderBy=${responseDTO.pagingRequestDTO.orderBy},
                                                             orderDirection=${responseDTO.pagingRequestDTO.orderDirection},
                                                             pagingSize=${responseDTO.pagingRequestDTO.pagingSize})}"
               th:text="${i}">1</a>
          </li>
          <li class="page-item" th:classappend="${!responseDTO.next} ? 'disabled'">
            <a class="page-link"
               th:href="@{/courseBoardMaterials/materialsList(pageNo=${responseDTO.end + 1},
                                                             type=${responseDTO.pagingRequestDTO.type},
                                                             keyword=${responseDTO.pagingRequestDTO.keyword},
                                                             courseId=${responseDTO.pagingRequestDTO.courseId},
                                                             isInProgress=${responseDTO.pagingRequestDTO.isInProgress},
                                                             hasAttachment=${responseDTO.pagingRequestDTO.hasAttachment},
                                                             orderBy=${responseDTO.pagingRequestDTO.orderBy},
                                                             orderDirection=${responseDTO.pagingRequestDTO.orderDirection},
                                                             pagingSize=${responseDTO.pagingRequestDTO.pagingSize})}"
               aria-label="Next">
              <span aria-hidden="true">다음</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
  <!-- content body 끝 -->
</div>
<th:block layout:fragment="script" th:inline="javascript">
  <script>
    const loginUserId = $("#login-user-id").val();
    const loginUserType = $("#login-user-type").val();
    const currentCourseId = /*[[${responseDTO.pagingRequestDTO?.courseId}]]*/ null;

    let baseConfig = {
      loginUserId  : loginUserId,
      loginUserType: loginUserType
    };

    let courseConfig = {
      pageNo        : null,
      pageSize      : null,
      type          : "coName",
      keyword       : null,
      orderBy       : "coStartDate",
      orderDirection: "ASC",
      coIsInProgress: null,
      coId          : null
    };
    let configCoId = null;

    document.addEventListener('DOMContentLoaded', function() {
      const isFiltering = sessionStorage.getItem('isFiltering') === 'true';
      const isEnteringDetail = sessionStorage.getItem('isEnteringDetail') === 'true';

      // 필터링 중이거나 상세페이지에서 돌아온 것이 아니라면, 새로운 방문으로 간주하고 필터 초기화
      if (!isFiltering && !isEnteringDetail) {
        sessionStorage.removeItem('courseConfig');
      }

      // 판별에 사용된 플래그들은 다음을 위해 항상 제거
      sessionStorage.removeItem('isFiltering');
      sessionStorage.removeItem('isEnteringDetail');

      getStatus();
      configCoId = currentCourseId;
      courseConfig.coId = null;

      fetchAndLoadCourseSelect();

      // 이벤트 핸들러 등록
      $(document).on("change", "#is-in-progress", handleIsInProgressChange);
      $(document).on("change", "#course-select", handleCourseSelectChange);

      // 검색 폼 제출 시 '필터링 중' 플래그 설정
      $("#searchBtn").on("click", function(event) {
        const keywordInput = $('#materialsSearchForm').find('input[name="keyword"]');

        if (keywordInput.val().trim() === '') {
          event.preventDefault();
          Swal.fire({
            title: '키워드를 입력해주세요.',
            icon: 'warning'
          });
          return;
        }
        // 유효한 검색어일 경우에만 필터링 상태를 저장합니다.
        sessionStorage.setItem('isFiltering', 'true');
      });

      initializePage();
      initializeExistingFilters();

      // 페이지 로드 시 '진행 중/종료' 필터 상태를 세션스토리지 값으로 설정
      $('#is-in-progress').val(courseConfig.coIsInProgress);
    });

    // '진행 중/종료' 필터 변경 시 호출될 함수 (신규 추가)
    function handleIsInProgressChange() {
      sessionStorage.setItem('isFiltering', 'true');
      // courseConfig에 현재 '진행 중/종료' 상태 저장
      courseConfig.coIsInProgress = $("#is-in-progress").val() === "" ? null : $("#is-in-progress").val();
      // 과정 선택 상태 초기화
      courseConfig.coId = null;
      setStatus(); // 변경된 필터 상태를 세션스토리지에 저장

      // 필터 변경 시, 과정 선택을 '전체'로 간주하고 바로 검색을 실행
      const inProgressStatus = $("#is-in-progress").val();
      $("#searchInProgress").val(inProgressStatus);
      $("#searchCourseId").val(""); // 과정 선택을 '전체'로 초기화
      $("#materialsSearchForm").submit();
    }

    // '과정' 필터 변경 시 호출될 함수 (중복 제거 및 최종 수정본)
    function handleCourseSelectChange() {
      sessionStorage.setItem('isFiltering', 'true');

      courseConfig.coId = $("#course-select").val() === "" ? null : $("#course-select").val();
      setStatus();

      const courseId = $("#course-select").val();
      const inProgressStatus = $("#is-in-progress").val(); // '진행 중' 상태도 함께 가져옴

      // 두 필터 값을 모두 숨겨진 input에 담아 폼 제출
      $("#searchCourseId").val(courseId);
      $("#searchInProgress").val(inProgressStatus);
      $("#materialsSearchForm").submit();
    }

    async function fetchAndLoadCourseSelect() {
      let coursesWithPaging = await apiGetRequestParams(
          "/api/coursemanagement/courses",
          {...baseConfig, ...courseConfig});
      LoadCourseSelect(coursesWithPaging);
    }

    async function apiGetRequestParams(endpoint, params) {
      try {
        const response = await axios.get(endpoint, {params: params});
        return response.data.data;
      } catch (error) {
        return [];
      }
    }

    function LoadCourseSelect(coursesWithPaging) {
      let courses = coursesWithPaging?.records || [];
      if (!Array.isArray(courses)) {
        courses = [];
      }
      LoadCourseSelectOption("#course-select", courses);

      // 관리자 화면에서 현재 선택된 과정 정보를 찾아 등록 버튼 상태 설정
      const currentRecord = courses.find(r => r.courseWithAssignedInfo.coId == configCoId);
      if (currentRecord) {
        // API 응답 구조에 맞게 표준화된 객체 생성
        const currentCourse = {
          id: currentRecord.courseWithAssignedInfo.coId,
          name: currentRecord.courseWithAssignedInfo.coName,
          isInProgress: currentRecord.courseWithAssignedInfo.coIsInProgress
        };
        setupRegisterButton(currentCourse);
      }
    }

    function LoadCourseSelectOption(selector, records) {
      const $select = $(selector).empty().append("<option value=\"\">전체</option>");
      records.forEach(record => {
        const $option = $("<option>")
        .val(record.courseWithAssignedInfo.coId)
        .text(record.courseWithAssignedInfo.coName);
        $select.append($option);
        if (record.courseWithAssignedInfo.coId == configCoId) {
          $option.prop("selected", true);
        }
      });

      if (configCoId == null) {
        $select.find("option:first").prop("selected", true);
      }
    }

    async function initializePage() {
      const headerCourseSelector = document.getElementById('courseSelector');
      if (headerCourseSelector) {
        let courses = await fetchCourses();
        if (!courses || courses.length === 0) {
          setupRegisterButton(null);
          return;
        }

        courses.sort((a, b) => b.isInProgress - a.isInProgress);

        const loadedCourseId = currentCourseId;
        const defaultCourse = courses[0];
        const loadedCourse = courses.find(c => c.id == loadedCourseId);

        // 사용자가 드롭다운에서 직접 과정을 선택했는지 여부를 확인합니다.
        const userHasChosen = sessionStorage.getItem('userMadeCourseSelection') === 'true';

        // 사용자가 직접 선택한 것이 "아니고", 현재 페이지가 종료된 과정이며, 보여줄 진행중인 과정이 있다면 리디렉션합니다.
        if (!userHasChosen && loadedCourse && loadedCourse.isInProgress === false && defaultCourse.isInProgress === true) {
          document.getElementById('searchCourseId').value = defaultCourse.id;
          document.getElementById('materialsSearchForm').submit();
          return;
        }

        // 확인이 끝났으면, 다음 방문(새로고침, 주소 직접 입력 등)을 위해 깃발을 항상 제거합니다.
        sessionStorage.removeItem('userMadeCourseSelection');

        const currentCourseToDisplay = loadedCourse || defaultCourse;

        setupRegisterButton(currentCourseToDisplay);
        updateCourseSelectBox('#courseSelector', courses, currentCourseToDisplay.id);
        updateRegisterButtonLink();

        headerCourseSelector.addEventListener('change', function() {
          // 사용자가 과정을 직접 선택하면 '깃발'을 세웁니다.
          sessionStorage.setItem('userMadeCourseSelection', 'true');

          const selectedCourseId = this.value;
          document.getElementById('searchCourseId').value = selectedCourseId;
          document.getElementById('searchForm').submit();
        });
      } else {
        setupRegisterButton(null);
      }
    }

    async function fetchCourses() {
      if (loginUserType === 'ADMINISTRATOR') {
        return [];
      }
      try {
        const response = await axios.get('/api/management/courses', {
          params: { loginUserId: loginUserId, loginUserType: loginUserType }
        });
        return response.data?.data?.respDTOS || [];
      } catch (error) {
        console.error('과정 목록을 가져오는 중 오류가 발생했습니다:', error);
        return [];
      }
    }

    function updateCourseSelectBox(selector, data, selectedValue) {
      const selectElement = document.querySelector(selector);
      if (!selectElement) return;
      selectElement.innerHTML = ''; // 내용을 비웁니다.

      // '과정 선택' 옵션을 생성하는 부분을 삭제하고 바로 과정 목록을 추가합니다.
      data.forEach(course => {
        const option = document.createElement('option');
        option.value = course.id;
        option.textContent = course.name;
        if (course.id == selectedValue) {
          option.selected = true;
        }
        selectElement.appendChild(option);
      });
    }

    function updateRegisterButtonLink() {
      const headerCourseSelector = document.getElementById('courseSelector');
      const courseIdInputForRegister = document.getElementById('courseIdForRegister');
      if (headerCourseSelector && courseIdInputForRegister) {
        courseIdInputForRegister.value = headerCourseSelector.value;
      }
    }

    function setupRegisterButton(currentCourse) {
      const registerButton = document.getElementById('materialsRegisterBtn');
      if (!registerButton) return;

      // 기본적으로 관리자 또는 강사일 경우 버튼을 보여줄지 결정
      let showButton = (loginUserType === 'ADMINISTRATOR' || loginUserType === 'INSTRUCTOR');

      // 만약 특정 과정이 선택되었고, 그 과정이 '종료' 상태라면 버튼을 숨김
      if (currentCourse && currentCourse.isInProgress === false) {
        showButton = false;
      }

      registerButton.style.display = showButton ? 'block' : 'none';
    }

    function initializeExistingFilters() {
      const searchForm = document.getElementById('searchForm');
      const hasAttachmentSelect = document.getElementById('hasAttachment');
      const orderDirectionSelect = document.getElementById('orderDirection');
      const orderBySelect = document.getElementById('orderBy');
      [hasAttachmentSelect, orderDirectionSelect, orderBySelect].forEach(element => {
        if (element) {
          element.addEventListener('change', () =>{
              sessionStorage.setItem('isFiltering', 'true');
              searchForm.submit();
          });
        }
      });
    }

    $("#materialsRegisterBtn").on("click", function (e) {
      e.preventDefault();
      let selectedCourseId;
      if (loginUserType === 'ADMINISTRATOR') {
        selectedCourseId = $("#course-select").val();
      } else {
        selectedCourseId = $("#courseSelector").val();
      }
      if (!selectedCourseId) {
        Swal.fire({
          title: "먼저 과정을 선택해주세요.",
          icon: "warning",
        });
        return;
      }
      $("#courseIdForRegister").val(selectedCourseId);
      $("#registerForm").submit();
    });

    function getStatus() {
      let courseStatusByUser = sessionStorage.getItem("courseConfig");
      if (courseStatusByUser) {
        const parsedCourseConfig = JSON.parse(sessionStorage.getItem("courseConfig"));
        Object.assign(courseConfig, parsedCourseConfig);
      }
    }

    function setStatus() {
      sessionStorage.setItem("courseConfig", JSON.stringify(courseConfig));
    }

    function setFlag() {
      sessionStorage.setItem('isEnteringDetail', 'true');

  </script>
