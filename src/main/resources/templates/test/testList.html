<!DOCTYPE html>
<html
    lang="ko"
    layout:decorate="~{layout/basic.html}"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org">
  <head>
    <script defer th:src="@{https://cdn.jsdelivr.net/npm/sweetalert2@11}"></script>
    <script defer th:src="@{/js/test/testApi.js}"></script>
    <script defer th:src="@{/js/test/testCommon.js}"></script>
    <script defer th:src="@{/js/test/testList.js}"></script>
  </head>
  <body>
    <div layout:fragment="content">
      <input type="hidden" th:value="${session.loginUser.id}" id="login-user-id">
      <!-- content header 시작 -->
      <div class="row align-items-center">
        <h1 class="h3 col-4 mx-3 mb-3 text-gray-800">시험 조회</h1>
        <!-- 과정 검색 필터 (관리자만 나오도록 개발해주세요.) -->

        <div id="admin-filter" class="col d-flex justify-content-end">
          <form class="row col-12 mb-3">
            <div class="col-3">
              <select class="form-control" id="progress-filter">
                <option value="">전체(진행상황별)</option>
                <option value="true">진행 중</option>
                <option value="false">종료</option>
              </select>
            </div>
            <div class="col">
              <select class="form-control" id="course-filter">
                <option value="">전체(과정별)</option>
              </select>
            </div>
          </form>

        </div>
      </div>
      <!-- content header 끝 -->

      <!-- content body 시작 -->
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <div class="row align-items-center">
            <div class="col">
              <h6 class="m-0 font-weight-bold text-primary">시험 리스트 조회</h6>
            </div>
            <div class="col-auto">

              <button
                  class="btn btn-info btn-icon-split"
                  data-current-page-no="1"
                  id="test-register-btn">
              <span class="icon text-white-50">
                <i class="fas fa-plus"></i>
              </span>
                <span class="text">시험 등록</span>
              </button>

            </div>
          </div>
        </div>

        <div class="card-body">

          <!-- 테이블 리스트 -->
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr class="text-center">
                  <th class="align-middle" scope="col" style="width: 25%;">시험명</th>
                  <th class="align-middle" scope="col" style="width: 15%;">과정명</th>
                  <th class="align-middle" scope="col" style="width: 25%;">응시기간</th>
                  <th class="align-middle" scope="col" style="width: 10%;">진행상태</th>
                  <th class="align-middle" scope="col" style="width: 10%;">제한시간</th>
                  <th class="align-middle" scope="col" style="width: 8%;">응시자수</th>
                </tr>
              </thead>
              <tbody class="test-table-body">

              </tbody>
            </table>
          </div>

          <!-- 페이지 -->
          <nav aria-label="Page navigation example" class="col mt-4">
            <ul class="pagination justify-content-center">
              <li class="page-item">
                <span class="page-link">이전</span>
              </li>
              <li class="page-item active">
                <span class="page-link">1</span>
              </li>
              <li class="page-item">
                <span class="page-link">2</span>
              </li>
              <li class="page-item">
                <span class="page-link">3</span>
              </li>
              <li class="page-item">
                <span class="page-link page-move">다음</span>
              </li>
            </ul>
          </nav>
        </div>
      </div>
      <!-- content body 끝 -->
    </div>
    <th:block layout:fragment="script" th:inline="javascript">
      <script>
        // javascript 개발은 여기에...

      </script>
    </th:block>
  </body>
</html>
