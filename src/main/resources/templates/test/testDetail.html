    <style>
      .question-container {
        max-height: 600px; /* 문항들 묶은 div인데, Conner가 원하는 높이로 설정해보세요. */
        overflow-y: auto;
        padding-top: 10px;
        padding-left: 8px;
        padding-right: 8px;
      }

      .question-container::-webkit-scrollbar {
        width: 6px;
      }

      .question-container::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 3px;
      }

      .answer-container {
        max-height: 550px;
        overflow-y: auto;
        padding-top: 10px;
        padding-left: 8px;
        padding-right: 8px;
      }

      .answer-container::-webkit-scrollbar {
        width: 6px;
      }

      .answer-container::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 3px;
      }


      .custom-tabs .nav-link {
        font-size: 1.1rem;
        font-weight: 500;
        color: #555;
        background-color: #fff;
        border-color: #DCDFEB;
      }

      .custom-tabs .nav-link.active {
        background-color: #4E73DF;
        color: #fff !important;
        border-color: #0d6efd;
      }

      #tabsContent {
        background-color: #fff;
        padding-top: 20px;
      }
    </style>

            <div class="row align-items-center">
              <div class="col">
                <h6 class="m-0 font-weight-bold text-primary">시험정보</h6>
              </div>
            </div>
          </div>
          <div class="card-body">
            <div class="row mb-4 align-items-end">
              <div class="col-md-12">
                <label class="form-label">시험 제목</label>
                <span class="test-title-err-msg"></span>
                <input
                    class="form-control"
                    disabled
                    id="test-title"
                    placeholder="예: Java 중간고사"
                    type="text"
                />
              </div>
            </div>

            <div class="row mb-4">
              <div class="col-md-3">
                <label class="form-label">시험 시작일시</label>
                <span class="test-start-date-err-msg"></span>
                <input class="form-control" disabled id="start-date" type="datetime-local"/>
              </div>
              <div class="col-md-3">
                <label class="form-label">시험 종료일시</label>
                <span class="test-end-date-err-msg"></span>
                <input class="form-control" disabled id="end-date" type="datetime-local"/>
              </div>
              <div class="col-md-3">
                <label class="form-label">시험 시간 (분)</label>
                <span class="test-time-err-msg"></span>
                <input
                    class="form-control" disabled id="test-time" placeholder="예: 60"
                    type="number"/>
              </div>
              <div class="col-md-3">
                <label class="form-label">총 배점</label>
                <span class="total-score-err-msg"></span>
                <input
                    class="form-control"
                    disabled
                    id="total-score"
                    placeholder="예: 100"
                    type="number"/>
              </div>
            </div>
          </div>
