<!DOCTYPE html>
<html
    lang="ko"
    xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <meta content="" name="description">
    <meta content="" name="author">

    <title>Goott5 LMS시스템</title>

    <script th:src="@{https://cdn.jsdelivr.net/npm/sweetalert2@11}"></script>
    <script defer th:src="@{/js/test/testCommon.js}"></script>
    <script defer th:src="@{/js/test/testModel.js}"></script>
    <script defer th:src="@{/js/test/testSubmission.js}"></script>

    <link rel="stylesheet" th:href="@{/vendor/fontawesome-free/css/all.min.css}" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sb-admin-2.min.css}">
    <style>
      @media (max-width : 1200px) {
        body {
          min-width  : 1200px;
          overflow-x : auto;
        }
      }


      html, body {
        height : 100%;
      }

      #wrapper {
        min-height      : 100vh;
        display         : flex;
        justify-content : center;
        align-items     : start;
      }

      .wrapper-card {
        width     : 90%;
        max-width : 1200px;
        height    : auto;
      }

      input[readonly] {
        background-color : #fff !important;
      }


    </style>
  </head>
  <body id="">
    <div class="py-5" id="wrapper">
      <div class="wrapper-card o-hidden border-0 shadow-lg" style="height: auto">
        <div class="card-body p-5">
          <!-- 시험 정보 시작 -->
          <div class="row mb-4 align-items-end">
            <div class="col-md-12 text-center">
              <h2 class="h2 text-gray-900 mb-5" id="test-title">Java 중간고사</h2>
            </div>
          </div>

          <div class="row mb-4">
            <div class="col-md-4">
              <label class="form-label">시험 시작일시</label>
              <span class="test-start-date-err-msg"></span>
              <input class="form-control" disabled id="start-date" type="datetime-local"/>
            </div>
            <div class="col-md-4">
              <label class="form-label">시험 종료일시</label>
              <span class="test-end-date-err-msg"></span>
              <input class="form-control" disabled id="end-date" type="datetime-local"/>
            </div>
            <div class="col-md-2">
              <label class="form-label">시험 시간 (분)</label>
              <span class="test-time-err-msg"></span>
              <input
                  class="form-control" disabled id="test-time" placeholder="예: 60"
                  type="text"/>
            </div>
            <div class="col-md-2">
              <label class="form-label">총 배점</label>
              <span class="total-score-err-msg"></span>
              <input
                  class="form-control"
                  disabled
                  id="total-score"
                  placeholder="예: 100"
                  type="number"/>
            </div>
          </div>
          <!-- 시험 정보 끝 -->

          <div class="question-list-box">
            <div class="card shadow mb-4 question-card">
              <div class="card-header py-2">
                <div class="row align-items-center">
                  <div class="col-1">
                    <h6 class="m-0 font-weight-bold text-primary">문항
                      <span class="question-no" data-question-no="1">1</span></h6>
                  </div>
                  <div class="col-1">
                    객관식
                  </div>
                  <div class="col ml-aut text-info">
                    배점 : <span>10</span>점
                  </div>
                </div>
              </div>
              <div class="card-body">
                <div class="text-primary font-weight-bold mb-4 pt-3">
                  자바의 다형성에 대한 설명 중 틀린 것을 고리시오
                </div>
                <div class="mb-3 question-answer-section">
                  <div class="row align-items-center">
                    <div class="col-10">
                      <label class="form-label">객관식 보기 및 정답 선택</label>
                      <span><small
                          class="text-muted"> (정답에 해당하는 보기 오른쪽 원형 버튼을 선택하세요.)</small></span>
                    </div>
                    <div class="col-1 text-center">
                      정답
                    </div>
                  </div>
                  <div class="option-list">
                    <div class="row align-items-center mb-2 option-row">
                      <div class="col-10">
                        <input
                            class="form-control question-option"
                            data-option-no="1"
                            placeholder="보기 1"
                            readonly
                            type="text"
                        />
                      </div>
                      <div class="col-1 text-center">
                        <input class="question-answer" name="question-1" type="radio"/>
                      </div>
                    </div>
                    <div class="row align-items-center mb-2 option-row">
                      <div class="col-10">
                        <input
                            class="form-control question-option"
                            data-option-no="2"
                            placeholder="보기 2"
                            readonly
                            type="text"
                        />
                      </div>
                      <div class="col-1 text-center">
                        <input class="question-answer" name="question-1" type="radio"/>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="card shadow mb-4 question-card">
              <div class="card-header py-2">
                <div class="row align-items-center">
                  <div class="col-1">
                    <h6 class="m-0 font-weight-bold text-primary">문항
                      <span class="question-no" data-question-no="2">2</span></h6>
                  </div>
                  <div class="col-1">
                    주관식
                  </div>
                  <div class="col ml-aut text-info">
                    배점 : <span>10</span>점
                  </div>
                </div>
              </div>
              <div class="card-body">
                <div class="text-primary font-weight-bold mb-4 pt-3">
                  자바의 다형성에 대해 설명하시오.
                </div>
                <div class="mb-3">
                  <label class="form-label">정답</label>
                  <input
                      class="form-control"
                      placeholder="정답은 하나의 단어 또는 단답형 문장으로만 입력하세요."
                      type="text"
                  />
                </div>
              </div>
            </div>


          </div>

          <div class="col-12 d-flex justify-content-end mt-3 mb-4">
            <button class="btn btn-primary btn-icon-split mr-2" id="test-submit-btn" type="button">
        <span class="icon text-white-50">
          <i class="fa fa-upload"></i>
        </span>
              <span class="text px-3">시험제출</span>
            </button>
          </div>

        </div>
      </div>
    </div>


    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <!-- Core plugin JavaScript-->
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <!-- Custom scripts for all pages-->
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <!-- axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>


    <script>


    </script>
  </body>
</html>
