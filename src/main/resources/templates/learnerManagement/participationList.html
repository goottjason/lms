<!DOCTYPE html>
<html lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/basic.html}">
<head>
  <style>

  </style>

</head>
<body>
<div layout:fragment="content">
  <input type="hidden" th:value="${session.loginUser.id}" id="login-user-id">
  <input type="hidden" th:value="${session.loginUser.type}" id="login-user-type">
  <!-- content header 시작 -->
  <div class="row align-items-center">
    <h1 class="h3 col-3 mx-3 mb-3 text-gray-800">출결 관리</h1>
    <!-- 과정 검색 필터 (관리자만 나오도록 개발해주세요.) -->
    <div class="col d-flex justify-content-end">
      <form class="row col-12 mb-3" th:if="${session.loginUser.type == 'ADMINISTRATOR'}">
        <!--<div class="col-2">
          <select id="is-in-progress" class="form-control">
            <option value="">전체</option>
            <option value="1">진행 중</option>
            <option value="0">종료</option>
          </select>
        </div>-->
        <div class="col-8">
          <select id="course-select" class="form-control">
            <option value="">전체</option>
          </select>
        </div>
        <div class="input-group col-4">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="(전체) 이름 검색" id="search-input">
            <div class="input-group-append">
              <button class="btn btn-primary" type="button" id="search-button">
                <i class="fas fa-search fa-sm"></i>
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
  <!-- content header 끝 -->

  <!-- content body 시작 -->
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <div class="row align-items-center">
        <div class="col-7">
          <span class="h6 mr-2 font-weight-bold text-primary">출결 관리</span>
          <span id="course-name-date"></span>
        </div>
        <!--<div class="col-3">
          <h6 class="m-0 text-secondary">2025-01-03 ~ 2025-07-13</h6>
        </div>-->
        <div class="col-2">
          <h6 class="m-0 text-info" id="course-number-of-learner"></h6>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="row align-items-center mb-5">
        <div class="col-3">
          <span class="m-0 text-secondary pl-3">입·퇴실 현황 업데이트됨</span><br>
          <span class="m-0 text-secondary pl-3" id="time-check"></span>
          <p class="ml-2 mt-2 d-sm-inline-block btn btn-sm btn-primary shadow-sm" id="update-btn">
            <i class="fa fa-undo"></i>
            <!--<i
              class="fas fa-download fa-sm text-white-50 mr-2"></i>업데이트--></p>
        </div>
        <div class="col-6">
          <div class="row m-0 text-secondary text-center">
            <div class="col-3" style="cursor: pointer">
              <i class="fa fa-chevron-left" id="prev-btn"></i>
            </div>
            <h5 class='col-6 text-dark' id="date-display"></h5>
            <div class="col-3" style="cursor: pointer">
              <i class="fa fa-chevron-right" id="next-btn"></i>
            </div>
          </div>
        </div>
        <!-- 탭 버튼 -->
        <div class="col-3 d-flex justify-content-end">
          <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
            <li class="nav-item">
              <a class="nav-link active" id="pills-daily-tab" data-toggle="pill" href="#pills-daily" role="tab" aria-controls="pills-daily" aria-selected="true">일간</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="pills-weekly-tab" data-toggle="pill" href="#pills-weekly" role="tab" aria-controls="pills-weekly" aria-selected="false">주간</a>
            </li>
          </ul>
        </div>
      </div>

      <!-- 탭 상세 -->
      <div class="tab-content" id="pills-tabContent">
        <!-- 일간 상세 -->
        <div class="tab-pane fade show active" id="pills-daily" role="tabpanel" aria-labelledby="pills-daily-tab">

        </div>

        <!-- 주간 상세 -->
        <div class="tab-pane fade" id="pills-weekly" role="tabpanel" aria-labelledby="pills-weekly-tab">




          </div>
        </div>
      </div>
    </div>

  <div
      class="modal fade"
      id="participationModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="myModalLabel"
      aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="myModalLabel">휴가 상세</h6>
          <button type="button" class="close" data-dismiss="modal" aria-label="닫기">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <!-- 테이블 리스트 -->
          <div class="table-responsive">
            <table class="table">
              <thead>
              <tr class="text-center">
                <th scope="col" class="align-middle" style="width: 20%">날짜</th>
                <th scope="col" class="align-middle" style="width: 15%">출결상태</th>
                <th scope="col" class="align-middle" style="width: 45%">사유</th>
                <th scope="col" class="align-middle" style="width: 20%">수료시간</th>
              </tr>
              </thead>
              <tbody id="tbody-reason">

              </tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button id="" class="btn btn-secondary btn-icon-split" data-dismiss="modal">
            <span class="icon text-white-50">
                <i class="fas fa-times"></i>
            </span>
            <span class="text px-3">닫기</span>
          </button>
        </div>
      </div>
    </div>
  </div>

</div>


<th:block layout:fragment="script">
  <!-- 외부 JS 파일 연결 -->
  <script src="https://unpkg.com/dayjs@1.11.9/dayjs.min.js"></script>
  <script src="https://unpkg.com/dayjs@1.11.9/plugin/relativeTime.js"></script>
  <script src="https://unpkg.com/dayjs@1.11.9/plugin/customParseFormat.js">
  <script>dayjs().format()</script>
  <script th:src="@{/js/learnerManagement/participationList.js}" type="text/javascript"></script>
</th:block>
</body>
</html>
