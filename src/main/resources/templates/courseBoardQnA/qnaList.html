<!DOCTYPE html>
<html lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/basic.html}">
  <head>
    <script th:src="@{https://cdn.jsdelivr.net/npm/sweetalert2@11}"></script>
    <script defer th:src="@{/js/courseBoardQnA/qnaApi.js}"></script>
    <script defer th:src="@{/js/courseBoardQnA/qnaList.js}"></script>
  </head>
  <body>
    <div layout:fragment="content">
      <!-- content header 시작 -->
      <div class="row align-items-center">
        <h1 class="h3 col-3 mx-3 mb-3 text-gray-800">Q&A 조회</h1>
        <!-- 과정 검색 필터 (관리자만 나오도록 개발해주세요.) -->
        <div class="col d-flex justify-content-end">
          <form class="row col-12 mb-3">
            <div class="col-3">
              <select id="progress-filter" class="form-control">
                <option value="">전체(진행상황별)</option>
                <option value="true">진행 중</option>
                <option value="false">종료</option>
              </select>
            </div>
            <div class="col">
              <select id="course-filter" class="form-control">
                <option value="">전체(과정별)</option>
              </select>
            </div>
          </form>
        </div>
      </div>
      <!-- content header 끝 -->

      <!-- content body 시작 -->
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <div class="row align-items-center">
            <div class="col">
              <h6 class="m-0 font-weight-bold text-primary">Q&A 리스트 조회</h6>
            </div>
            <div class="col-auto">
<!--              <a class="qna-register-btn" th:href="@{/courseBoardQnA/register}">-->
                <button id="qna-register-btn" class="btn btn-info btn-icon-split">
                <span class="icon text-white-50">
                  <i class="fas fa-plus"></i>
                </span>
                  <span class="text">Q&A 등록</span>
                </button>
<!--              </a>-->
            </div>
          </div>
        </div>

        <div class="card-body">
          <!-- 검색 / 정렬 영역 -->
          <form class="row mb-3">
            <div class="input-group col-6">
              <div class="col-3">
                <select id="search-type" class="form-control">
                  <option value="title">제목</option>
                  <option value="content">내용</option>
                  <option value="writer">작성자</option>
                </select>
              </div>
              <div class="col-9 input-group">
                <input id="qna-search-keyword" type="text" class="form-control"
                       placeholder="검색어를 입력하세요.">
                <div class="input-group-append">
                  <button id="qna-search-btn" class="btn btn-primary" type="button">
                    <i class="fas fa-search fa-sm"></i>
                  </button>
                </div>
              </div>
            </div>
            <div class="col-6 d-flex justify-content-end">
              <select id="answer-status" class="form-control col-3 mr-3">
                <option value="">답변상태</option>
                <option value="unanswered">답변 전</option>
                <option value="answered">답변 완료</option>
              </select>
              <select id="sort-by" class="form-control col-3 mr-3">
                <option value="created_at">작성일</option>
                <option value="title">제목</option>
              </select>
              <select id="sort-order" class="form-control col-3 ">
                <option value="ASC">오름차순</option>
                <option value="DESC">내림차순</option>
              </select>
            </div>
          </form>

          <!-- 테이블 리스트 -->
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr class="text-center">
                  <th scope="col" class="align-middle">No</th>
                  <th scope="col" class="align-middle">제목</th>
                  <th scope="col" class="align-middle">과정명</th>
                  <th scope="col" class="align-middle">작성자</th>
                  <th scope="col" class="align-middle">작성일</th>
                  <th scope="col" class="align-middle">답변상태</th>
                </tr>
              </thead>
              <tbody class="qna-table-body">
              </tbody>
            </table>
          </div>

          <!-- 페이지 -->
          <nav aria-label="Page navigation example" class="col mt-4">
            <ul class="pagination justify-content-center">
              <li class="page-item">
                <span class="page-link">이전</span>
              </li>
              <li class="page-item active">
                <span class="page-link">1</span>
              </li>
              <li class="page-item">
                <span class="page-link">2</span>
              </li>
              <li class="page-item">
                <span class="page-link">3</span>
              </li>
              <li class="page-item">
                <span class="page-link page-move">다음</span>
              </li>
            </ul>
          </nav>
        </div>
      </div>
      <!-- content body 끝 -->
    </div>
    <th:block layout:fragment="script" th:inline="javascript">
      <script>
        // javascript 개발은 여기에...

      </script>
    </th:block>
  </body>
</html>
