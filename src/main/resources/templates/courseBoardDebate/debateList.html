<!DOCTYPE html>
<html lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/basic.html}">
<head>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div layout:fragment="content">
  <input type="hidden" th:value="${session.loginUser.id}" id="login-user-id">
  <input type="hidden" th:value="${session.loginUser.type}" id="login-user-type">
  <!-- content header 시작 -->
  <div class="row align-items-center">
    <h1 class="h3 col-4 mx-3 mb-3 text-gray-800">토론 조회</h1>
    <!-- 과정 검색 필터 (관리자만 나오도록 개발해주세요.) -->
    <div class="col d-flex justify-content-end" th:if="${loginUserType == 'ADMINISTRATOR'}">
      <form class="row col-12 mb-3">
        <div class="col-3">
          <select id="is-in-progress" class="form-control">
            <option value="">진행상황별</option>
            <option value="true">진행 중</option>
            <option value="false">종료</option>
          </select>
        </div>
        <div class="col">
          <select id="course-select" class="form-control">
            <option value="">과정별</option>
          </select>
        </div>
      </form>
    </div>
  </div>
  <!-- content header 끝 -->

  <!-- content body 시작 -->
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <div class="row align-items-center">
        <div class="col">
          <h6 class="m-0 font-weight-bold text-primary">토론 리스트 조회</h6>
        </div>
        <div class="col-auto">
          <form action="/courseBoardDebate/debateRegister" method="get" id="registerForm" th:object="${responseDTO.pagingRequestDTO}">
            <input type="hidden" name="courseId" id="courseIdForRegister" th:value="*{courseId}">
            <input type="hidden" th:field="*{pageNo}" />
            <input type="hidden" th:field="*{pagingSize}" />
            <input type="hidden" th:field="*{keyword}" />
            <input type="hidden" th:field="*{type}" />
            <input type="hidden" th:field="*{orderBy}" />
            <input type="hidden" th:field="*{orderDirection}" />
            <input type="hidden" th:field="*{hasAttachment}" />

            <button type="submit" id="debateRegisterBtn" class="btn btn-info btn-icon-split">
              <span class="icon text-white-50"><i class="fas fa-plus"></i></span>
              <span class="text">토론 등록</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="card-body">
      <!-- 검색 / 정렬 영역 -->
      <form class="row mb-3" action="/courseBoardDebate/debateList" method="get" id="searchForm">
        <input type="hidden" name="courseId" id="searchCourseId" th:value="${responseDTO?.pagingRequestDTO?.courseId}">
        <input type="hidden" name="isInProgress" id="searchInProgress" th:value="${responseDTO?.pagingRequestDTO?.isInProgress}">
        <div class="input-group col-6">
          <div class="col-3">
            <select name="type" class="form-control">
              <option value="t" th:selected="${responseDTO?.pagingRequestDTO?.type == 't' or (responseDTO?.pagingRequestDTO?.type != null and #strings.contains(responseDTO.pagingRequestDTO.type, 't'))}">제목</option>
              <option value="c" th:selected="${responseDTO?.pagingRequestDTO?.type == 'c' or (responseDTO?.pagingRequestDTO?.type != null and #strings.contains(responseDTO.pagingRequestDTO.type, 'c'))}">내용</option>
              <option value="w" th:selected="${responseDTO?.pagingRequestDTO?.type == 'w' or (responseDTO?.pagingRequestDTO?.type != null and #strings.contains(responseDTO.pagingRequestDTO.type, 'w'))}">작성자</option>
            </select>
          </div>
          <div class="col-9 input-group">
            <input type="text" class="form-control" placeholder="검색어를 입력하세요." name="keyword"
                   th:value="${responseDTO?.pagingRequestDTO?.keyword}">
            <div class="input-group-append">
              <button class="btn btn-primary" type="submit">
                <i class="fas fa-search fa-sm"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="col-6 d-flex justify-content-end">
          <select id="hasAttachment" name="hasAttachment" class="form-control col-3 mr-3">
            <option value="">파일 여부</option>
            <option value="true" th:selected="${responseDTO?.pagingRequestDTO?.hasAttachment == true}">파일 있음</option>
            <option value="false" th:selected="${responseDTO?.pagingRequestDTO?.hasAttachment == false}">파일 없음</option>
          </select>
          <select id="orderBy" name="orderBy" class="form-control col-3 mr-3">
            <option value="createdAt" th:selected="${responseDTO?.pagingRequestDTO?.orderBy == 'createdAt'}">작성일</option>
            <option value="readCount" th:selected="${responseDTO?.pagingRequestDTO?.orderBy == 'readCount'}">조회수</option>
            <option value="comment" th:selected="${responseDTO?.pagingRequestDTO?.orderBy == 'comment'}">댓글수</option>
            <option value="forumLike" th:selected="${responseDTO?.pagingRequestDTO?.orderBy == 'forumLike'}">좋아요</option>
            <option value="title" th:selected="${responseDTO?.pagingRequestDTO?.orderBy == 'title'}">제목</option>
          </select>
          <select id="orderDirection" name="orderDirection" class="form-control col-3">
            <option value="desc" th:selected="${responseDTO?.pagingRequestDTO?.orderDirection == 'desc'}">내림차순</option>
            <option value="asc" th:selected="${responseDTO?.pagingRequestDTO?.orderDirection == 'asc'}">오름차순</option>
          </select>
        </div>
        <input type="hidden" name="pagingSize" th:value="${responseDTO?.pagingRequestDTO?.pagingSize}">
      </form>

      <!-- 테이블 리스트 -->
      <div class="table-responsive">
        <table class="table">
          <thead>
          <tr class="text-center">
            <th scope="col" class="align-middle">No</th>
            <th scope="col" class="align-middle">제목</th>
            <th scope="col" class="align-middle">과정명</th>
            <th scope="col" class="align-middle">작성자</th>
            <th scope="col" class="align-middle">작성일</th>
            <th scope="col" class="align-middle">조회수</th>
            <th scope="col" class="align-middle">댓글수</th>
            <th scope="col" class="align-middle">좋아요</th>
          </tr>
          </thead>
          <tbody>

          <tr th:each="dto: ${responseDTO.dtoList}">
            <td th:text="${dto.id}" class="text-center align-middle"></td>
            <td class="title align-middle">
              <th:block th:if="${dto.deletedAt == null}">
                <span th:if="${dto.isHotPost}" class="badge badge-danger mr-2">HOT</span>
                <a th:href="|/courseBoardDebate/debateDetail?id=${dto.id}&pageNo=${responseDTO.pageNo}${responseDTO.pagingRequestDTO.generateLinkExceptPageNo()}|"
                   th:text="${#strings.abbreviate(dto.title, 20)}">제목</a>
                <span th:if="${dto.isAttached}" class="ml-2">
                    <i class="fas fa-cog text-secondary"></i>
                </span>
              </th:block>
              <th:block th:if="${dto.deletedAt != null}">
                <span class="text-muted">삭제된 글입니다.</span>
              </th:block>
            </td>
            <td th:text="${dto.courseName}" class="title align-middle text-truncate" style="max-width: 200px;"></td>
            <td th:text="${dto.writerName}" class="text-center align-middle"></td>
            <td th:text="${#temporals.format(dto.createdAt, 'yyyy-MM-dd')}" class="text-center align-middle"></td>
            <td th:text="${dto.readCount}" class="text-center align-middle"></td>
            <td th:text="${dto.commentCount}" class="text-center align-middle"></td>
            <td th:text="${dto.forumLike}" class="text-center align-middle"></td>
          </tr>

          <tr th:if="${#lists.isEmpty(responseDTO.dtoList)}">
            <td colspan="7" class="text-center">검색 결과가 없습니다.</td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- 페이지 네이션 -->
      <nav aria-label="Page navigation example" class="col mt-4" th:if="${responseDTO.total > 0}">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${!responseDTO.prev} ? 'disabled'">
            <a class="page-link"
               th:href="@{/courseBoardDebate/debateList(pageNo=${responseDTO.start - 1},
                                                             type=${responseDTO.pagingRequestDTO.type},
                                                             keyword=${responseDTO.pagingRequestDTO.keyword},
                                                             courseId=${responseDTO.pagingRequestDTO.courseId},
                                                             isInProgress=${responseDTO.pagingRequestDTO.isInProgress},
                                                             hasAttachment=${responseDTO.pagingRequestDTO.hasAttachment},
                                                             orderBy=${responseDTO.pagingRequestDTO.orderBy},
                                                             orderDirection=${responseDTO.pagingRequestDTO.orderDirection},
                                                             pagingSize=${responseDTO.pagingRequestDTO.pagingSize})}">이전</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(responseDTO.start, responseDTO.end)}"
              th:classappend="${i == responseDTO.pageNo} ? 'active'">
            <a class="page-link"
               th:href="@{/courseBoardDebate/debateList(pageNo=${i},
                                                             type=${responseDTO.pagingRequestDTO.type},
                                                             keyword=${responseDTO.pagingRequestDTO.keyword},
                                                             courseId=${responseDTO.pagingRequestDTO.courseId},
                                                             isInProgress=${responseDTO.pagingRequestDTO.isInProgress},
                                                             hasAttachment=${responseDTO.pagingRequestDTO.hasAttachment},
                                                             orderBy=${responseDTO.pagingRequestDTO.orderBy},
                                                             orderDirection=${responseDTO.pagingRequestDTO.orderDirection},
                                                             pagingSize=${responseDTO.pagingRequestDTO.pagingSize})}"
               th:text="${i}">1</a>
          </li>
          <li class="page-item" th:classappend="${!responseDTO.next} ? 'disabled'">
            <a class="page-link"
               th:href="@{/courseBoardDebate/debateList(pageNo=${responseDTO.end + 1},
                                                             type=${responseDTO.pagingRequestDTO.type},
                                                             keyword=${responseDTO.pagingRequestDTO.keyword},
                                                             courseId=${responseDTO.pagingRequestDTO.courseId},
                                                             isInProgress=${responseDTO.pagingRequestDTO.isInProgress},
                                                             hasAttachment=${responseDTO.pagingRequestDTO.hasAttachment},
                                                             orderBy=${responseDTO.pagingRequestDTO.orderBy},
                                                             orderDirection=${responseDTO.pagingRequestDTO.orderDirection},
                                                             pagingSize=${responseDTO.pagingRequestDTO.pagingSize})}">다음</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
  <!-- content body 끝 -->
</div>
  <th:block layout:fragment="script" th:inline="javascript">
    <script>
      const loginUserId = $("#login-user-id").val();
      const loginUserType = $("#login-user-type").val();
      // URL 파라미터로 받은 현재 courseId (필터링 상태 유지용)
      const currentCourseId = /*[[${responseDTO.pagingRequestDTO?.courseId}]]*/ null;

      // --- 페이지 로드 완료 시 초기화 함수 실행 ---
      document.addEventListener('DOMContentLoaded', function() {
        initializePage();
        initializeExistingFilters(); // 기존 필터링 로직 초기화
        renderAdminCourseFilter();
      });

      // --- 페이지 핵심 기능 초기화 함수 ---
      async function initializePage() {
        // basic.html에 있는 헤더의 courseSelector를 대상으로 작업
        const headerCourseSelector = document.getElementById('courseSelector');

        // 강사 또는 교육생일 경우 (헤더에 courseSelector가 있을 때만)
        if (headerCourseSelector) {
          // 과정 목록 API 호출 및 드롭다운 UI 업데이트
          const courses = await fetchCourses();
          updateCourseSelectBox('#courseSelector', courses, currentCourseId);

          // "수업공지 등록" 버튼 링크에 courseId 초기값 설정
          updateRegisterButtonLink();

          // 과정 선택 드롭다운에 '변경' 이벤트 리스너 추가
          headerCourseSelector.addEventListener('change', function() {
            const selectedCourseId = this.value;
            // 검색 폼의 숨겨진 필드에 선택된 ID값 설정
            document.getElementById('searchCourseId').value = selectedCourseId;
            // 검색 폼 제출하여 페이지 리로드
            document.getElementById('searchForm').submit();
          });
        }

        // "수업공지 등록" 버튼 권한에 따라 표시/숨김 처리
        setupRegisterButton();
      }

      // --- Helper 함수들 ---

      /**
       * API를 통해 해당 유저가 수강중인 과정 목록을 가져오는 함수
       */
      async function fetchCourses() {
        // 관리자가 아닐 때만 API 호출
        if (loginUserType === 'ADMINISTRATOR') {
          return [];
        }
        try {
          const response = await axios.get('/api/management/courses', {
            params: { loginUserId: loginUserId, loginUserType: loginUserType }
          });
          // API 응답 구조에 따라 ?. 연산자로 안전하게 접근
          return response.data?.data?.respDTOS || [];
        } catch (error) {
          console.error('과정 목록을 가져오는 중 오류가 발생했습니다:', error);
          return []; // 오류 발생 시 빈 배열 반환
        }
      }

      /**
       * 과정 목록으로 Select Box(드롭다운) UI를 생성하는 함수
       */
      function updateCourseSelectBox(selector, data, selectedValue) {
        const selectElement = document.querySelector(selector);
        if (!selectElement) return;

        // 기존 옵션들을 모두 비움
        selectElement.innerHTML = '';

        // 기본 옵션("전체 과정 보기" 등) 추가
        const defaultOption = document.createElement('option');
        defaultOption.value = ''; // 값은 비워둠
        defaultOption.textContent = '과정 선택';
        selectElement.appendChild(defaultOption);

        // API로 받아온 과정 목록을 옵션으로 추가
        data.forEach(course => {
          const option = document.createElement('option');
          option.value = course.id;
          option.textContent = course.name;
          // 현재 선택된 courseId와 일치하는 옵션을 'selected'로 만듦
          if (course.id == selectedValue) {
            option.selected = true;
          }
          selectElement.appendChild(option);
        });
      }

      /**
       * "수업공지 등록" 버튼의 숨겨진 courseId 값을 업데이트하는 함수
       */
      function updateRegisterButtonLink() {
        const headerCourseSelector = document.getElementById('courseSelector');
        const courseIdInputForRegister = document.getElementById('courseIdForRegister');

        if (headerCourseSelector && courseIdInputForRegister) {
          // 헤더의 셀렉터에서 현재 선택된 과정 ID를 가져와 숨겨진 필드에 설정
          courseIdInputForRegister.value = headerCourseSelector.value;
        }
      }

      /**
       * "수업공지 등록" 버튼을 유저 권한에 따라 표시하거나 숨기는 함수
       */
      function setupRegisterButton() {
        const registerButton = document.getElementById('debateRegisterBtn');
        if (registerButton) {
          if (loginUserId) { // 로그인 여부만 체크
            registerButton.style.display = 'block';
          } else {
            registerButton.style.display = 'none';
          }
        }
      }

      /**
       * 기존에 있던 다른 필터(검색, 정렬 등)들의 이벤트 리스너를 설정하는 함수
       */
      function initializeExistingFilters() {
        const searchForm = document.getElementById('searchForm');
        const hasAttachmentSelect = document.getElementById('hasAttachment');
        const orderDirectionSelect = document.getElementById('orderDirection');
        const orderBySelect = document.getElementById('orderBy');

        // 즉시 변경이 필요한 필터들에 'change' 이벤트 리스너 추가
        [hasAttachmentSelect, orderDirectionSelect, orderBySelect].forEach(element => {
          if (element) {
            element.addEventListener('change', () => searchForm.submit());
          }
        });
      }

      // 관리자 필터 호출
      function renderAdminCourseFilter(isInProgress = null) {
        // API 호출 주소를 '/api/management/courses'로 변경
        axios.get(`/api/management/courses`, {
          // 이 API가 요구하는 파라미터들을 전송
          params: {
            loginUserId: loginUserId,       // 스크립트 상단에 이미 있는 변수
            loginUserType: loginUserType,     // 스크립트 상단에 이미 있는 변수
            isInProgress: isInProgress,
            pagingSize: 1000                // 전체 과정을 다 가져오기 위해 충분히 큰 값 설정
          }
        })
        .then(function (response) {
          // 응답 데이터의 구조에 맞춰 과정 목록을 꺼냅니다.
          const courses = response.data.data.respDTOS;

          // 이 목록을 기존 함수에 그대로 전달하면 됩니다.
          renderCourseFilterOptionsForAdmin("#course-select", courses);
        })
        .catch(function (error) {
          console.error("관리자 과정 목록 API 호출 실패:", error);
        });
      }

      // 관리자 필터 생성
      function renderCourseFilterOptionsForAdmin(selector, data) {
        const currentCourseId = new URLSearchParams(window.location.search).get("courseId");
        let $courseFilter = $(selector);
        $courseFilter.empty();

        let courseFilterPlaceholder = "<option value=\"\">전체(과정별)</option>";
        $courseFilter.append(courseFilterPlaceholder);

        // data는 이제 [{id: ..., name: ...}, ...] 형태의 객체 배열입니다.
        $.each(data, function (index, course) {
          // course 객체의 'id'를 option의 value로, 'name'을 표시되는 텍스트로 사용합니다.
          let courseOption = `<option value="${course.id}">${course.name}</option>`;

          // 페이지가 리로드 되어도 선택했던 과정이 계속 선택된 상태로 보이게 하는 로직
          if (course.id == currentCourseId) {
            courseOption = `<option value="${course.id}" selected>${course.name}</option>`;
          }
          $courseFilter.append(courseOption);
        });
      }

      // 진행상황별 필터 선택시 조건에 맞는 강좌 불러오기 (관리자)
      $("#is-in-progress").on("change", function () {
        console.log("진행상황 필터!!!");
        let isInProgress = $(this).val(); // 진행상황 값

        if (isInProgress === "") {
          // "전체(진행별)"을 클릭했을 경우 => 전체 리스트 가져오기
          $courseFilter.empty(); // 진행별 드롭다운 초기화

          let courseFilterPlaceholder = "<option value=\"\">전체(과정별)</option>";
          $courseFilter.append(courseFilterPlaceholder);

          // 과정별 필터에 모든 과정명 불러오기
          renderAdminCourseFilter();

          return;
        }

        renderAdminCourseFilter(isInProgress);
      });

      // 과정별 필터 값을 바꾸었을 때 리스트 불러오기 (관리자)
      $("#course-select").on("change", function () {
        const courseId = $(this).val();
        // 검색 폼의 숨겨진 courseId 값을 변경하고 폼을 제출합니다.
        $("#searchCourseId").val(courseId);
        $("#searchForm").submit();
      });

      $("#debateRegisterBtn").on("click", function (e) {
        e.preventDefault();

        let selectedCourseId;
        if (loginUserType === 'ADMINISTRATOR') {
          selectedCourseId = $("#course-select").val();
        } else {
          selectedCourseId = $("#courseSelector").val();
        }

        if (!selectedCourseId) {
          Swal.fire({
            title: "먼저 과정을 선택해주세요.",
            icon: "warning",
          });
          return;
        }

        $("#courseIdForRegister").val(selectedCourseId);
        $("#registerForm").submit();
      });


    </script>
  </th:block>
</body>
</html>
