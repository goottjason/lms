<!DOCTYPE html>
<html
    lang="ko"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{layout/basic.html}">
<head>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div layout:fragment="content">
  <input type="hidden" th:value="${session.loginUser.id}" id="login-user-id">
  <input type="hidden" th:value="${session.loginUser.type}" id="login-user-type">
  <!-- content header 시작 -->
  <div class="row align-items-center">
    <h1 class="h3 col-3 mx-3 mb-3 text-gray-800">토론 등록</h1>
  </div>
  <!-- content header 끝 -->

  <!-- content body 시작 -->
  <form class="mb-4" method="post" id="registerForm"
        th:action="@{/courseBoardDebate/debateRegister}" th:object="${courseBoardDebateDTO}" enctype="multipart/form-data">
    <input type="hidden" th:field="*{courseId}">
    <div th:object="${pagingRequestDTO}">
      <input type="hidden" name="pageNo" th:value="*{pageNo}" />
      <input type="hidden" name="keyword" th:value="*{keyword}" />
      <input type="hidden" name="type" th:value="*{type}" />
      <input type="hidden" name="orderBy" th:value="*{orderBy}" />
      <input type="hidden" name="orderDirection" th:value="*{orderDirection}" />
      <input type="hidden" name="hasAttachment" th:value="*{hasAttachment}" />
    </div>
    <div class="card shadow mb-4">
      <div class="card-header py-3">
        <div class="row align-items-center">
          <div class="col">
            <h6 class="m-0 font-weight-bold text-primary">토론 등록</h6>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="row mb-2">
          <div class="col-md-12">
            <div class="form-group">
              <label for="title">제목  <b class="text-danger mt-1" id="titleError"></b></label>
              <input type="text" id="title" class="form-control" placeholder="제목을 작성하세요." th:field="*{title}">
            </div>
          </div>
        </div>
        <div class="row mb-2">
          <div class="col-md-12">
            <div class="form-group">
              <label for="contentArea">내용  <b class="text-danger mt-1" id="contentError"></b></label>
              <textarea id="contentArea" class="form-control" placeholder="본문 내용을 작성하세요."
                        style="min-height: 280px; white-space: pre-wrap;" wrap="hard" th:field="*{content}"></textarea>
            </div>
          </div>
        </div>
        <div class="row mb-4">
          <div class="col-md-12">
            <div class="mb-2">첨부파일</div>
            <div class="custom-file">
              <input type="file" class="custom-file-input" id="files" name="files" multiple>
              <label class="custom-file-label" for="files">파일을 선택하세요.</label>
            </div>
          </div>
        </div>
      </div>
    </div>
      <!-- 버튼 -->
    <div class="col-12 d-flex justify-content-end mt-3">
      <button id="submit-btn" type="button" class="btn btn-primary btn-icon-split mr-2">
        <span class="icon text-white-50"><i class="fas fa-upload"></i></span>
        <span class="text px-5">등록</span>
      </button>
      <a th:href="@{/courseBoardDebate/debateList(
        courseId=${pagingRequestDTO.courseId},
        pageNo=${pagingRequestDTO.pageNo},
        pagingSize=${pagingRequestDTO.pagingSize},
        keyword=${pagingRequestDTO.keyword},
        type=${pagingRequestDTO.type},
        orderBy=${pagingRequestDTO.orderBy},
        orderDirection=${pagingRequestDTO.orderDirection},
        hasAttachment=${pagingRequestDTO.hasAttachment})}" class="btn btn-secondary btn-icon-split">
        <span class="icon text-white-50"><i class="fas fa-times"></i></span>
        <span class="text px-5">취소</span>
      </a>
    </div>
  </form>
  <!-- content body 끝 -->
</div>
<th:block layout:fragment="script" th:inline="javascript">
  <script>

    let courseId = [[${courseId}]];
    let userId = [[${userId}]];
    let courseName = [[${courseName}]]
    let fileList = [];
    const MAX_FILE_SIZE = 1024 * 1024 * 8;

    document.addEventListener('DOMContentLoaded', function() {


      const loginUserIdElem = document.getElementById('login-user-id');
      const loginUserTypeElem = document.getElementById('login-user-type');
      const loginUserId = loginUserIdElem ? loginUserIdElem.value : null;
      const loginUserType = loginUserTypeElem ? loginUserTypeElem.value : null;

      const form = document.getElementById('registerForm');
      const submitButton = document.getElementById('submit-btn');
      const titleInput = document.getElementById('title');
      const contentInput = document.getElementById('contentArea');
      const titleError = document.getElementById('titleError');
      const contentError = document.getElementById('contentError');
      const fileInput = document.getElementById('files');
      const fileLabel = document.querySelector('.custom-file-label[for="files"]');

      /*<![CDATA[*/
      const currentCourseId = /*[[${currentCourseId}]]*/ null;
      /*]]>*/

      // --- 폼 유효성 검사 이벤트 리스너 설정 ---
      if (submitButton) {
        submitButton.addEventListener('click', function() {
          const files = fileInput.files;
          for (let i = 0; i < files.length; i++) {
            if (files[i].size > MAX_FILE_SIZE) {
              Swal.fire({
                title: '파일 용량이 초과되었습니다.',
                text: '첨부파일은 개당 10MB를 넘을 수 없습니다.',
                icon: 'warning'
              });
              return; // 용량 초과 시 여기서 함수 실행을 중단하고 서버 전송을 막습니다.
            }
          }

          let isClientValid = true;
          titleError.textContent = '';
          contentError.textContent = '';

          const titleValue = titleInput ? titleInput.value.trim() : '';
          if (titleValue === '') {
            titleError.textContent = '제목을 입력해주세요.';
            isClientValid = false;
          } else if (titleValue.length < 4) {
            titleError.textContent = '제목은 4글자 이상 입력해주세요.';
            isClientValid = false;
          } else if (titleValue.length > 100) {
            titleError.textContent = '제목은 100글자 이하로 입력해주세요.';
            isClientValid = false;
          }

          if (!contentInput || contentInput.value.trim() === '') {
            contentError.textContent = '내용을 입력해주세요.';
            isClientValid = false;
          }

          // --- 유효할 경우에만 AJAX로 제출 ---
          if (isClientValid) {
            const formData = new FormData(form);

            axios.post('/courseBoardDebate/debateRegister', formData, {
              headers: { 'Content-Type': 'multipart/form-data' }
            })
            .then(response => {
              Swal.fire({title: response.data.message}).then(()=>{
                const pageNo = document.querySelector('input[name="pageNo"]').value;
                const keyword = document.querySelector('input[name="keyword"]').value;
                const type = document.querySelector('input[name="type"]').value;
                const courseId = document.querySelector('input[name="courseId"]').value;
                const orderBy = document.querySelector('input[name="orderBy"]').value;
                const orderDirection = document.querySelector('input[name="orderDirection"]').value;
                const hasAttachment = document.querySelector('input[name="hasAttachment"]').value;

                // URLSearchParams를 사용하여 URL을 안전하게 조립합니다.
                const params = new URLSearchParams();
                if (courseId) params.append('courseId', courseId);
                if (pageNo) params.append('pageNo', pageNo);
                if (keyword) params.append('keyword', keyword);
                if (type) params.append('type', type);
                if (orderBy) params.append('orderBy', orderBy);
                if (orderDirection) params.append('orderDirection', orderDirection);
                if (hasAttachment) params.append('hasAttachment', hasAttachment);

                // 완성된 URL로 이동합니다.
                location.href = `/courseBoardDebate/debateList?${params.toString()}`;});
            })
            .catch(error => {
              if (error.response && error.response.data && error.response.data.data) {
                const errorMap = error.response.data.data;
                if (errorMap.title) titleError.textContent = errorMap.title;
                if (errorMap.content) contentError.textContent = errorMap.content;
              } else {
                Swal.fire({
                  title: '등록 중 서버 오류가 발생했습니다.',
                  icon: "error"
                });
                // console.error(error);
              }
            });
          }
        });
      }

      // --- 첨부파일 UI 이벤트 리스너 설정 ---`
      if(fileInput && fileLabel) {
        fileInput.addEventListener('change', function(e) {
          const files = e.target.files;
          if (files.length > 1) {
            fileLabel.textContent = `${files.length}개의 파일이 선택되었습니다.`;
          } else if (files.length === 1) {
            fileLabel.textContent = files[0].name;
          } else {
            fileLabel.textContent = '파일을 선택하세요.';
          }
        });
      }

      // --- 페이지 초기화 함수 정의 및 호출 ---
      async function initializePage() {
        const headerCourseSelector = document.getElementById('courseSelector');
        if (headerCourseSelector) {
          const courses = await fetchCourses(loginUserId, loginUserType);
          updateCourseSelectBox('#courseSelector', courses, currentCourseId);
          headerCourseSelector.disabled = true;
        }
      }

      async function fetchCourses(loginUserId, loginUserType) {
        if (loginUserType === 'ADMINISTRATOR') return [];
        try {
          const response = await axios.get('/api/management/courses', {
            params: { loginUserId: loginUserId, loginUserType: loginUserType }
          });
          return response.data?.data?.respDTOS || [];
        } catch (error) {
          // console.error('과정 목록을 가져오는 중 오류가 발생했습니다:', error);
          return [];
        }
      }

      function updateCourseSelectBox(selector, data, selectedValue) {
        const selectElement = document.querySelector(selector);
        if (!selectElement) return;

        selectElement.innerHTML = '';
        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = '과정을 선택하세요';
        selectElement.appendChild(defaultOption);

        data.forEach(course => {
          const option = document.createElement('option');
          option.value = course.id;
          option.textContent = course.name;
          if (course.id == selectedValue) {
            option.selected = true;
          }
          selectElement.appendChild(option);
        });
      }

      // 페이지 초기화 함수 호출
      initializePage();
    });
  </script>
</th:block>
</body>
</html>
