<!DOCTYPE html>
<html
    lang="ko"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{layout/basic.html}">
<head>
    <title>공지사항 등록</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        #courseSelector {
          display: none !important;
        }

        .file-preview {
          display: flex;
          align-items: center;
          padding: 8px;
          border-bottom: 1px solid #ddd;
        }

        .file-preview img {
          width: 50px;
          height: 50px;
          object-fit: cover;
          margin-right: 10px;
        }

        .file-preview .file-icon {
          width: 50px;
          text-align: center;
          margin-right: 10px;
        }

        .file-preview .file-info {
          flex-grow: 1;
        }

        .file-preview .remove-btn {
          cursor: pointer;
          color: #ff0000;
        }

        .custom-file-input ~ .custom-file-label::after {
          content: "파일찾기";
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="row align-items-center"><h1 class="h3 col-3 mx-3 mb-3 text-gray-800">공지사항 등록</h1></div>
    <form class="mb-4" id="registerForm" enctype="multipart/form-data">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <div class="row align-items-center">
                    <div class="col"><h6 class="m-0 font-weight-bold text-primary">공지사항 정보 입력</h6></div>
                    <div class="col-auto pr-5">
                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="isFixed"
                                name="isFixed"
                                th:disabled="${pinnedCount >= 5}">
                            <label class="form-check-label" for="isFixed">상단 고정</label>
                            <div
                                class="text-danger mt-1"
                                style="font-size: 0.8rem;"
                                id="isFixedError"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row mb-2">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label for="title">제목</label>
                            <input
                                type="text"
                                id="title"
                                name="title"
                                class="form-control"
                                placeholder="제목을 작성하세요.">
                            <div
                                class="text-danger mt-1"
                                style="font-size: 0.8rem;"
                                id="titleError"></div>
                        </div>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label for="contentArea">내용</label>
                            <textarea
                                id="contentArea"
                                name="content"
                                class="form-control"
                                placeholder="본문 내용을 작성하세요."
                                style="min-height: 280px;"></textarea>
                            <div
                                class="text-danger mt-1"
                                style="font-size: 0.8rem;"
                                id="contentError"></div>
                        </div>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-md-12">
                        <div class="mb-2">첨부파일</div>
                        <div class="custom-file">
                            <input
                                type="file"
                                class="custom-file-input"
                                id="files"
                                name="files"
                                multiple>
                            <label class="custom-file-label" for="files">파일을 선택하세요.</label>
                        </div>
                    </div>
                </div>
                <div id="file-preview-list" class="list-group"></div>
            </div>
        </div>
        <div class="col-12 d-flex justify-content-end mt-3">
            <button id="submit-btn" type="button" class="btn btn-primary btn-icon-split mr-2">
                <span class="icon text-white-50"><i class="fas fa-upload"></i></span><span class="text px-5">등록</span>
            </button>
            <a th:href="@{/communityNotice/noticeList}" class="btn btn-secondary btn-icon-split">
                <span class="icon text-white-50"><i class="fas fa-times"></i></span><span class="text px-5">취소</span>
            </a>
        </div>
    </form>
</div>
<th:block layout:fragment="script" th:inline="javascript">
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const fileInput   = document.getElementById("files");
        const fileLabel   = document.querySelector(".custom-file-label");
        const previewList = document.getElementById("file-preview-list");
        let selectedFiles = [];

        fileInput.addEventListener("change", function (e) {
            const files = e.target.files;
            for (const file of files) {
                selectedFiles.push(file);
            }
            updateFileLabel();
            renderPreviews();
            this.value = "";
        });

        function updateFileLabel() {
            if (selectedFiles.length > 1) {
                fileLabel.textContent = `${selectedFiles.length}개의 파일이 선택되었습니다.`;
            } else if (selectedFiles.length === 1) {
                fileLabel.textContent = selectedFiles[0].name;
            } else {
                fileLabel.textContent = "파일을 선택하세요.";
            }
        }

        function renderPreviews() {
            previewList.innerHTML = "";
            selectedFiles.forEach((file, index) => {
                const previewItem     = document.createElement("div");
                previewItem.className = "list-group-item file-preview";
                let preview           = "";
                if (file.type.startsWith("image/")) {
                    const reader  = new FileReader();
                    reader.onload = function (e) {
                        previewItem.querySelector("img").src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                    preview = `<img src="" alt="preview">`;
                } else {
                    preview = `<div class="file-icon"><i class="fas fa-file-alt fa-3x"></i></div>`;
                }
                previewItem.innerHTML = `<div class="d-flex align-items-center">${preview}<div class="file-info">${file.name}</div></div><div class="remove-btn" data-index="${index}" style="cursor:pointer; color:red;"><i class="fas fa-times"></i></div>`;
                previewList.appendChild(previewItem);
            });
        }

        previewList.addEventListener("click", function (e) {
            if (e.target.closest(".remove-btn")) {
                const indexToRemove = parseInt(e.target.closest(".remove-btn").dataset.index, 10);
                selectedFiles.splice(indexToRemove, 1);
                updateFileLabel();
                renderPreviews();
            }
        });

        const submitButton = document.getElementById("submit-btn");
        submitButton.addEventListener("click", function () {
            document.getElementById("titleError").textContent   = "";
            document.getElementById("contentError").textContent = "";
            document.getElementById("isFixedError").textContent = "";

            const formData = new FormData();
            formData.append("title", document.getElementById("title").value);
            formData.append("content", document.getElementById("contentArea").value);
            formData.append("isFixed", document.getElementById("isFixed").checked);
            selectedFiles.forEach(file => {
                formData.append("files", file);
            });

            axios.post("/communityNotice/noticeRegister", formData)
                 .then(response => {
                     Swal.fire({icon: "success", title: response.data.message})
                         .then(() => {
                             location.href = "/communityNotice/noticeList";
                         });
                 })
                 .catch(error => {
                     if (error.response && error.response.data && error.response.data.errors) {
                         const errors = error.response.data.errors;
                         if (errors.title) {
                             document.getElementById(
                                 "titleError").textContent = errors.title;
                         }
                         if (errors.content) {
                             document.getElementById(
                                 "contentError").textContent = errors.content;
                         }
                         if (errors.isFixed) {
                             document.getElementById(
                                 "isFixedError").textContent = errors.isFixed;
                         }
                     } else {
                         Swal.fire({icon: 'error', title: '등록 중 오류가 발생했습니다.'});
                     }
                 });
        });
    });
  </script>
</th:block>
</body>
</html>
