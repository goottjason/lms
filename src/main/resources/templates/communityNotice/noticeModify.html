<!DOCTYPE html>
<html
    lang="ko"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{layout/basic.html}">
<head>
    <title>공지사항 수정</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        #courseSelector {
          display: none !important;
        }

        .file-preview {
          display: flex;
          align-items: center;
          padding: 8px;
          border-bottom: 1px solid #ddd;
        }

        .file-preview img {
          width: 50px;
          height: 50px;
          object-fit: cover;
          margin-right: 10px;
        }

        .file-preview .file-icon {
          width: 50px;
          text-align: center;
          margin-right: 10px;
        }

        .file-preview .file-info {
          flex-grow: 1;
        }

        .file-preview .remove-btn {
          cursor: pointer;
          color: #ff0000;
        }

        .custom-file-input ~ .custom-file-label::after {
          content: "파일찾기";
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="row align-items-center"><h1 class="h3 col-3 mx-3 mb-3 text-gray-800">공지사항 수정</h1></div>
    <form class="mb-4" id="modifyForm" enctype="multipart/form-data" th:object="${notice}">
        <input type="hidden" th:field="*{id}">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <div class="row align-items-center">
                    <div class="col"><h6 class="m-0 font-weight-bold text-primary">공지사항 정보 수정</h6></div>
                    <div class="col-auto pr-5">
                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="isFixed"
                                name="isFixed"
                                th:field="*{isFixed}"
                                th:disabled="${pinnedCount >= 5 and !notice.isFixed}">
                            <label class="form-check-label" for="isFixed">상단 고정</label>
                            <div
                                class="text-danger mt-1"
                                style="font-size: 0.8rem;"
                                id="isFixedError"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row mb-2">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label for="title">제목</label>
                            <input
                                type="text"
                                id="title"
                                name="title"
                                class="form-control"
                                th:field="*{title}">
                            <div
                                class="text-danger mt-1"
                                style="font-size: 0.8rem;"
                                id="titleError"></div>
                        </div>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label for="contentArea">내용</label>
                            <textarea
                                id="contentArea"
                                name="content"
                                class="form-control"
                                style="min-height: 280px;"
                                th:field="*{content}"></textarea>
                            <div
                                class="text-danger mt-1"
                                style="font-size: 0.8rem;"
                                id="contentError"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">첨부파일 수정</h6></div>
            <div class="card-body">
                <div class="mb-2">기존 첨부파일</div>
                <ul class="list-group mb-3">
                    <li
                        th:each="file : ${files}"
                        class="list-group-item d-flex justify-content-between align-items-center">
                        <span th:text="${file.originalName}"></span>
                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="deleteFiles"
                                th:value="${file.id}"
                                th:id="'delFile' + ${file.id}">
                            <label
                                class="form-check-label text-danger"
                                th:for="'delFile' + ${file.id}">삭제</label>
                        </div>
                    </li>
                    <li th:if="${#lists.isEmpty(files)}" class="list-group-item text-muted">기존 첨부파일이 없습니다.</li>
                </ul>

                <div class="mb-2">새로 첨부할 파일</div>
                <div class="custom-file">
                    <input
                        type="file"
                        class="custom-file-input"
                        id="addFiles"
                        name="addFiles"
                        multiple>
                    <label class="custom-file-label" for="addFiles">파일을 선택하세요.</label>
                </div>
                <div id="file-preview-list" class="list-group mt-3"></div>
            </div>
        </div>

        <div class="col-12 d-flex justify-content-end mt-3">
            <button id="submit-btn" type="button" class="btn btn-primary btn-icon-split mr-2">
                <span class="icon text-white-50"><i class="fas fa-check"></i></span><span class="text px-5">수정</span>
            </button>
            <a
                th:href="@{/communityNotice/noticeDetail/{id}(id=*{id},
                           pageNo=${pagingRequestDTO.pageNo},
                           pagingSize=${pagingRequestDTO.pagingSize},
                           searchType=${pagingRequestDTO.searchType},
                           keyword=${pagingRequestDTO.keyword},
                           sortProperty=${pagingRequestDTO.sortProperty},
                           sortOrder=${pagingRequestDTO.sortOrder})}"
                class="btn btn-secondary btn-icon-split">
                <span class="icon text-white-50"><i class="fas fa-times"></i></span><span class="text px-5">취소</span>
            </a>
        </div>
    </form>
</div>
<th:block layout:fragment="script" th:inline="javascript">
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const fileInput   = document.getElementById("addFiles");
        const fileLabel   = document.querySelector(".custom-file-label[for=\"addFiles\"]");
        const previewList = document.getElementById("file-preview-list");
        let newFiles      = [];

        fileInput.addEventListener("change", function (e) {
            for (const file of e.target.files) {
                newFiles.push(file);
            }
            updateFileLabel();
            renderNewFilePreviews();
            this.value = "";
        });

        function updateFileLabel() {
            if (newFiles.length > 1) {
                fileLabel.textContent = `${newFiles.length}개의 파일이 선택되었습니다.`;
            } else if (newFiles.length === 1) {
                fileLabel.textContent = newFiles[0].name;
            } else {
                fileLabel.textContent = "파일을 선택하세요.";
            }
        }

        function renderNewFilePreviews() {
            previewList.innerHTML = "";
            newFiles.forEach((file, index) => {
                const previewItem     = document.createElement("div");
                previewItem.className = "list-group-item file-preview";
                let preview           = "";
                if (file.type.startsWith("image/")) {
                    const reader  = new FileReader();
                    reader.onload = function (e) {
                        previewItem.querySelector("img").src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                    preview = `<img src="" alt="preview">`;
                } else {
                    preview = `<div class="file-icon"><i class="fas fa-file-alt fa-3x"></i></div>`;
                }
                previewItem.innerHTML = `<div class="d-flex align-items-center">${preview}<div class="file-info">${file.name}</div></div><div class="remove-btn" data-index="${index}"><i class="fas fa-times"></i></div>`;
                previewList.appendChild(previewItem);
            });
        }

        previewList.addEventListener("click", function (e) {
            if (e.target.closest(".remove-btn")) {
                const indexToRemove = parseInt(e.target.closest(".remove-btn").dataset.index, 10);
                newFiles.splice(indexToRemove, 1);
                updateFileLabel();
                renderNewFilePreviews();
            }
        });

        const submitButton = document.getElementById("submit-btn");
        submitButton.addEventListener("click", function () {
            // 이전 에러 메시지 초기화
            document.getElementById("titleError").textContent   = "";
            document.getElementById("contentError").textContent = "";
            document.getElementById("isFixedError").textContent = "";

            // DTO의 파라미터를 JavaScript 변수로 저장
            const params = {
                pageNo: /*[[${pagingRequestDTO.pageNo}]]*/ 1,
                pagingSize: /*[[${pagingRequestDTO.pagingSize}]]*/ 10,
                searchType: /*[[${pagingRequestDTO.searchType}]]*/ '',
                keyword: /*[[${pagingRequestDTO.keyword}]]*/ '',
                sortProperty: /*[[${pagingRequestDTO.sortProperty}]]*/ 'createdAt',
                sortOrder: /*[[${pagingRequestDTO.sortOrder}]]*/ 'DESC'
            };

            // URL 쿼리 스트링으로 변환 (값이 있는 파라미터만 포함)
            const queryString = Object.keys(params)
                                      .filter(key => params[key] !== null && params[key] !== '')
                                      .map(key => `${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`)
                                      .join('&');

            // 서버로 보낼 FormData 생성
            const formData = new FormData();
            formData.append("id", document.querySelector("input[name='id']").value);
            formData.append("title", document.getElementById("title").value);
            formData.append("content", document.getElementById("contentArea").value);
            formData.append("isFixed", document.getElementById("isFixed").checked);

            document.querySelectorAll("input[name='deleteFiles']:checked").forEach(cb => {
                formData.append("deleteFiles", cb.value);
            });

            newFiles.forEach(file => {
                formData.append("addFiles", file);
            });

            // Axios를 사용하여 서버에 비동기 POST 요청
            axios.post("/communityNotice/noticeModify", formData)
                 .then(response => {
                     // 성공 시 SweetAlert2 알림창 표시
                     if($("#isFixed").prop("checked")){
                         sendNotificationToAll(`(중요) 공지사항이 등록되었습니다. ${$("#title").val()}`, false,
                                               `/communityNotice/noticeDetail/${document.querySelector("input[name='id']").value}`)
                     }


                     Swal.fire({icon: "success", title: response.data.message})
                         .then(() => {
                             // 확인 버튼 클릭 시, 페이징 정보가 포함된 URL로 상세 페이지 이동
                             location.href = `/communityNotice/noticeDetail/${response.data.noticeId}?${queryString}`;
                         });
                 })
                 .catch(error => {
                     // 실패 시 에러 처리
                     if (error.response && error.response.data && error.response.data.errors) {
                         const errors = error.response.data.errors;
                         if (errors.title) { document.getElementById("titleError").textContent = errors.title; }
                         if (errors.content) { document.getElementById("contentError").textContent = errors.content; }
                         if (errors.isFixed) { document.getElementById("isFixedError").textContent = errors.isFixed; }
                     } else {
                         Swal.fire({icon: 'error', title: '수정 중 오류가 발생했습니다.'});
                     }
                 });
        });
    });
  </script>
</th:block>
</body>
</html>
