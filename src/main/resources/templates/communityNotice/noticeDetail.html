<!DOCTYPE html>
<html
    lang="ko"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{layout/basic.html}">
<head>
    <title>공지사항 상세</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>

        #courseSelector {
          display: none !important;
        }

      .content-pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: inherit;
        font-size: 1rem;
        color: #5a5c69;
        padding: 1.25rem;
        min-height: 200px;
      }
    </style>
</head>

<body>
<div layout:fragment="content">

    <div class="row align-items-center">
        <h1 class="h3 col-3 mx-3 mb-3 text-gray-800">공지사항 상세</h1>
    </div>

    <div class="row">
        <div class="col-md-4 col-sm-6 mb-3">
            <div class="card border-left-primary shadow-sm py-1">
                <div class="card-body py-2 px-3">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">작성자</div>
                            <div class="h6 mb-0 text-gray-800" th:text="${notice.writerName}"></div>
                        </div>
                        <div class="col-auto"><i class="fas fa-user fa-lg text-gray-300"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-3">
            <div class="card border-left-primary shadow-sm py-1">
                <div class="card-body py-2 px-3">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">작성일</div>
                            <div class="h6 mb-0 text-gray-800" th:text="${#temporals.format(notice.createdAt,'yyyy-MM-dd')}"></div>
                        </div>
                        <div class="col-auto"><i class="fas fa-calendar fa-lg text-gray-300"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-3">
            <div class="card border-left-info shadow-sm py-1">
                <div class="card-body py-2 px-3">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-info text-uppercase mb-1">조회수</div>
                            <div class="h6 mb-0 text-gray-800" th:text="${notice.readCount}"></div>
                        </div>
                        <div class="col-auto"><i class="fas fa-eye fa-lg text-gray-300"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary" th:text="${notice.title}"></h6>
        </div>
        <div class="card-body py-5" style="min-height: 280px; white-space: pre-wrap;" th:text="${notice.content}"></div>

        <div class="card-footer" th:if="${files != null and !files.isEmpty()}">
            <p class="mt-2 font-weight-bold">첨부파일</p>
            <div class="row">
                <div class="col-md-6 col-lg-4 mb-2" th:each="file : ${files}">
                    <div class="card h-100">
                        <div class="row g-0 m-0 h-100">
                            <div class="col-4 d-flex align-items-center justify-content-center p-2">
                                <th:block th:if="${file.isImage}">
                                    <img th:src="${file.path}" class="img-fluid rounded-start" style="max-height: 70px; object-fit: contain;">
                                </th:block>
                                <th:block th:unless="${file.isImage}">
                                    <img th:src="@{/img/no-image.jpg}" class="img-fluid rounded-start" style="height: 70px; object-fit: cover;">
                                </th:block>
                            </div>
                            <div class="col-8 d-flex align-items-center ps-2">
                                <a class="card-title mb-0 text-truncate"
                                   th:text="${file.originalName}"
                                   th:href="@{/download(fileId=${file.id})}">
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-end mb-4">
         <th:block th:if="${userType == 'ADMINISTRATOR'}">
            <a th:href="@{/communityNotice/noticeModify/{id}(id=${notice.id},
                             pageNo=${pagingRequestDTO.pageNo},
                             pagingSize=${pagingRequestDTO.pagingSize},
                             searchType=${pagingRequestDTO.searchType},
                             keyword=${pagingRequestDTO.keyword},
                             sortProperty=${pagingRequestDTO.sortProperty},
                             sortOrder=${pagingRequestDTO.sortOrder})}"
               class="btn btn-info btn-icon-split mr-2">
                <span class="icon text-white-50"><i class="fa fa-wrench"></i></span>
                <span class="text px-3">수정</span>
            </a>
            <form th:action="@{/communityNotice/noticeDelete/{id}(id=${notice.id})}" method="post" id="deleteForm">
                <button type="button" class="btn btn-danger btn-icon-split" id="btn-remove">
                    <span class="icon text-white-50"><i class="fa fa-times"></i></span>
                    <span class="text px-3">삭제</span>
                </button>
            </form>
        </th:block>

        <a th:href="@{/communityNotice/noticeList(pageNo=${pagingRequestDTO.pageNo},
                         pagingSize=${pagingRequestDTO.pagingSize},
                         searchType=${pagingRequestDTO.searchType},
                         keyword=${pagingRequestDTO.keyword},
                         sortProperty=${pagingRequestDTO.sortProperty},
                         sortOrder=${pagingRequestDTO.sortOrder})}"
           class="btn btn-secondary btn-icon-split ml-2">
            <span class="icon text-white-50"><i class="fas fa-list"></i></span>
            <span class="text px-4">목록</span>
        </a>
    </div>
</div>

<th:block layout:fragment="script" th:inline="javascript">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const removeBtn = document.getElementById("btn-remove");
            if (removeBtn) {
                removeBtn.addEventListener("click", function () {
                    Swal.fire({
                                  title: "정말로 삭제하시겠습니까?",
                                  text: "삭제된 데이터는 복구할 수 없습니다.",
                                  icon: "warning",
                                  showCancelButton: true,
                                  confirmButtonColor: "#d33",
                                  cancelButtonColor: "#858796",
                                  confirmButtonText: "네, 삭제합니다.",
                                  cancelButtonText: "아니오"
                              }).then((result) => {
                        if (result.isConfirmed) {
                            document.getElementById('deleteForm').submit();
                        }
                    });
                });
            }
        });
    </script>
</th:block>
</body>
</html>
