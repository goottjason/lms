<!DOCTYPE html>
<html
  lang="ko"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
  layout:decorate="~{layout/basic.html}">
<head>

</head>
<body>
<div layout:fragment="content">
  <!-- content header 시작 -->
  <div class="row align-items-center">
    <h1 class="h3 col-3 mx-3 mb-3 text-gray-800">1:1문의 등록</h1>
  </div>
  <!-- content header 끝 -->

  <!-- content body 시작 -->
  <form class="mb-4" method="POST" th:action="@{/communityInquiry/inquiryRegister}">
    <div class="card shadow mb-4">
      <div class="card-header py-3">
        <div class="row align-items-center">
          <div class="col">
            <h6 class="m-0 font-weight-bold text-primary">1:1문의 등록</h6>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="row mb-2">
          <div class="col-md-12">
            <div class="form-group">
              <label for="title">제목<span class="text-danger">*</span>&nbsp;&nbsp;</label>
              <span id="title-msg" class="text-danger small"></span>
              <input
                type="text" id="title" name="title" class="form-control"
                placeholder="제목을 입력하세요.">
            </div>
          </div>
        </div>
        <div class="row mb-2">
          <div class="col-md-12">
            <div class="form-group">
              <label for="inquiry">내용*</span>&nbsp;&nbsp;</label>
              <span id="inquiry-msg" class="text-danger small"></span>
              <textarea
                id="inquiry"
                name="inquiry"
                class="form-control"
                placeholder="본문 내용을 작성하세요."
                style="height: 280px; white-space: pre-wrap;" wrap="hard"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- 버튼 -->
    <div class="col-12 d-flex justify-content-end mt-3">
      <button type="submit" id="" class="btn btn-primary btn-icon-split mr-2">
        <span class="icon text-white-50">
            <i class="fas fa-upload"></i>
        </span>
        <span class="text px-5">등록</span>
      </button>
      <a id="" class="btn btn-secondary btn-icon-split"
         th:href="|@{/communityInquiry/inquiryList}?${inquiryRequestParam.getQueryString()}">
        <span class="icon text-white-50">
            <i class="fas fa-times"></i>
        </span>
        <span class="text px-5">취소</span>
      </a>
    </div>
  </form>
  <!-- content body 끝 -->
</div>
<th:block layout:fragment="script" th:inline="javascript">
  <script>
    $("#courseSelector").hide();

    $("#signupForm").on("submit", function (e) {

      if (!validateTitle()) {
        e.preventDefault();
      }
      if (!validateInquiry()) {
        e.preventDefault();
      }
    });

    function validateTitle() {
      let title     = $("#title").val();
      let $titleMsg = $("#title-msg");

      if (title.length === 0) {
        $titleMsg.text("제목을 입력해주세요.");
        return false;
      }

      if (title.length > 100) {
        $titleMsg.text("제목은 100자 아내로 입력하셔야 합니다.");
        return false;
      }

      // 정상일 경우
      $titleMsg.text("");
      return true;
    }

    function validateInquiry() {
      let inquiry     = $("#inquiry").val();
      let $inquiryMsg = $("#inquiry-msg");

      if (inquiry.length > 1000) {
        $inquiryMsg.text("문의 내용은 1000자 아내로 입력하셔야 합니다.");
        return false;
      }

      // 정상일 경우
      $inquiryMsg.text("");
      return true;
    }

  </script>
</th:block>
</body>
</html>
