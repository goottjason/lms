<!DOCTYPE html>
<html
    lang="ko"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{layout/basic.html}">
<head>
  <script
      src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script defer th:src="@{/js/training/trainingModify.js}"></script>
  <script defer th:src="@{/js/training/signature.js}"></script>
  <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.10/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.10/dist/sweetalert2.min.js"></script>
  <style>
    #courseSelector {
      display: none;
    }

    .tooltip-inner {
      max-width: 300px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }


    #content {
      opacity: 1;
      transition: opacity 1s ease-in-out;
    }

    .clickable-name {
      cursor: pointer;
      color: #007bff;
      text-decoration: underline;
    }

  </style>
</head>
<body>
<div layout:fragment="content" id="content">
  <!-- content header 시작 -->

  <!-- Signature Modal -->
  <div
      class="modal fade" id="signatureModal" tabindex="-1" role="dialog"
      aria-labelledby="signatureModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="signatureModalLabel">✍️ 전자 서명 입력</h5>
          <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <div class="modal-body text-center">
          <canvas id="canvas" width="500" height="500" style="border:1px solid #000;"></canvas>

          <div class="mt-3">
            <button type="button" class="btn btn-secondary mr-2" id="undo">Undo</button>
            <button type="button" class="btn btn-outline-secondary" id="redo">Redo</button>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-dismiss="modal">닫기</button>
          <button class="btn btn-primary" id="save">저장</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Signature Modal 끝 -->

  <!-- 학생 이름(해당 창 hover or click시 토스트창 띄우기) -->
  <!--  <div class="toast" data-autohide="false"-->
  <!--       style="position: fixed; top: 100px; right: 600px; z-index: 1055; width: 300px; height: auto;">-->
  <!--    <div class="toast-header">-->
  <!--      <strong class="mr-auto text-primary toast-strong"></strong>-->
  <!--      <small class="text-muted"></small>-->
  <!--      <button type="button" class="ml-2 mb-1 close" data-dismiss="toast">&times;</button>-->
  <!--    </div>-->
  <!--    <div class="toast-body">-->
  <!--      Some text inside the toast body-->
  <!--    </div>-->
  <!--  </div>-->
  <!-- toast 끝 -->

  <div class="container bg-white shadow rounded p-4 mb-4">
    <h1 class="h3 mb-2 text-gray-800 text-center" id="detailTitle">훈련 일지 상세</h1>

    <!-- 상단 버튼 -->
    <div class="row mb-3">
      <!-- 왼쪽: 서명 또는 결재 버튼 -->
      <div class="col-auto d-flex align-items-center">
        <div
            th:if="${loginUserType == 'ADMINISTRATOR' && (signatureList == null || signatureList.isEmpty())}">
          <button
              class="btn btn-info btn-sm"
              id="signature"
              data-toggle="modal"
              data-target="#signatureModal">결재란
          </button>
        </div>

        <table
            class="table table-bordered mt-3" style="max-width: 300px; border-radius: 6px;"
            th:if="${signatureList != null && !signatureList.isEmpty()}">
          <tbody>
          <tr>
            <th scope="row" class="text-center align-middle bg-light" style="width: 80px;">결재란</th>
            <td class="p-2">
              <img
                  th:src="${signatureList[0].getPath()}"
                  class="img-fluid rounded border"
                  style="height: 60px; width: 60px; object-fit: contain;">
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- 오른쪽: 엑셀 버튼 -->
      <div class="col text-right">
        <button class="btn btn-outline-success btn-sm" id="excel">엑셀 다운</button>
      </div>
    </div>

    <!-- 과정 정보 -->
    <div class="form-row mb-3" th:if="${finalSelectTraining != null}">
      <div class="form-group col-md-6">
        <label><strong>과정명</strong></label>
        <input
            type="text" class="form-control" readonly
            th:value="${finalSelectTraining.getName()}">
      </div>
      <div class="form-group col-md-4">
        <label><strong>훈련 일자</strong></label>
        <input
            type="text" class="form-control" readonly
            th:value="${finalSelectTraining.getTrainingDate()}">
      </div>
      <div class="form-group col-md-2">
        <label><strong>총 수강생 수</strong></label>
        <input
            type="text" class="form-control" readonly
            th:value="${finalSelectTraining.getNumberOfLearner()}">
      </div>
    </div>

    <!-- 출석 정보 -->
    <div
        class="table-responsive mb-4"
        th:if="${finalSelectTraining != null && finalSelectTraining.getResponseParticipationDTO() != null}">

      <table class="table table-bordered text-center">
        <thead class="thead-light">
        <tr>
          <th>출석</th>
          <th>지각</th>
          <th>결석</th>
          <th>조퇴</th>
          <th>휴가</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td
              th:text="${finalSelectTraining.getResponseParticipationDTO().getAttendanceCount()}"
              data-toggle="tooltip"
              th:title="${finalSelectTraining.getResponseParticipationDTO().getAttendanceList()}"
              style="cursor: pointer;"
              data-name="출석">조회
          </td>
          <td
              th:text="${finalSelectTraining.getResponseParticipationDTO().getLateCount()}"
              data-toggle="tooltip"
              th:title="${finalSelectTraining.getResponseParticipationDTO().getLateList()}"
              style="cursor: pointer;"
              data-name="지각">조회
          </td>
          <td
              th:text="${finalSelectTraining.getResponseParticipationDTO().getAbsenceCount()}"
              data-toggle="tooltip"
              th:title="${finalSelectTraining.getResponseParticipationDTO().getAbsenceList()}"
              style="cursor: pointer;"
              data-name="결석">조회
          </td>
          <td
              th:text="${finalSelectTraining.getResponseParticipationDTO().getLeaveEarLyCount()}"
              data-toggle="tooltip"
              th:title="${finalSelectTraining.getResponseParticipationDTO().getLeaveEarLyList()}"
              style="cursor: pointer;"
              data-name="조퇴">조회
          </td>
          <td
              th:text="${finalSelectTraining.getResponseParticipationDTO().getVacationPaddingCount()}"
              th:data-id="${finalSelectTraining.getResponseParticipationDTO().getVacationPaddingList()}"
              data-toggle="tooltip"
              th:title="${finalSelectTraining.getResponseParticipationDTO().getVacationPaddingList()}"
              style="cursor: pointer;"
              data-name="휴가">조회
          </td>
        </tr>
        </tbody>
      </table>
    </div>


    <!-- 훈련 과목 -->
    <div class="table-responsive mb-4">
      <span id="fieldError" style="color: red;"></span>
      <table class="table table-bordered text-center">
        <thead class="thead-light">
        <tr>
          <th style="width: 10%">교시</th>
          <th style="width: 45%">훈련 과목</th>
          <th style="width: 45%">훈련 특이사항</th>
        </tr>
        </thead>
        <tbody>
        <!-- 1~7교시 -->


        <th:block th:if="${detailWithSubMap != null}">
          <tr th:each="detail : ${detailWithSubMap.entrySet()}">
            <td th:text="${detail.getKey().period}">1</td>
            <td th:text="${detail.getValue()}">조회</td>
            <td
                th:text="${detail.getKey().actual}" class="detail-actual"
                th:data-id="${detail.getKey().getId()}">조회
            </td>
          </tr>
        </th:block>

        <!-- 위는 서버 렌더링용. HTML만 원하시면 아래 코드로 대체하세요. -->

        </tbody>
      </table>
    </div>

    <!-- 하단 버튼 -->
    <div class="text-right" id="modifyDeleteDiv">
      <button class="btn btn-primary" id="modifyBtn" th:if="${loginUserType == 'INSTRUCTOR'}">
        <span class="icon text-white-50">
        <i class="fa fa-wrench"></i>
      </span>
        <span class="text px-3">수정</span>
      </button>
      <button class="btn btn-danger" data-toggle="modal" data-target="#deleteModal">
         <span class="icon text-white-50">
        <i class="fa fa-times"></i>
      </span>
        <span class="text px-3">삭제</span>
      </button>
      <button id="toList" class="btn btn-secondary btn-icon-split">
      <span class="icon text-white-50">
          <i class="fas fa-list"></i>
      </span>
        <span class="text px-4">목록</span>
      </button>
    </div>

  </div>

  <!-- 삭제 확인 모달 -->
  <div
      class="modal fade" id="deleteModal" tabindex="-1" role="dialog"
      aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content text-center">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">삭제하시겠습니까?</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="닫기">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          해당 훈련일지 및 서명이 모두 삭제됩니다.
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-danger" id="deleteTraining">네</button>
          <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
        </div>
      </div>
    </div>
  </div>


  <!-- content body 끝 -->
</div>
<th:block layout:fragment="script" th:inline="javascript">
  <script>
    let finalSelectTraining = /*[[${finalSelectTraining}]]*/ null;
    let detailWithSubMap = /*[[${detailWithSubMap}]]*/ null;
    let courseId = /*[[${finalSelectTraining.selectTrainingDTO.courseId}]]*/ -1;
    let instructorId = /*[[${finalSelectTraining.selectTrainingDTO.instructorId}]]*/ -1;
    let trainingId =  /*[[${finalSelectTraining.selectTrainingDTO.id}]]*/ -1;

    $(document).ready(function () {
      $("[data-toggle=\"tooltip\"]").tooltip({
        placement: "top",
        boundary: "window",
        trigger: "hover",
        html: true,
        container: "body"
      });
    });

    $(function () {
      // console.log("finalSelectTraining", finalSelectTraining);
      // console.log("detailWithSubMap", detailWithSubMap);

      // 엑셀 다운로드 버튼 클릭
      $("#excel").on("click", function (e) {
        // alert("excel");
        e.preventDefault();

        let data = {
          finalSelectTraining: finalSelectTraining,
          detailWithSubMap: detailWithSubMap
        };

        // console.log("data", data);

        axios.post("/training/excel", data, {
          responseType: "blob"
        }).then(function (response) {
          // console.log("response", response);
          // blob 객체 생성
          let blob = new Blob([response.data], {type: response.headers['content-type']});
          // 다운로드 할 url 생성
          let downloadUrl = window.URL.createObjectURL(blob);

          // a 태그 / a.href 생성
          let aTag = document.createElement("a");
          aTag.href = downloadUrl;

          // 다운로드 할 파일 이름 가져오기
          aTag.download = window.decodeURI(response.headers['content-disposition'].split(";")[1].split("=")[1]);

          //body에 a 태그를 추가
          document.body.appendChild(aTag);

          aTag.click();
          aTag.remove();

          // window.URL.createObjectURL(blob) 삭제
          window.URL.revokeObjectURL(downloadUrl);

        }).then(function (){
          swal.fire({
            title: "엑셀 다운이 완료되었습니다.",
            text: "파일을 확인해주세요",
            icon: "info",
            confirmButtonText: "예"
          });
        }).catch(function (error) {
          // console.log("error", error);

        });
      });

      $("#toList").on("click", function (e) {
        e.preventDefault();
        window.location.href = "/training/trainingList";
      })

    });

  </script>
</th:block>
</body>
</html>
